        tb.addEventListener('click',(()=>{const id=item.id;const cur={h:d2.getHours(),m:d2.getMinutes()};const nd=fmtDS(d2)!==vd;return e=>{e.stopPropagation();state.editCheckItemId=id;state.editCheckTime=cur;state.editCheckNextDay=nd;state.modal="editCheckTime";render();};})());
        innerRow.appendChild(tb);
      }
      row.appendChild(innerRow);
    }

    wrap.appendChild(row);
  });

  return wrap;
}

// ── たまにやること（N日/N週/Nヶ月ごと・曜日/シフト連動）タブ ──
function renderOccasional(vd){
  const wrap=div({style:{maxWidth:"600px",margin:"0 auto",padding:"10px 16px 60px"}});
  const mdc=mdLabel;
  const card=div({className:"card"});
  card.appendChild(div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}},[
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0"}},"🔁 定期ルーティン"),
    (()=>{const b=btn({style:{fontSize:"11px",padding:"4px 10px",background:"#0ea5e918",border:"1px solid #0ea5e9",borderRadius:"7px",color:"#38bdf8",cursor:"pointer",fontWeight:600}},"＋ 追加");
      b.addEventListener('click',()=>{state.customTodoModal={uid:null,label:"",itype:"week",n:1,startDate:vd,timeH:null,timeM:0,color:"#38bdf8",weekdays:[],shifts:[]};render();});return b;})()
  ]));
  const list=state.customTodos||[];
  if(list.length===0){
    card.appendChild(div({style:{fontSize:"11px",color:"#475569",textAlign:"center",padding:"10px 0"}},"「＋追加」でN日/N週/Nヶ月ごとの項目を登録（曜日・シフト連動も可）"));
  }
  const merge=(date,id,patch)=>{ const cur=(state.todos[date]||{})[id]||{}; setTodo(date,id,{...cur,...patch}); };
  // 並び：当日該当→繰り越し（未実施）→その他
  const rank=ct=>{const o=customTodoOccurrence(ct,vd);if(o&&!o.excluded&&!o.overdue)return 0;if(o&&o.overdue)return 1;if(o&&o.excluded)return 2;return 3;};
  [...list].sort((a,b)=>{const ra=rank(a),rb=rank(b);if(ra!==rb)return ra-rb;return nextCustomTodoDate(a)<nextCustomTodoDate(b)?-1:1;}).forEach(ct=>{
    const occ=customTodoOccurrence(ct,vd);
    const active = occ && !occ.excluded;         // チェック可能（当日 or 繰り越し）
    const done = occ && occ.checked;
    const overdue = occ && occ.overdue;
    const excludedToday = occ && occ.excluded;   // 当日該当だが除外中
    const row=div({style:{display:"flex",alignItems:"center",gap:"10px",padding:"8px 2px",borderBottom:"1px solid #1e3a5f33",opacity:active?1:0.55}});
    if(active){
      const cb=btn({style:{width:"22px",height:"22px",borderRadius:"6px",flexShrink:0,border:`2px solid ${done?"#22c55e":(occ&&occ.snToday)?"#a78bfa":overdue?"#f97316":"#334155"}`,background:done?"#22c55e":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"13px",color:"#fff"}},done?"✓":"");
      cb.addEventListener('click',(()=>{const o=occ,id=ct.uid,c2={...ct},label=ct.label,wasDone=done;return()=>{
        if(wasDone){ merge(vd,id,{checked:false,time:null}); }
        else {
          // チェックしたら、以前の未実施の回（予定）はすべて削除（除外）する
          dismissPastUnchecked(c2,vd);
          // チェックはチェックした当日(vd)に記録
          merge(vd,id,{checked:true,time:new Date().toISOString()});
          showToast(`✅ ${label}`);
        }
      };})());
      row.appendChild(cb);
    } else {
      row.appendChild(div({style:{width:"22px",textAlign:"center",fontSize:"12px",color:"#475569",flexShrink:0}},excludedToday?"⊘":"🔁"));
    }
    const lab=div({style:{flex:1,minWidth:0}});
    lab.appendChild(div({style:{fontSize:"13px",color:done?"#475569":"#e2e8f0",textDecoration:done?"line-through":"none"}},ct.label||"(無題)"));
    const _tt=customTodoTimeFor(ct,vd), _hasWd=ct.weekdayTimes&&Object.keys(ct.weekdayTimes).length;
    const _timeStr=_tt?` ・ ${_tt.h}:${String(_tt.m||0).padStart(2,'0')}${_hasWd?"(曜日別)":""}`:(_hasWd?" ・ 曜日別":"");
    let statusStr; const _snToday=occ&&occ.snToday;
    if(_snToday){ const st=customTodoTimeFor(ct,occ.dueDate); statusStr=`🌙 開始翌日・今日${st?`（${String(st.h).padStart(2,'0')}:${String(st.m||0).padStart(2,'0')}）`:""}`; }
    else if(overdue) statusStr=`🔴 ${occ.daysAgo}日前(${mdc(occ.dueDate)})から未実施`;
    else if(excludedToday) statusStr="除外中";
    else if(occ) statusStr="今日";
    else statusStr="次:"+mdc(nextCustomTodoDate(ct));
    lab.appendChild(div({style:{fontSize:"9px",color:_snToday?"#a78bfa":(overdue?"#f97316":"#64748b")}},`${customTodoIntervalLabel(ct)}${_timeStr}　${statusStr}`));
    row.appendChild(lab);
    // 完了時刻（タップで編集：planCustomTodo の「完了時刻を編集」を開く）
    if(done){
      const recVd=(state.todos[vd]||{})[ct.uid]||{};
      if(recVd.time){
        const dt=new Date(recVd.time);
        const tb=btn({style:{fontSize:"10px",color:"#4ade80",whiteSpace:"nowrap",background:"transparent",border:"1px solid #22c55e44",borderRadius:"6px",padding:"3px 7px",cursor:"pointer",flexShrink:0}},
          `${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')} ✏️`);
        tb.addEventListener('click',(()=>{const uid=ct.uid,l=ct.label||"定期ルーティン";return()=>{ state.planCustomTodo={uid,label:l,vd,editMode:true}; state.modal="planCustomTodo"; render(); };})());
        row.appendChild(tb);
      }
    }
    // 除外／戻す
    if(active){
      const ex=btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"6px",color:"#64748b",cursor:"pointer",fontSize:"10px",padding:"3px 7px",flexShrink:0},title:"この回を除外"},"除外");
      ex.addEventListener('click',(()=>{const dd=occ.dueDate,id=ct.uid;return()=>{pushUndo("定期ルーティンを除外しました");merge(dd,id,{excluded:true,checked:false});};})());
      row.appendChild(ex);
    } else if(excludedToday){
      const un=btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"6px",color:"#64748b",cursor:"pointer",fontSize:"10px",padding:"3px 7px",flexShrink:0}},"戻す");
      un.addEventListener('click',(()=>{const id=ct.uid;return()=>{merge(vd,id,{excluded:false});};})());
      row.appendChild(un);
    }
    const ed=btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"6px",color:"#64748b",cursor:"pointer",fontSize:"11px",padding:"3px 8px",flexShrink:0}},"✏️");
    ed.addEventListener('click',(()=>{const c={...ct};return()=>{state.customTodoModal=c;render();};})());
    row.appendChild(ed);
    card.appendChild(row);
  });
  wrap.appendChild(card);
  return wrap;
}

// ── アルコールタブ ────────────────────────────────
function renderAlcohol(vd,isToday){
  const d=getDaily(vd);
  const drinks=(d.drinks||[]).map(dr=>({...dr,drinkType:resolveDT(dr)}));
  const totalG=drinks.reduce((a,b)=>a+pureAlcohol(b.ml,b.drinkType.pct),0);
  const wrap=div({style:{maxWidth:"600px",margin:"0 auto",padding:"12px 16px 60px"}},[]);

  // BAC計算
  let nowMin=new Date().getHours()*60+new Date().getMinutes();
  const dd=drinks.map(d=>{let startMin=d.hour*60+(d.min||0);if(d.startNextDay)startMin+=1440;let endMin=d.endHour!=null?d.endHour*60+(d.endMin||0):startMin+20;if(d.startNextDay&&d.endHour!=null)endMin+=1440;if(endMin<startMin)endMin+=1440;return{startMin,endMin,alcoholG:pureAlcohol(d.ml,d.drinkType.pct)};});

  const hasNextDay=drinks.some(d=>d.startNextDay);

  // 表示日の翌日が今日か判定（日をまたいで継続中のケース）
  const isViewingYesterday=(()=>{
    const p=vd.split('-');
    const viewD=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
    viewD.setDate(viewD.getDate()+1);
    const nextStr=`${viewD.getFullYear()}-${String(viewD.getMonth()+1).padStart(2,'0')}-${String(viewD.getDate()).padStart(2,'0')}`;
    return nextStr===todayStr();
  })();

  // 現在BACを計算すべきか＆計算用の現在時刻
  let showCurrent=false, nowMinCalc=nowMin;
  if(isToday){
    showCurrent=true;
    nowMinCalc=hasNextDay?nowMin+1440:nowMin;
  } else if(isViewingYesterday){
    // 昨日を表示中：今の時刻は「昨日の24時以降」として扱う
    showCurrent=true;
    nowMinCalc=nowMin+1440;
  }

  const curBac=(drinks.length&&showCurrent)?userBAC(dd,nowMinCalc):0;
  const lv=bacLevel(curBac);

  // 今以降のピーク値
  const peakBac=(drinks.length&&showCurrent)?(() => {
    let peak=curBac;
    for(let t=nowMinCalc;t<=nowMinCalc+8*60;t+=5){
      const b=userBAC(dd,t);
      if(b>peak)peak=b;
    }
    return peak;
  })():0;
  const peakLv=bacLevel(peakBac);

  const graphCard=div({className:"card"},[
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"12px"}},"📊 血中アルコール推移"),

      div({},[
        div({style:{fontSize:"10px",color:"#64748b",marginBottom:"2px"}},"現在の血中アルコール濃度"),
        div({style:{fontSize:"28px",fontWeight:800,color:lv.color,lineHeight:1}},[txt(`${curBac.toFixed(2)}`),span({style:{fontSize:"13px",color:"#64748b"}},"‰")]),
        div({style:{marginTop:"4px",display:"inline-block",fontSize:"11px",padding:"2px 10px",borderRadius:"12px",background:lv.bg,color:lv.color,fontWeight:700,border:`1px solid ${lv.color}55`}},lv.label)
      ]),
      div({style:{textAlign:"right"}},[
        div({style:{fontSize:"10px",color:"#64748b"}},"素面になる目安"),
        div({style:{fontSize:"14px",fontWeight:700,color:"#94a3b8"}},getSoberTime(drinks))
      ])
    ]),
    // 今後のピーク値
    drinks.length>0?div({style:{display:"flex",alignItems:"center",gap:"12px",padding:"8px 12px",background:"#0f172a",borderRadius:"8px",marginBottom:"10px"}},[
      div({},[
        div({style:{fontSize:"10px",color:"#64748b",marginBottom:"2px"}},"今後の最大血中アルコール濃度"),
        div({style:{display:"flex",alignItems:"baseline",gap:"6px"}},[
          div({style:{fontSize:"22px",fontWeight:800,color:peakLv.color}},[txt(`${peakBac.toFixed(2)}`),span({style:{fontSize:"11px",color:"#64748b"}},"‰")]),
          div({style:{fontSize:"11px",padding:"1px 8px",borderRadius:"10px",background:peakLv.bg,color:peakLv.color,border:`1px solid ${peakLv.color}55`}},peakLv.label)
        ])

  // ⚙️ 計算条件（体重・性別）— BACはWidmark式で体重・性別に依存
  {

    [['m','男性'],['f','女性']].forEach(([k,l])=>{

function getSoberTime(drinks){
  if(!drinks.length)return"—";
  const dd=drinks.map(d=>{let startMin=d.hour*60+(d.min||0);if(d.startNextDay)startMin+=1440;let endMin=d.endHour!=null?d.endHour*60+(d.endMin||0):startMin+20;if(d.startNextDay&&d.endHour!=null)endMin+=1440;if(endMin<startMin)endMin+=1440;return{startMin,endMin,alcoholG:pureAlcohol(d.ml,d.drinkType.pct)};});
  // 全ての杯を吸収し終えた後はBACは単調減少するので、そこから素面(≦0.02‰)になる絶対時刻を探す。
  // 「今」に依存させない（翌日記録の飲酒や過去日の表示でも正しく出す）。
  const lastDone=Math.max(...dd.map(d=>d.endMin+15));
  for(let t=lastDone;t<=lastDone+24*60;t+=5){
    if(userBAC(dd,t)<=0.02){
      const day=Math.floor(t/1440), hh=Math.floor((t%1440)/60), mm=t%60;
      return `${day>=1?"翌":""}${hh}:${String(mm).padStart(2,"0")}`;
    }
  }
  return"24h以上";
}
function removeDrink(vd,uid){
  pushUndo("飲酒記録を削除しました");
  const d=getDaily(vd);
  const target=(d.drinks||[]).find(x=>x.uid===uid);
  const wc=(target&&target.water)?target.water:0; // その飲酒に紐づく水（100ml単位）を飲水量から差し引く
  const patch={drinks:(d.drinks||[]).filter(x=>x.uid!==uid)};
  if(wc>0){ let dw=(d.water!=null?d.water:0)-wc*0.1; dw=Math.round(Math.max(0,dw)*10)/10; patch.water=dw; }
  setDaily(vd,patch);
}
// 飲酒項目ごとの水分（1単位=100ml=0.1L）を増減し、飲水量(d.water)にも反映
function adjustDrinkWater(vd,uid,delta){
  const d=getDaily(vd);
  let applied=0;
  const drinks=(d.drinks||[]).map(x=>{
    if(x.uid!==uid) return x;
    const cur=x.water||0; const next=Math.max(0,cur+delta); applied=next-cur;
    return {...x, water:next};
  });
  let dw=(d.water!=null?d.water:0)+applied*0.1;
  dw=Math.round(Math.max(0,dw)*10)/10;
  setDaily(vd,{drinks, water:dw});
  render();
}

// その日のルーティン達成状況（除外を除いた実達成率）
function dayRoutineStats(ds){
  const todo=state.todos[ds]||{};
  const targets=TODO_ITEMS.filter(item=>!(todo[item.id]||{}).excluded);
  const hasData=Object.keys(todo).length>0;
  if(!targets.length) return {ratio:0,done:0,total:0,hasData};
  const doneN=targets.filter(item=>{const t=todo[item.id]||{};
    if(item.type==="check")return !!t.checked;
    if(item.type==="timer"){ if(item.multi)return (t.sessions||[]).some(s=>s.startTime&&s.endTime); return !!(t.startTime&&t.endTime); }
    return false;}).length;
  return {ratio: doneN/targets.length, done:doneN, total:targets.length, hasData};
}
function heatColor(r, hasData){
  if(!hasData) return "#0f172a";
  if(r<=0)   return "#1e293b";
  if(r<0.34) return "#14532d";
  if(r<0.67) return "#16a34a";
  if(r<1)    return "#22c55e";
  return "#4ade80";
}
// その日、除外を除く全ルーティンを達成したか
function overallDoneOnDay(ds){
  const td=state.todos[ds]||{};
  const targets=TODO_ITEMS.filter(it=>!(td[it.id]||{}).excluded);
  if(!targets.length) return false;
  return targets.every(it=>isTodoDone(ds,it));
}
// ── ストリーク（連続達成）＋保護（月1回まで未達成を許容）──
const STREAK_MILESTONES=[3,7,14,30,50,100,150,200,300,365];
// fromDs から遡って連続達成日数を数える。未達成日は同じ月(YYYY-MM)で未使用の保護が
// あれば1回だけ許容して継続（保護日は日数に加算しない）。
function computeStreakProtected(doneFn, fromDs){
  let count=0, chk=fromDs; const protUsed=new Set(); const protectedDays=[];
  for(let i=0;i<400;i++){
    if(doneFn(chk)){ count++; }
    else {
      const mk=chk.slice(0,7);
      // 単日の抜け（さらに過去の日が達成済み）だけ、月1回まで保護で橋渡し。
      // 連続の起点（過去側が未達成）では保護を消費しない＝無駄打ちしない。
      if(!protUsed.has(mk) && doneFn(prevDay(chk))){ protUsed.add(mk); protectedDays.push(chk); }
      else break;
    }
    chk=prevDay(chk);
  }
  return {streak:count, protectedDays};
}
// 現在の連続達成（今日が未完了でも「まだ失敗ではない」ので昨日から数える）
function currentOverallStreak(){
  const t=todayStr();
  const from=overallDoneOnDay(t)?t:prevDay(t);
  return computeStreakProtected(overallDoneOnDay, from);
}
// 直近days日での最長連続（保護ルール込み・振り返り用）
function bestOverallStreak(days){
  const start=new Date(); start.setDate(start.getDate()-days);
  let best=0, run=0; let protUsed=new Set();
  for(let i=0;i<=days;i++){
    const d=new Date(start); d.setDate(d.getDate()+i); const ds=fmtDS(d); if(ds>todayStr())break;
    if(overallDoneOnDay(ds)){ run++; if(run>best)best=run; }
    else { const mk=ds.slice(0,7); if(run>0 && !protUsed.has(mk) && overallDoneOnDay(addDays(ds,1))){ protUsed.add(mk); } else { run=0; protUsed=new Set(); } }
  }
  return best;
}
// マイルストーン到達をお祝い（達成時に一度だけ）
function maybeCelebrateStreak(){
  const cur=currentOverallStreak().streak;
  const last=state.lastStreakMilestone||0;
  const hit=STREAK_MILESTONES.filter(m=>m<=cur && m>last).pop();
  if(hit){ state.lastStreakMilestone=hit; try{localStorage.setItem(STORAGE_KEY+"_streakms",String(hit));}catch{}
    if(typeof showConfetti==="function")showConfetti(); showToast(`🔥 ${hit}日連続達成！おめでとう！`,"#22c55e"); }
  else if(cur<last){ const nl=STREAK_MILESTONES.filter(m=>m<=cur).pop()||0; if(nl!==last){ state.lastStreakMilestone=nl; try{localStorage.setItem(STORAGE_KEY+"_streakms",String(nl));}catch{} } }
}

function renderLog(){
  const wrap=div({style:{maxWidth:"600px",margin:"0 auto",padding:"12px 16px 60px"}});

  // ── 月間体調ヒートマップ ──
  if(state.heatmapMonth===undefined){
    const n=new Date();
    state.heatmapMonth={y:n.getFullYear(),m:n.getMonth()+1};
  }
  const hm=state.heatmapMonth;
  const hmCard=div({className:"card"});
  hmCard.appendChild(div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}},[
    btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#94a3b8",cursor:"pointer",fontSize:"14px",padding:"2px 10px"},
      onClick:()=>{hm.m--;if(hm.m<1){hm.m=12;hm.y--;}render();}},"‹"),
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0"}},`📅 ${hm.y}年${hm.m}月の体調`),
    btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#94a3b8",cursor:"pointer",fontSize:"14px",padding:"2px 10px"},
      onClick:()=>{hm.m++;if(hm.m>12){hm.m=1;hm.y++;}render();}},"›")
  ]));

  // 曜日ヘッダー
  hmCard.appendChild(div({style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px",marginBottom:"3px"}},
    ["月","火","水","木","金","土","日"].map(w=>div({style:{textAlign:"center",fontSize:"9px",color:"#475569"}},w))));

  // 日ごとの平均スコアマップ
  const monthPrefix=`${hm.y}-${String(hm.m).padStart(2,'0')}`;
  const dayScores={};
  state.logs.filter(l=>l.dateStr.startsWith(monthPrefix)&&l.score!=null).forEach(l=>{
    if(!dayScores[l.dateStr])dayScores[l.dateStr]=[];
    dayScores[l.dateStr].push(l.score);
  });

  // カレンダー描画（月曜始まり）
  const firstDay=new Date(hm.y,hm.m-1,1);
  const daysInMonth=new Date(hm.y,hm.m,0).getDate();
  let startBlank=(firstDay.getDay()+6)%7; // 月曜=0
  const grid=div({style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"}});
  for(let i=0;i<startBlank;i++)grid.appendChild(div({},""));
  const todayD2=todayStr();
  for(let day=1;day<=daysInMonth;day++){
    const dsK=`${monthPrefix}-${String(day).padStart(2,'0')}`;
    const arr=dayScores[dsK];
    const avg2=arr?arr.reduce((a,b)=>a+b,0)/arr.length:null;
    const col=avg2==null?"#0f172a":scoreColor(avg2);
    const isT=dsK===todayD2;
    const cell=div({style:{
      aspectRatio:"1",borderRadius:"6px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      background:avg2==null?"#0f172a":col+"33",
      border:`1px solid ${isT?"#38bdf8":avg2==null?"#1e3a5f":col+"66"}`,
      cursor:"pointer"
    }});
    cell.appendChild(div({style:{fontSize:"9px",color:isT?"#38bdf8":"#64748b",fontWeight:isT?700:400}},String(day)));
    if(avg2!=null)cell.appendChild(div({style:{fontSize:"10px",fontWeight:700,color:col}},avg2.toFixed(1)));
    cell.addEventListener('click',(()=>{const k=dsK;return()=>{state.viewDate=k;state.tab="日記";state.diarySubTab="体調記録";render();};})());
    grid.appendChild(cell);
  }
  hmCard.appendChild(grid);
  hmCard.appendChild(div({style:{display:"flex",gap:"10px",marginTop:"8px",fontSize:"9px",color:"#475569",justifyContent:"center"}},[
    span({style:{color:"#ef4444"}},"■ 〜3"),span({style:{color:"#f97316"}},"■ 〜5"),

// ── 分析タブ ──────────────────────────────────────
// ── 週次レポート ──────────────────────────────────
function renderWeekly(){
  const wrap=div({style:{maxWidth:"600px",margin:"0 auto",padding:"10px 16px 60px"}});

  // 今週の月曜日を起点に週を生成（過去8週分）
  const getMonday = dateStr => {
    const p=dateStr.split('-');
    const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
    const day=d.getDay(); // 0=日,1=月...
    const diff=day===0?-6:1-day; // 月曜に戻す
    d.setDate(d.getDate()+diff);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const addDays = (dateStr, n) => {
    const p=dateStr.split('-');
    const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
    d.setDate(d.getDate()+n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };

  const todayD = todayStr();
  const thisMonday = getMonday(todayD);

  // 週リスト（今週含む過去8週）
  const weeks = Array.from({length:8},(_,i) => {
    const mon = addDays(thisMonday, -i*7);
    const sun = addDays(mon, 6);
    const days = Array.from({length:7},(_,j) => addDays(mon,j));
    return {mon, sun, days};
  });

  // 週セレクター状態
  if(state.weeklyIdx===undefined) state.weeklyIdx=0;

  wrap.appendChild(div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}},[
    btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#94a3b8",cursor:"pointer",fontSize:"16px",padding:"2px 10px"},
      onClick:()=>{if(state.weeklyIdx<weeks.length-1){state.weeklyIdx++;render();}}},"‹"),
    div({style:{textAlign:"center"}},[
      div({style:{fontSize:"13px",fontWeight:700,color:state.weeklyIdx===0?"#38bdf8":"#e2e8f0"}},
        state.weeklyIdx===0?"今週":state.weeklyIdx===1?"先週":`${state.weeklyIdx}週前`),
      div({style:{fontSize:"11px",color:"#64748b",marginTop:"2px"}},
        `${weeks[state.weeklyIdx].mon.slice(5).replace('-','/')} 〜 ${weeks[state.weeklyIdx].sun.slice(5).replace('-','/')}`)
    ]),
    btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:state.weeklyIdx>0?"#94a3b8":"#1e3a5f",cursor:state.weeklyIdx>0?"pointer":"default",fontSize:"16px",padding:"2px 10px"},
      onClick:()=>{if(state.weeklyIdx>0){state.weeklyIdx--;render();}}},"›")
  ]));

  const week = weeks[state.weeklyIdx];
  const DAY_LABELS = ["月","火","水","木","金","土","日"];

  // 各日のデータ集計
  const dayData = week.days.map((d,i) => {
    const daily = getDaily(d);
    const logs = state.logs.filter(l=>l.dateStr===d&&l.score!=null);
    const avgScore = logs.length ? logs.reduce((a,b)=>a+b.score,0)/logs.length : null;
    const drinks = (daily.drinks||[]).map(dr=>({...dr,drinkType:resolveDT(dr)}));
    const alcG = drinks.reduce((a,b)=>a+pureAlcohol(b.ml,b.drinkType.pct),0);
    const sleepH = getNightSleepHours(daily.dateStr)!=null?Math.round(getNightSleepHours(daily.dateStr)*10)/10:null;
    const todo = state.todos[d]||{};
    const todoDone = TODO_ITEMS.filter(item=>isTodoDone(d,item)).length;
    const isFuture = d > todayD;
    return {d, label:DAY_LABELS[i], daily, logs, avgScore, alcG, sleepH, todoDone, isFuture};
  });

  // ── 体調スコアグラフ ──
  wrap.appendChild(div({className:"card"},[
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"12px"}},"📊 体調スコア"),
    div({style:{display:"flex",gap:"4px",alignItems:"flex-end",height:"80px"}}, [
      dayData.map(({label,avgScore,d,isFuture}) => {
        const h = avgScore ? `${Math.round((avgScore/10)*64)}px` : "4px";
        const col = avgScore ? scoreColor(avgScore) : "#1e3a5f";
        const isToday2 = d===todayD;
        return div({style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}},[
          avgScore?div({style:{fontSize:"10px",fontWeight:700,color:col}},avgScore.toFixed(1)):null,
          div({style:{width:"100%",height:h,background:isFuture?"#0f172a":col+(avgScore?"":""),border:isFuture?"1px dashed #1e3a5f":`1px solid ${col}44`,borderRadius:"4px 4px 0 0",minHeight:"4px"}}),
          div({style:{fontSize:"11px",fontWeight:isToday2?700:400,color:isToday2?"#38bdf8":"#64748b"}},label)
        ]);
      })
    ])
  ]));

  // ── 睡眠グラフ ──
  const maxSleep = Math.max(8, ...dayData.map(d=>d.sleepH||0));
  wrap.appendChild(div({className:"card"},[
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"12px"}},"😴 睡眠時間"),
    div({style:{display:"flex",gap:"4px",alignItems:"flex-end",height:"80px"}}, [
      dayData.map(({label,sleepH,d,isFuture}) => {
        const h = sleepH ? `${Math.round((sleepH/maxSleep)*64)}px` : "4px";
        const col = sleepH==null?"#1e3a5f":sleepH>=7?"#22c55e":sleepH<=5?"#ef4444":"#eab308";
        const isToday2=d===todayD;
        return div({style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}},[
          sleepH?div({style:{fontSize:"10px",fontWeight:700,color:col}},`${sleepH}h`):null,
          div({style:{width:"100%",height:h,background:isFuture?"#0f172a":col,border:isFuture?"1px dashed #1e3a5f":`1px solid ${col}44`,borderRadius:"4px 4px 0 0",minHeight:"4px"}}),
          div({style:{fontSize:"11px",fontWeight:isToday2?700:400,color:isToday2?"#38bdf8":"#64748b"}},label)
        ]);
      })
    ]),
    div({style:{display:"flex",gap:"12px",marginTop:"8px",fontSize:"10px"}},[
      span({style:{color:"#22c55e"}},"■ 7h以上"),
      span({style:{color:"#eab308"}},"■ 6〜7h"),
      span({style:{color:"#ef4444"}},"■ 5h以下")
    ])
  ]));

  // ── 飲酒 ──
  wrap.appendChild(div({className:"card"},[
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"12px"}},"🍺 飲酒（純アルコール）"),
    div({style:{display:"flex",gap:"4px",alignItems:"flex-end",height:"60px"}}, [
      dayData.map(({label,alcG,d,isFuture}) => {
        const maxA = Math.max(20,...dayData.map(x=>x.alcG));
        const h = alcG>0?`${Math.round((alcG/maxA)*48)}px`:"4px";
        const col = alcG===0?"#1e3a5f":alcG>20?"#ef4444":alcG>10?"#f97316":"#eab308";
        const isToday2=d===todayD;
        return div({style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}},[
          alcG>0?div({style:{fontSize:"9px",fontWeight:700,color:col}},`${alcG.toFixed(0)}g`):null,
          div({style:{width:"100%",height:h,background:isFuture?"#0f172a":alcG>0?col:"#0f172a",border:isFuture?"1px dashed #1e3a5f":`1px solid ${col}33`,borderRadius:"4px 4px 0 0",minHeight:"4px"}}),
          div({style:{fontSize:"11px",fontWeight:isToday2?700:400,color:isToday2?"#38bdf8":"#64748b"}},label)
        ]);
      })
    ])
  ]));

  // ── TODO達成率 ──
  const total = TODO_ITEMS.length;
  wrap.appendChild(div({className:"card"},[
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"12px"}},"📋 TODO達成率"),
    div({style:{display:"flex",gap:"4px",alignItems:"flex-end",height:"60px"}}, [
      dayData.map(({label,todoDone,d,isFuture}) => {
        const pct = total>0?todoDone/total:0;
        const h = `${Math.round(pct*48)}px`;
        const col = pct>=1?"#22c55e":pct>=0.7?"#eab308":pct>=0.4?"#f97316":"#ef4444";
        const isToday2=d===todayD;
        return div({style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}},[
          todoDone>0?div({style:{fontSize:"9px",fontWeight:700,color:col}},`${todoDone}/${total}`):null,
          div({style:{width:"100%",height:todoDone>0?h:"4px",background:isFuture?"#0f172a":todoDone>0?col:"#0f172a",border:isFuture?"1px dashed #1e3a5f":`1px solid ${todoDone>0?col:"#1e3a5f"}`,borderRadius:"4px 4px 0 0",minHeight:"4px"}}),
          div({style:{fontSize:"11px",fontWeight:isToday2?700:400,color:isToday2?"#38bdf8":"#64748b"}},label)
        ]);
      })
    ])
  ]));

  // ── 週のサマリー数値 ──
  const weekScores = dayData.filter(d=>d.avgScore!=null).map(d=>d.avgScore);
  const weekSleep  = dayData.filter(d=>d.sleepH!=null).map(d=>d.sleepH);
  const weekAlc    = dayData.filter(d=>!d.isFuture).map(d=>d.alcG);
  const weekTodo   = dayData.filter(d=>!d.isFuture).map(d=>d.todoDone);
  const avgS = weekScores.length ? weekScores.reduce((a,b)=>a+b,0)/weekScores.length : null;
  const avgSl= weekSleep.length  ? weekSleep.reduce((a,b)=>a+b,0)/weekSleep.length   : null;
  const totAl= weekAlc.reduce((a,b)=>a+b,0);
  const avgTd= weekTodo.length   ? weekTodo.reduce((a,b)=>a+b,0)/weekTodo.length     : null;
  const alcDays=weekAlc.filter(g=>g>0).length;

  wrap.appendChild(div({className:"card"},[
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"12px"}},"📈 週のまとめ"),
    div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}},[
      {l:"平均体調",v:avgS?`${avgS.toFixed(1)}/10`:"—",c:avgS?scoreColor(avgS):"#475569"},
      {l:"平均睡眠",v:avgSl?`${avgSl.toFixed(1)}h`:"—",c:avgSl?avgSl>=7?"#22c55e":avgSl<=5?"#ef4444":"#eab308":"#475569"},
      {l:"飲酒日数",v:`${alcDays}日`,c:alcDays>=5?"#ef4444":alcDays>=3?"#f97316":"#22c55e"},
      {l:"純アルコール計",v:`${totAl.toFixed(0)}g`,c:totAl>140?"#ef4444":totAl>80?"#f97316":"#22c55e"},
      {l:"TODO平均達成",v:avgTd!=null?`${avgTd.toFixed(1)}/${total}`:"—",c:avgTd!=null?avgTd/total>=0.8?"#22c55e":avgTd/total>=0.5?"#eab308":"#ef4444":"#475569"},
      {l:"全完了日数",v:`${dayData.filter(d=>d.todoDone===total&&!d.isFuture).length}日`,c:"#38bdf8"},
    ].map(({l,v,c})=>div({style:{background:"#0f172a",borderRadius:"10px",padding:"10px",textAlign:"center"}},[
      div({style:{fontSize:"10px",color:"#64748b",marginBottom:"3px"}},l),
      div({style:{fontSize:"18px",fontWeight:800,color:c}},v)
    ])))
  ]));

  return wrap;
}

// 体調スコアの推移（時系列）カード。30日/12週/12ヶ月で平均スコアの変化を表示
function renderScoreTrend(){
  const range=state.trendRange||"12w";
  const scored=state.logs.filter(l=>l.score!=null);
  const avgOf=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
  const today=todayStr();
  let points=[]; // {label,value}
  if(range==="30d"){
    const byDay={};
    scored.forEach(l=>{(byDay[l.dateStr]=byDay[l.dateStr]||[]).push(l.score);});
    for(let i=29;i>=0;i--){ const d=addDays(today,-i); points.push({label:mdLabel(d),value:byDay[d]?avgOf(byDay[d]):null}); }
  } else if(range==="12w"){
    const mondayOf=ds=>{const x=parseDS(ds);const day=x.getDay();const diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);return fmtDS(x);};
    const thisMon=mondayOf(today);
    for(let i=11;i>=0;i--){ const mon=addDays(thisMon,-i*7); const sun=addDays(mon,6); const vs=scored.filter(l=>l.dateStr>=mon&&l.dateStr<=sun).map(l=>l.score); points.push({label:mdLabel(mon),value:avgOf(vs)}); }
  } else {
    const now=parseDS(today);
    for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); const pref=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; const vs=scored.filter(l=>l.dateStr.startsWith(pref)).map(l=>l.score); points.push({label:`${d.getMonth()+1}月`,value:avgOf(vs)}); }
  }

  const card=div({className:"card"});
  const head=div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",flexWrap:"wrap",gap:"6px"}});
  head.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0"}},"📈 体調スコアの推移"));
  const toggle=div({style:{display:"flex",gap:"4px"}});
  [["30d","30日"],["12w","12週"],["12m","12ヶ月"]].forEach(([k,lbl])=>{
    const on=range===k;
    toggle.appendChild(btn({style:{fontSize:"11px",padding:"4px 10px",borderRadius:"7px",cursor:"pointer",fontWeight:600,
      border:`1px solid ${on?"#38bdf8":"#334155"}`,background:on?"#0ea5e922":"transparent",color:on?"#38bdf8":"#64748b"},
      onClick:()=>{state.trendRange=k;render();}},lbl));
  });
  head.appendChild(toggle);
  card.appendChild(head);

  const vals=points.filter(p=>p.value!=null).map(p=>p.value);
  if(vals.length===0){
    card.appendChild(div({style:{fontSize:"12px",color:"#475569",textAlign:"center",padding:"20px 0"}},"体調スコアの記録がまだありません"));
    return card;
  }
  const avg=avgOf(vals), latest=vals[vals.length-1];
  // 傾向：前半平均と後半平均の差
  let trendLbl="→ 横ばい", trendCol="#64748b";
  if(vals.length>=4){
    const half=Math.floor(vals.length/2);
    const firstAvg=avgOf(vals.slice(0,half)), lastAvg=avgOf(vals.slice(-half));
    const delta=lastAvg-firstAvg;
    if(delta>=0.4){trendLbl="↑ 改善傾向";trendCol="#22c55e";}
    else if(delta<=-0.4){trendLbl="↓ 悪化傾向";trendCol="#ef4444";}
  }
  const stat=(lbl,val,col)=>div({style:{textAlign:"center"}},[
    div({style:{fontSize:"9px",color:"#64748b",marginBottom:"2px"}},lbl),
    div({style:{fontSize:"15px",fontWeight:800,color:col}},val)
  ]);
  card.appendChild(div({style:{display:"flex",justifyContent:"space-around",marginBottom:"10px",padding:"6px 0",background:"#0f172a",borderRadius:"8px"}},[
    stat("平均",avg.toFixed(1),scoreColor(avg)),
    stat("最新",latest.toFixed(1),scoreColor(latest)),
    stat("傾向",trendLbl,trendCol)
  ]));

  // ── キャンバス折れ線 ──
  const cv=document.createElement('canvas');
  const W=Math.min((window.innerWidth||390)-64,520), H=170;
  const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.cssText=`width:100%;max-width:${W}px;height:${H}px;display:block;background:#0a1120;border-radius:8px`;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const PL=26,PR=10,PT=12,PB=22, cW=W-PL-PR, cH=H-PT-PB;
  const xAt=i=>PL+(points.length<=1?cW/2:cW*(i/(points.length-1)));
  const yAt=v=>PT+cH-(v/10)*cH;
  // グリッド
  [0,5,10].forEach(g=>{const y=yAt(g);ctx.strokeStyle='#1e293b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();ctx.fillStyle='#475569';ctx.font='9px system-ui';ctx.textAlign='right';ctx.fillText(String(g),PL-4,y+3);});
  // 平均の点線
  {const y=yAt(avg);ctx.strokeStyle='#334155';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();ctx.setLineDash([]);}
  // 折れ線（欠測は分断）
  ctx.lineWidth=2;ctx.strokeStyle='#38bdf8';
  let prev=null;
  points.forEach((p,i)=>{ if(p.value==null){prev=null;return;} const x=xAt(i),y=yAt(p.value); if(prev){ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(x,y);ctx.stroke();} prev={x,y}; });
  // 点（スコア色）
  points.forEach((p,i)=>{ if(p.value==null)return; const x=xAt(i),y=yAt(p.value); ctx.fillStyle=scoreColor(p.value); ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill(); });
  // 最新点を強調＋数値
  {let li=-1;for(let i=points.length-1;i>=0;i--){if(points[i].value!=null){li=i;break;}} if(li>=0){const x=xAt(li),y=yAt(points[li].value);ctx.fillStyle=scoreColor(points[li].value);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0a1120';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#e2e8f0';ctx.font='bold 11px system-ui';ctx.textAlign=li>points.length-2?'right':'center';ctx.fillText(points[li].value.toFixed(1),x,y-9);}}
  // X軸ラベル（間引き）
  const step=Math.max(1,Math.ceil(points.length/6));
  ctx.fillStyle='#475569';ctx.font='8px system-ui';ctx.textAlign='center';
  points.forEach((p,i)=>{ if(i%step!==0 && i!==points.length-1)return; ctx.fillText(p.label,Math.max(PL+8,Math.min(W-PR-8,xAt(i))),H-7); });

  card.appendChild(cv);
  card.appendChild(div({style:{fontSize:"9px",color:"#475569",marginTop:"6px",textAlign:"center"}},
    range==="30d"?"直近30日の1日平均スコア":range==="12w"?"直近12週の週平均スコア":"直近12ヶ月の月平均スコア"));
  return card;
}

function renderAnalysis(){
  const wrap=div({style:{maxWidth:"600px",margin:"0 auto",padding:"12px 16px 60px"}});
  wrap.appendChild(renderScoreTrend());
  const scored=state.logs.filter(l=>l.score!=null);
  const bad=scored.filter(l=>l.score<=4);
  const avg=scored.length?(scored.reduce((a,b)=>a+b.score,0)/scored.length).toFixed(1):null;
  const ga=arr=>arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1):null;

  // 日付を1日進める
  const nextD=ds=>{const p=ds.split('-');const n=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));n.setDate(n.getDate()+1);return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;};
  const dayAvgScore=ds=>{const ls=scored.filter(l=>l.dateStr===ds);return ls.length?ls.reduce((a,b)=>a+b.score,0)/ls.length:null;};

  // 睡眠と当日体調
  const sleepG={s:[],m:[],l:[]};
  // 飲酒と翌日体調（大きい量も細かく区分）
  const alcG={n:[],l:[],m:[],h:[],vh:[]};
  // 飲水と当日体調（0.2L単位）
  const waterG={w02:[],w04:[],w06:[],w08:[],w10:[],w12:[],w14:[],w16:[],w18:[],w20:[]};

  state.dailies.forEach(d=>{
    const a=dayAvgScore(d.dateStr);
    const aTomorrow=dayAvgScore(nextD(d.dateStr));
    const drinks=(d.drinks||[]).map(dr=>({...dr,drinkType:resolveDT(dr)}));
    const tg=drinks.reduce((x,b)=>x+pureAlcohol(b.ml,b.drinkType.pct),0);
    const _sh=getNightSleepHours(d.dateStr);const sh=_sh!=null?Math.round(_sh*10)/10:null;

    // 睡眠→当日
    if(sh!=null&&a!=null){
      if(sh<=5)sleepG.s.push(a);else if(sh<=7)sleepG.m.push(a);else sleepG.l.push(a);
    }
    // 飲酒→翌日（翌日データがある場合のみ）
    if(aTomorrow!=null){
      if(!tg)alcG.n.push(aTomorrow);
      else if(tg<=20)alcG.l.push(aTomorrow);
      else if(tg<=40)alcG.m.push(aTomorrow);
      else if(tg<=60)alcG.h.push(aTomorrow);
      else alcG.vh.push(aTomorrow);
    }
    // 飲水→当日（0.2L単位）
    if(a!=null&&d.water!=null){
      const w=Math.round(d.water*10)/10;
      if(w<=0.2)waterG.w02.push(a);
      else if(w<=0.4)waterG.w04.push(a);
      else if(w<=0.6)waterG.w06.push(a);
      else if(w<=0.8)waterG.w08.push(a);
      else if(w<=1.0)waterG.w10.push(a);
      else if(w<=1.2)waterG.w12.push(a);
      else if(w<=1.4)waterG.w14.push(a);
      else if(w<=1.6)waterG.w16.push(a);
      else if(w<=1.8)waterG.w18.push(a);
      else waterG.w20.push(a);
    }
  });
  const pd=scored.filter(l=>(l.pressureDiff||0)<=-5);
  const ps=scored.filter(l=>Math.abs(l.pressureDiff||0)<3);
  const sc2={};bad.forEach(l=>l.symptoms.forEach(s=>{sc2[s]=(sc2[s]||0)+1;}));
  const topS=Object.entries(sc2).sort((a,b)=>b[1]-a[1]).slice(0,4);

  const barCard=(title,rows)=>{
    const card=div({className:"card"},[div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"10px"}},title)]);
    rows.forEach(({l,v,c,sub})=>{
      if(!v)return;
      card.appendChild(div({style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px"}},[
        div({style:{fontSize:"11px",color:"#94a3b8",minWidth:"72px"}},l),
        div({style:{flex:1,height:"6px",background:"#0f172a",borderRadius:"4px",overflow:"hidden"}},[div({style:{height:"100%",width:`${(parseFloat(v)/10)*100}%`,background:c,borderRadius:"4px"}})]),
        div({style:{fontSize:"12px",fontWeight:700,color:c,minWidth:"26px",textAlign:"right"}},v),
        sub?div({style:{fontSize:"10px",color:"#475569"}},sub):null
      ]));
    });
    return card;
  };

  // サマリー
  wrap.appendChild(div({style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"10px"}},[
    {l:"記録日数",v:`${[...new Set(scored.map(l=>l.dateStr))].length}日`},{l:"平均体調",v:avg?`${avg}/10`:"—"},{l:"不調記録",v:`${bad.length}件`}
  ].map(({l,v})=>div({className:"card",style:{textAlign:"center",marginBottom:"0"}},[div({style:{fontSize:"10px",color:"#64748b",marginBottom:"3px"}},l),div({style:{fontSize:"17px",fontWeight:800,color:"#e2e8f0"}},v)]))));

  if(scored.length<3){
    wrap.appendChild(div({className:"card",style:{textAlign:"center",color:"#64748b",padding:"32px 16px"}},[div({style:{fontSize:"32px",marginBottom:"8px"}},"📋"),"体調を3件以上記録すると分析できます"]));
    return wrap;
  }

  wrap.appendChild(barCard("😴 睡眠と当日体調",[
    {l:"5h以下",v:ga(sleepG.s),c:"#ef4444",sub:`${sleepG.s.length}日`},
    {l:"6〜7h", v:ga(sleepG.m),c:"#eab308",sub:`${sleepG.m.length}日`},
    {l:"8h以上",v:ga(sleepG.l),c:"#22c55e",sub:`${sleepG.l.length}日`}
  ]));

  // 😴+💤 合計睡眠（夜＋昼寝）と当日体調
  const totalSleepG={s:[],m:[],l:[]};
  let hasNapData=false;
  state.dailies.forEach(d=>{
    const a=dayAvgScore(d.dateStr);
    if(a==null)return;
    const nightH=getNightSleepHours(d.dateStr);
    if(nightH==null)return;
    const napMins=(d.naps||[]).reduce((x,n)=>x+(n.mins||0),0);
    if(napMins>0)hasNapData=true;
    const total=nightH+napMins/60;
    if(total<=5)totalSleepG.s.push(a);else if(total<=7)totalSleepG.m.push(a);else totalSleepG.l.push(a);
  });
  if(hasNapData){
    wrap.appendChild(barCard("💤 合計睡眠（夜＋昼寝）と当日体調",[
      {l:"5h以下",v:ga(totalSleepG.s),c:"#ef4444",sub:`${totalSleepG.s.length}日`},
      {l:"6〜7h", v:ga(totalSleepG.m),c:"#eab308",sub:`${totalSleepG.m.length}日`},
      {l:"8h以上",v:ga(totalSleepG.l),c:"#22c55e",sub:`${totalSleepG.l.length}日`}
    ]));
  }
  wrap.appendChild(barCard("🍺 飲酒と翌日体調（純アルコール量）",[
    {l:"飲まない",v:ga(alcG.n), c:"#22c55e",sub:`${alcG.n.length}日`},
    {l:"〜20g",   v:ga(alcG.l), c:"#a3e635",sub:`${alcG.l.length}日`},
    {l:"〜40g",   v:ga(alcG.m), c:"#eab308",sub:`${alcG.m.length}日`},
    {l:"〜60g",   v:ga(alcG.h), c:"#f97316",sub:`${alcG.h.length}日`},
    {l:"60g超",   v:ga(alcG.vh),c:"#ef4444",sub:`${alcG.vh.length}日`}
  ]));
  wrap.appendChild(div({style:{fontSize:"9px",color:"#475569",margin:"-6px 0 10px",paddingLeft:"2px"}},"目安: 20g≒ビール中瓶1本 / 40g≒2本 / 60g≒3本"));
  wrap.appendChild(barCard("💧 飲水と当日体調（0.2L単位）",[
    {l:"〜0.2L",v:ga(waterG.w02),c:"#ef4444",sub:`${waterG.w02.length}日`},
    {l:"〜0.4L",v:ga(waterG.w04),c:"#ef4444",sub:`${waterG.w04.length}日`},
    {l:"〜0.6L",v:ga(waterG.w06),c:"#f97316",sub:`${waterG.w06.length}日`},
    {l:"〜0.8L",v:ga(waterG.w08),c:"#f97316",sub:`${waterG.w08.length}日`},
    {l:"〜1.0L",v:ga(waterG.w10),c:"#eab308",sub:`${waterG.w10.length}日`},
    {l:"〜1.2L",v:ga(waterG.w12),c:"#eab308",sub:`${waterG.w12.length}日`},
    {l:"〜1.4L",v:ga(waterG.w14),c:"#22c55e",sub:`${waterG.w14.length}日`},
    {l:"〜1.6L",v:ga(waterG.w16),c:"#22c55e",sub:`${waterG.w16.length}日`},
    {l:"〜1.8L",v:ga(waterG.w18),c:"#22c55e",sub:`${waterG.w18.length}日`},
    {l:"2.0L以上",v:ga(waterG.w20),c:"#38bdf8",sub:`${waterG.w20.length}日`},
  ]));

  // 🕐 時間帯別の体調（別観点：1日の中でいつ調子が良い/悪いか）
  const todG={morning:[],afternoon:[],evening:[],night:[]};
  scored.forEach(l=>{
    const h=l.hour;
    if(h>=5&&h<11)todG.morning.push(l.score);
    else if(h>=11&&h<17)todG.afternoon.push(l.score);
    else if(h>=17&&h<22)todG.evening.push(l.score);
    else todG.night.push(l.score);
  });
  const todRow=(l,arr)=>{const v=ga(arr);return {l,v,c:v?scoreColor(parseFloat(v)):"#475569",sub:`${arr.length}件`};};
  if(scored.length>=3){
    wrap.appendChild(barCard("🕐 時間帯別の体調",[
      todRow("朝 5-11時",todG.morning),
      todRow("昼 11-17時",todG.afternoon),
      todRow("夕 17-22時",todG.evening),
      todRow("夜 22-5時",todG.night)
    ]));
  }

  // 🏭 仕事シフトと当日体調
  const shiftG={s1:[],s2:[],off:[]};
  state.dailies.forEach(d=>{
    const a=dayAvgScore(d.dateStr);
    if(a==null)return;
    if(d.workStart==null){shiftG.off.push(a);}
    else if(d.workStart<12){shiftG.s1.push(a);}
    else {shiftG.s2.push(a);}
  });
  wrap.appendChild(barCard("🏭 仕事シフトと当日体調",[
    {l:"1直",v:ga(shiftG.s1), c:"#38bdf8",sub:`${shiftG.s1.length}日`},
    {l:"2直",v:ga(shiftG.s2), c:"#a78bfa",sub:`${shiftG.s2.length}日`},
    {l:"休み",v:ga(shiftG.off),c:"#22c55e",sub:`${shiftG.off.length}日`}
  ]));

  // 🌡️ 飲酒欲求の分析
  const cravingDays=state.dailies
    .map(d=>{
      const cr=d.cravings||{};
      const vals=Object.values(cr);
      if(!vals.length)return null;
      const maxCr=Math.max(...vals);
      const drinks=(d.drinks||[]).map(dr=>({...dr,drinkType:resolveDT(dr)}));
      const alcG2=drinks.reduce((x,b)=>x+pureAlcohol(b.ml,b.drinkType.pct),0);
      return {dateStr:d.dateStr, maxCr, drank:alcG2>0, score:dayAvgScore(d.dateStr)};
    })
    .filter(Boolean);

  if(cravingDays.length>=3){
    const cc=div({className:"card"},[div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"10px"}},"🌡️ 飲酒欲求の分析")]);

    // 欲求が高い日に実際飲んだ割合
    const highCr=cravingDays.filter(c=>c.maxCr>=7);
    const lowCr=cravingDays.filter(c=>c.maxCr<=4);
    if(highCr.length>0){
      const drankPct=Math.round(highCr.filter(c=>c.drank).length/highCr.length*100);
      cc.appendChild(div({style:{display:"flex",gap:"8px",alignItems:"flex-start",marginBottom:"7px",padding:"7px 10px",borderRadius:"8px",background:drankPct>=70?"#ef444408":"#0f172a",border:`1px solid ${drankPct>=70?"#ef444422":"#1e3a5f"}`}},[
        span({style:{fontSize:"14px",flexShrink:0}},"🍺"),
        div({style:{fontSize:"12px",color:"#cbd5e1",lineHeight:1.6}},`欲求7以上の日は${highCr.length}日中${highCr.filter(c=>c.drank).length}日（${drankPct}%）で実際に飲酒しています`)
      ]));
    }

    // 欲求が高い日 vs 低い日の当日体調
    const highScore=highCr.filter(c=>c.score!=null).map(c=>c.score);
    const lowScore=lowCr.filter(c=>c.score!=null).map(c=>c.score);
    if(highScore.length>=2&&lowScore.length>=2){
      const hAvg=highScore.reduce((a,b)=>a+b,0)/highScore.length;
      const lAvg=lowScore.reduce((a,b)=>a+b,0)/lowScore.length;
      if(lAvg-hAvg>=0.5){
        cc.appendChild(div({style:{display:"flex",gap:"8px",alignItems:"flex-start",marginBottom:"7px",padding:"7px 10px",borderRadius:"8px",background:"#ef444408",border:"1px solid #ef444422"}},[
          span({style:{fontSize:"14px",flexShrink:0}},"📉"),
          div({style:{fontSize:"12px",color:"#cbd5e1",lineHeight:1.6}},`欲求が高い日（7以上）は体調も低い傾向（平均${hAvg.toFixed(1)} vs ${lAvg.toFixed(1)}）。体調不良が飲酒欲求の引き金になっている可能性があります`)
        ]));
      }
    }

    // 前日の睡眠と欲求の関係
    const prevSleepHigh=[],prevSleepLow=[];
    cravingDays.forEach(c=>{
      const p=c.dateStr.split('-');
      const prev=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
      prev.setDate(prev.getDate()-1);
      const prevStr=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-${String(prev.getDate()).padStart(2,'0')}`;
      const sh2=getNightSleepHours(prevStr);
      if(sh2==null)return;
      if(c.maxCr>=7)prevSleepHigh.push(sh2);
      else if(c.maxCr<=4)prevSleepLow.push(sh2);
    });
    if(prevSleepHigh.length>=2&&prevSleepLow.length>=2){
      const hS=prevSleepHigh.reduce((a,b)=>a+b,0)/prevSleepHigh.length;
      const lS=prevSleepLow.reduce((a,b)=>a+b,0)/prevSleepLow.length;
      if(lS-hS>=0.5){
        cc.appendChild(div({style:{display:"flex",gap:"8px",alignItems:"flex-start",marginBottom:"7px",padding:"7px 10px",borderRadius:"8px",background:"#f9731608",border:"1px solid #f9731622"}},[
          span({style:{fontSize:"14px",flexShrink:0}},"😴"),
          div({style:{fontSize:"12px",color:"#cbd5e1",lineHeight:1.6}},`欲求が高い日の前日は睡眠が短い傾向（平均${hS.toFixed(1)}h vs ${lS.toFixed(1)}h）。睡眠不足が翌日の欲求を高めている可能性があります`)
        ]));
      }
    }

    if(cc.children.length===1){
      cc.appendChild(div({style:{fontSize:"12px",color:"#475569",textAlign:"center",padding:"8px 0"}},"記録が増えるとパターンが表示されます"));
    }
    cc.appendChild(div({style:{fontSize:"10px",color:"#334155",marginTop:"6px"}},`※ 欲求記録がある${cravingDays.length}日分から分析`));
    wrap.appendChild(cc);
  }

  // 💧 射精と体調の関係
  const ejacDays=state.dailies.filter(d=>(d.ejaculations||[]).length>0).map(d=>d.dateStr);
  if(ejacDays.length>=2){
    const withE={same:[],next:[]}, withoutE={same:[],next:[]};
    state.dailies.forEach(d=>{
      const a=dayAvgScore(d.dateStr);
      const aN=dayAvgScore(nextD(d.dateStr));
      const has=(d.ejaculations||[]).length>0;
      if(a!=null)(has?withE.same:withoutE.same).push(a);
      if(aN!=null)(has?withE.next:withoutE.next).push(aN);
    });
    const ejacCard=div({className:"card"},[div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"4px"}},"💧 射精と体調")]);
    ejacCard.appendChild(div({style:{fontSize:"10px",color:"#475569",marginBottom:"10px"}},`記録あり${ejacDays.length}日 / 月間平均 ${(ejacDays.length/Math.max(1,state.dailies.length)*30).toFixed(1)}回`));
    const rows=[
      {l:"あり日の体調",v:ga(withE.same),c:"#38bdf8",sub:`${withE.same.length}日`},
      {l:"なし日の体調",v:ga(withoutE.same),c:"#64748b",sub:`${withoutE.same.length}日`},
      {l:"あり翌日",v:ga(withE.next),c:"#a78bfa",sub:`${withE.next.length}日`},
      {l:"なし翌日",v:ga(withoutE.next),c:"#64748b",sub:`${withoutE.next.length}日`}
    ];
    rows.forEach(({l,v,c,sub})=>{
      if(!v)return;
      ejacCard.appendChild(div({style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px"}},[
        div({style:{fontSize:"11px",color:"#94a3b8",minWidth:"90px"}},l),
        div({style:{flex:1,height:"6px",background:"#0f172a",borderRadius:"4px",overflow:"hidden"}},[div({style:{height:"100%",width:`${(parseFloat(v)/10)*100}%`,background:c,borderRadius:"4px"}})]),
        div({style:{fontSize:"12px",fontWeight:700,color:c,minWidth:"26px",textAlign:"right"}},v),
        div({style:{fontSize:"10px",color:"#475569"}},sub)
      ]));
    });
    wrap.appendChild(ejacCard);
  }
  if(pd.length>0||ps.length>0) wrap.appendChild(barCard("🌡️ 気圧と体調",[
    {l:"急降下",v:pd.length?(pd.reduce((a,b)=>a+b.score,0)/pd.length).toFixed(1):null,c:"#ef4444",sub:`${pd.length}件`},
    {l:"安定",v:ps.length?(ps.reduce((a,b)=>a+b.score,0)/ps.length).toFixed(1):null,c:"#22c55e",sub:`${ps.length}件`}
  ]));
  if(topS.length>0){
    const sc=div({className:"card"},[div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"10px"}},"🤒 不調時の体調状態")]);
    topS.forEach(([s,n])=>sc.appendChild(div({style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px"}},[
      div({style:{fontSize:"12px",color:"#cbd5e1",minWidth:"80px"}},s),
      div({style:{flex:1,height:"6px",background:"#0f172a",borderRadius:"4px",overflow:"hidden"}},[div({style:{height:"100%",width:`${(n/Math.max(bad.length,1))*100}%`,background:"#f97316",borderRadius:"4px"}})]),
      div({style:{fontSize:"11px",color:"#94a3b8",minWidth:"24px",textAlign:"right"}},`${n}回`)
    ])));
    wrap.appendChild(sc);
  }

  // 🍽️ 食材と体調の相関（翌日+翌々日の平均スコアで評価）
  const foodCorrel = (() => {
    // 日付→平均体調スコアのマップ
    const dateScore = {};
    scored.forEach(l => {
      if(!dateScore[l.dateStr]) dateScore[l.dateStr] = [];
      dateScore[l.dateStr].push(l.score);
    });
    const avgScore = ds => {
      const arr = dateScore[ds];
      return arr ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
    };

    // 日付を1日進める
    const nextDay = ds => {
      const p=ds.split('-');
      const n=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
      n.setDate(n.getDate()+1);
      return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    };

    // 全食材を集計
    const foodStats = {};
    state.dailies.forEach(d => {
      const foods = d.foods || [];
      if(!foods.length) return;
      const d1 = nextDay(d.dateStr);
      const d2 = nextDay(d1);
      const s1 = avgScore(d1);
      const s2 = avgScore(d2);
      const lagScores = [s1, s2].filter(s => s != null);
      if(!lagScores.length) return;
      const lagAvg = lagScores.reduce((a,b)=>a+b,0)/lagScores.length;
      foods.forEach(f => {
        if(!foodStats[f]) foodStats[f] = {eaten:[], notEaten:[]};
        foodStats[f].eaten.push(lagAvg);
      });
    });

    // 食べなかった日の翌日+翌々日スコアも計算
    const allFoods = Object.keys(foodStats);
    state.dailies.forEach(d => {
      const foods = d.foods || [];
      const d1 = nextDay(d.dateStr);
      const d2 = nextDay(d1);
      const s1 = avgScore(d1);
      const s2 = avgScore(d2);
      const lagScores = [s1, s2].filter(s => s != null);
      if(!lagScores.length) return;
      const lagAvg = lagScores.reduce((a,b)=>a+b,0)/lagScores.length;
      allFoods.forEach(f => {
        if(!foods.includes(f)) {
          foodStats[f].notEaten.push(lagAvg);
        }
      });
    });

    // 差分を計算（食べた翌日平均 - 食べなかった翌日平均）
    return Object.entries(foodStats)
      .filter(([,v]) => v.eaten.length >= 2 && v.notEaten.length >= 2)
      .map(([food, v]) => {
        const eAvg = v.eaten.reduce((a,b)=>a+b,0)/v.eaten.length;
        const nAvg = v.notEaten.reduce((a,b)=>a+b,0)/v.notEaten.length;
        return { food, eAvg, nAvg, diff: eAvg-nAvg, count: v.eaten.length };
      })
      .sort((a,b) => Math.abs(b.diff)-Math.abs(a.diff))
      .slice(0, 15);
  })();

  if(foodCorrel.length > 0){
    const fc = div({className:"card"},[]);
    fc.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"4px"}},"🍽️ 食材と体調の相関"));
    fc.appendChild(div({style:{fontSize:"10px",color:"#475569",marginBottom:"12px"}},"食べた翌日・翌々日の平均体調スコアとの比較"));

    const positive = foodCorrel.filter(f => f.diff > 0.2);
    const negative = foodCorrel.filter(f => f.diff < -0.2);
    const neutral  = foodCorrel.filter(f => Math.abs(f.diff) <= 0.2);

    if(positive.length > 0){
      fc.appendChild(div({style:{fontSize:"11px",fontWeight:600,color:"#4ade80",marginBottom:"6px"}},"✅ 食べると体調が良くなる傾向"));
      positive.forEach(({food,diff,count}) => {
        const pct = Math.min(100, Math.abs(diff)/3*100);

  // 📌 わかったこと（ルールベース知見・自動生成）
  const insights=(()=>{
    const out=[];
    const gaN=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
    // 飲酒→翌日（20g超＝m/h/vhを合算）

    const ss=gaN(sleepG.s), sl=gaN(sleepG.l);

      if(diff>=0.5) out.push({icon:"😴",text:`8h以上眠った日は、5h以下の日より平均${diff.toFixed(1)}点高い（${sleepG.l.length}日 vs ${sleepG.s.length}日）`,neg:false});
    }
    // 時間帯パターン
    const hourScores={};
    scored.forEach(l=>{if(!hourScores[l.hour])hourScores[l.hour]=[];hourScores[l.hour].push(l.score);});
    const hourAvgs=Object.entries(hourScores).filter(([,v])=>v.length>=3).map(([h,v])=>({h:parseInt(h),avg:gaN(v),n:v.length}));
    if(hourAvgs.length>=3){
      const best=hourAvgs.reduce((a,b)=>b.avg>a.avg?b:a);

      if(best.avg-worst.avg>=1) out.push({icon:"⏰",text:`${best.h}時台が最も好調（平均${best.avg.toFixed(1)}）、${worst.h}時台が最も不調（平均${worst.avg.toFixed(1)}）`,neg:false});
    }
    // 連続飲酒
    const sortedD=[...state.dailies].sort((a,b)=>a.dateStr<b.dateStr?-1:1);
    let maxRun=0,run=0;
    sortedD.forEach(d=>{
      const drinks=(d.drinks||[]).map(dr=>({...dr,drinkType:resolveDT(dr)}));
      const g=drinks.reduce((x,b)=>x+pureAlcohol(b.ml,b.drinkType.pct),0);
      if(g>0){run++;maxRun=Math.max(maxRun,run);}else run=0;
    });

    return out;
  })();

  if(insights.length>0){
    const ic=div({className:"card"},[div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"10px"}},"📌 データからわかったこと")]);
    insights.forEach(({icon,text,neg})=>{
      ic.appendChild(div({style:{display:"flex",gap:"8px",alignItems:"flex-start",marginBottom:"7px",padding:"7px 10px",borderRadius:"8px",background:neg?"#ef444408":"#22c55e08",border:`1px solid ${neg?"#ef444422":"#22c55e22"}`}},[

  // ⚡ 突発的な行動（予定外の実績）の解析
  {
    let total=0, dayCount=0; const withS=[], withoutS=[];
    const weekCount={}; // 月曜 -> 件数
    const mondayOf=ds=>{const x=parseDS(ds);const day=x.getDay();const diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);return fmtDS(x);};
    state.dailies.forEach(d=>{
      const c=(d.actuals||[]).filter(x=>x.unplanned).length;
      const a=dayAvgScore(d.dateStr);
      total+=c;
      if(c>0){ dayCount++; if(a!=null)withS.push(a); const mk=mondayOf(d.dateStr); weekCount[mk]=(weekCount[mk]||0)+c; }
      else if(a!=null) withoutS.push(a);
    });
    if(total>0){
      const card=div({className:"card"});
      card.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"4px"}},"⚡ 突発的な行動"));
      card.appendChild(div({style:{fontSize:"10px",color:"#64748b",marginBottom:"10px"}},"予定外として登録した実績の頻度と体調への関係"));
      const st=(lbl,val)=>div({style:{textAlign:"center"}},[div({style:{fontSize:"9px",color:"#64748b",marginBottom:"2px"}},lbl),div({style:{fontSize:"15px",fontWeight:800,color:"#f59e0b"}},val)]);
      const perWeek=(()=>{const ks=Object.keys(weekCount);return ks.length?(total/ks.length):0;})();
      card.appendChild(div({style:{display:"flex",justifyContent:"space-around",marginBottom:"10px",padding:"6px 0",background:"#0f172a",borderRadius:"8px"}},[
        st("合計",`${total}件`), st("あった日",`${dayCount}日`), st("週あたり",`${perWeek.toFixed(1)}件`)
      ]));
      // 直近8週の件数バー
      const thisMon=mondayOf(todayStr());
      const weeks=Array.from({length:8},(_,i)=>addDays(thisMon,-(7-1-i)*7));
      const maxW=Math.max(1,...weeks.map(w=>weekCount[w]||0));
      card.appendChild(div({style:{display:"flex",gap:"4px",alignItems:"flex-end",height:"56px",marginBottom:"4px"}},
        weeks.map(w=>{const c=weekCount[w]||0;const h=c?Math.round((c/maxW)*48):2;
          return div({style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}},[
            div({style:{fontSize:"8px",color:c?"#f59e0b":"#334155"}},c?String(c):""),
            div({style:{width:"100%",height:`${h}px`,background:c?"#f59e0b":"#1e293b",borderRadius:"3px 3px 0 0"}}),
            div({style:{fontSize:"7px",color:"#475569"}},mdLabel(w))
          ]);
        })));
      card.appendChild(div({style:{fontSize:"9px",color:"#475569",textAlign:"center",marginBottom:"6px"}},"直近8週の件数"));
      // 体調比較
      if(withS.length>=2 && withoutS.length>=2){
        const aS=parseFloat(ga(withS)), aN=parseFloat(ga(withoutS));
        card.appendChild(div({style:{borderTop:"1px solid #1e3a5f",paddingTop:"8px"}},[
          div({style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px"}},[

          ]),
          div({style:{display:"flex",alignItems:"center",gap:"8px"}},[
            div({style:{fontSize:"11px",color:"#94a3b8",minWidth:"96px"}},"なかった日"),
            div({style:{flex:1,height:"6px",background:"#0f172a",borderRadius:"4px",overflow:"hidden"}},[div({style:{height:"100%",width:`${aN/10*100}%`,background:scoreColor(aN)}})]),
            div({style:{fontSize:"12px",fontWeight:700,color:scoreColor(aN),minWidth:"26px",textAlign:"right"}},aN.toFixed(1))
          ])
        ]));
      }
      wrap.appendChild(card);
    }
  }

  // AI分析（結果は state に保持し、再描画で消えないようにする）
  wrap.appendChild(renderAIAnalysisCard(scored));
  return wrap;
}

// 総合分析の入力コンテキスト（データ部分）を組み立てる（初回分析・対話で共有）
function buildAnalysisContext(){
  const dailies=state.dailies||[];
  const scored=(state.logs||[]).filter(l=>l.score!=null);
  const ds2=dailies.slice(-14).map(d=>{
    const drinks=(d.drinks||[]).map(dr=>({...dr,drinkType:resolveDT(dr)}));
    const g=drinks.reduce((a,b)=>a+pureAlcohol(b.ml,b.drinkType.pct),0);
    const _sh=getNightSleepHours(d.dateStr);const sh=_sh!=null?Math.round(_sh*10)/10:null;
    const shift=d.workStart==null?'休み':(d.workStart<12?'1直':'2直');
    const acts=getActualActivities(d.dateStr).map(a=>a.title.replace(/^[✓]/,'')).slice(0,10).join(',');
    return `${d.dateStr}(${shift}): 睡眠${sh??'?'}h 水分${d.water??'?'}L 純アルコール${g.toFixed(0)}g 食べたもの[${(d.foods||[]).join(',')}] 実際の行動[${acts||'記録なし'}]`;
  }).join('\n');
  const hs=scored.slice(-100).map(l=>`${l.dateStr} ${l.hour}時: 体調${l.score}/10 体調状態[${(l.symptoms||[]).join(',')}]${l.note?` メモ:${l.note}`:''}`).join('\n');
  const upcoming=(()=>{
    const lines=[];
    for(let i=0;i<7;i++){
      const dd=addDays(todayStr(),i);
      const pl=getPlannedExtras(dd).map(e=>e.title).slice(0,8);
      if(pl.length) lines.push(`${dd}: ${pl.join(',')}`);
    }
    return lines.join('\n')||'なし';
  })();
  return `【日次記録（シフト・実際の行動つき）】\n${ds2}\n\n【時間別体調】\n${hs}\n\n【今後1週間の予定】\n${upcoming}`;
}
async function runAI(scored,dailies){

  try{
    const res=await fetch("https://nuts024.com/health/api.php",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Secret-Key":"songof3838"},
      body:JSON.stringify({
        system:`あなたは健康データアナリストです。ユーザーはシフト勤務者（1直/2直/休み）です。体調・睡眠・飲酒・飲水・食事に加え、仕事シフトやその日の実際の行動（スケジュール）、今後の予定も踏まえて総合的に分析してください。以下のJSON形式のみで返答してください。前後に説明文やMarkdownの装飾は不要です:
{"summary":"全体傾向の要約2〜3文","topFactors":[{"factor":"要因名","impact":"positive または negative","detail":"具体的な説明","score":1から5の整数}],"worstCondition":"体調が悪くなる条件","bestCondition":"体調が良くなる条件","advice":["具体的で実行可能なアドバイスを、睡眠・栄養・運動・生活リズム・シフト勤務・メンタルなど毎回できるだけ異なる観点から3〜4個"],"newPerspective":"表面的な相関ではなく、データから読み取れる本人が気づきにくい別の観点・仮説を1〜2文で"}`,

// AIチャットUI（分析・スケジュール共用）

  inp.addEventListener('input',e=>{state[inputKey]=e.target.value;});
  inp.addEventListener('keydown',e=>{if(e.key==="Enter"){e.preventDefault();onSend();}});

  sendB.addEventListener('click',()=>{if(!loading)onSend();});

// ── バックアップ促進リマインダー ──
// localStorage はブラウザ側のみの保存で、キャッシュ削除等で消えるリスクがある。
// 一定期間バックアップしていない場合、起動時にやさしく促す。
function checkBackupReminder(){
  // データが少ないうちは促さない
  if(state.logs.length + state.dailies.length < 10) return;
  let last=0;
  try{const v=localStorage.getItem(STORAGE_KEY+"_lastbackup");if(v)last=parseInt(v)||0;}catch{}
  const days = last ? (Date.now()-last)/86400000 : 999;
  if(days>=14){
    setTimeout(()=>{
      showToast(last?"💾 前回のバックアップから2週間以上経過。設定からデータ出力をおすすめします":"💾 データのバックアップをおすすめします（設定→データ出力）","#38bdf8");
    },1500);
  }
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(!p.logs||!p.dailies)throw new Error("形式が違います");
      // 確認画面：内容のサマリーを表示して上書き確認
      const summary=[
        `体調記録: ${p.logs.length}件`,
        `日次記録: ${p.dailies.length}日分`,
        p.todos?`TODO: ${Object.keys(p.todos).length}日分`:null,
        p.goals?`目標: ${Object.keys(p.goals).length}件`:null,
        p.schedule?`予定: ${Object.keys(p.schedule).length}日分`:null,
        p.tasks?`リスト: ${(p.tasks.todo||[]).length+(p.tasks.wish||[]).length+(p.tasks.shopping||[]).length}件`:null,
        p.weather?`天気: ${Object.keys(p.weather).length}日分`:null,
        p.exportedAt?`エクスポート日時: ${p.exportedAt.slice(0,10)}`:null
      ].filter(Boolean).join("\n");
      if(!confirm(`このバックアップをインポートしますか？\n現在のデータは上書きされます。\n\n${summary}`))return;

      state.logs=p.logs;
      state.dailies=p.dailies;
      if(p.todos){state.todos=p.todos;try{localStorage.setItem(STORAGE_KEY+"_todo",JSON.stringify(p.todos));}catch{}}
      if(p.todoOrder){try{localStorage.setItem(STORAGE_KEY+"_todo_order",JSON.stringify(p.todoOrder));}catch{}}
      if(p.goals){state.goals=p.goals;try{localStorage.setItem(STORAGE_KEY+"_goals",JSON.stringify(p.goals));}catch{}}
      if(p.schedule){state.schedule=p.schedule;try{localStorage.setItem(STORAGE_KEY+"_schedule",JSON.stringify(p.schedule));}catch{}}
      if(p.repeatEvents){state.repeatEvents=p.repeatEvents;try{localStorage.setItem(STORAGE_KEY+"_repeat",JSON.stringify(p.repeatEvents));}catch{}}
      if(p.tasks){state.tasks=p.tasks;try{localStorage.setItem(STORAGE_KEY+"_tasks",JSON.stringify(p.tasks));}catch{}}
      if(Array.isArray(p.routines)&&p.routines.length){state.routines=p.routines;saveRoutines();}
      if(p.shiftPattern&&Array.isArray(p.shiftPattern.grid)){state.shiftPattern={...defaultShiftPattern(),...p.shiftPattern};saveShiftPattern();}
      if(Array.isArray(p.planPatterns)){state.planPatterns=p.planPatterns;savePlanPatterns();}
      if(Array.isArray(p.customTodos)){state.customTodos=p.customTodos;saveCustomTodos();}
      if(Array.isArray(p.goalTree)){state.goalTree=p.goalTree;saveGoalTree();}
      if(Array.isArray(p.rewards)){state.rewards=p.rewards;saveRewards();}
      if(Array.isArray(p.investActions)){state.investActions=p.investActions;saveInvestActions();}
      if(Array.isArray(p.ifThenPlans)){state.ifThenPlans=p.ifThenPlans;saveIfThenPlans();}
      if(Array.isArray(p.investSpends)){state.investSpends=p.investSpends;saveInvestSpends();}
      if(p.bacProfile&&typeof p.bacProfile==="object"){ if(p.bacProfile.weight)state.bacWeight=p.bacProfile.weight; if(p.bacProfile.sex)state.bacSex=p.bacProfile.sex; saveBacProfile(); }
      if(p.weather){try{localStorage.setItem(STORAGE_KEY+"_weather",JSON.stringify(p.weather));}catch{}}
      if(p.city){state.weatherCity=p.city;try{localStorage.setItem(STORAGE_KEY+"_city",JSON.stringify(p.city));}catch{}}
      // 旧形式（v8.3）のバックアップは新モデルへ移行して取り込む
      if(!p.schedule && !p.tasks && (p.events||p.taskList||p.wishList||p.shopList)){
        state.events=p.events||{};
        state.taskList=p.taskList||[];
        state.wishList=p.wishList||[];
        state.shopList=p.shopList||[];
        state.schedule={};state.repeatEvents=[];state.tasks={todo:[],shopping:[]};
        migrateOldSchedule();
      }
      saveStorage();render();
      alert(`インポート完了！\n${summary}`);
    }catch(err){alert("インポート失敗: "+err.message);}
  };
  reader.readAsText(file);e.target.value="";
}

// ── バックアップの閲覧（読み取り専用・現在のデータは上書きしない）──
const VIEW_FIELDS=["logs","dailies","todos","goals","goalTree","schedule","repeatEvents","tasks","routines","shiftPattern","planPatterns","customTodos","rewards","investActions","ifThenPlans","weatherCity","events","taskList","wishList","shopList"];
function viewBackupFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(!p.logs||!p.dailies)throw new Error("体調管理アプリのバックアップ形式ではありません");
      // 現在の生データをメモリに退避（localStorageには触れない）
      const snap={}; VIEW_FIELDS.forEach(k=>{ snap[k]=state[k]; });
      state._liveSnapshot=snap;
      // バックアップを state に読み込み（保存はしない）
      state.logs=p.logs||[];
      state.dailies=p.dailies||[];
      state.todos=p.todos||{};
      if(p.goals)state.goals=p.goals;
      state.schedule=p.schedule||{};
      state.repeatEvents=p.repeatEvents||[];
      state.tasks=p.tasks||{todo:[],shopping:[]};
      if(Array.isArray(p.routines)&&p.routines.length)state.routines=p.routines;
      if(p.shiftPattern&&Array.isArray(p.shiftPattern.grid))state.shiftPattern={...defaultShiftPattern(),...p.shiftPattern};
      if(Array.isArray(p.planPatterns))state.planPatterns=p.planPatterns;
      if(Array.isArray(p.customTodos))state.customTodos=p.customTodos;
      state.goalTree=Array.isArray(p.goalTree)?p.goalTree:[];
      if(Array.isArray(p.rewards))state.rewards=p.rewards;
      if(Array.isArray(p.investActions))state.investActions=p.investActions;
      if(Array.isArray(p.ifThenPlans))state.ifThenPlans=p.ifThenPlans;
      if(p.city)state.weatherCity=p.city;
      state._viewWeather=p.weather||{}; // 閲覧用の天気（localStorageには入れない）
      // 旧形式（v8.3）バックアップも移行して閲覧
      if(!p.schedule && !p.tasks && (p.events||p.taskList||p.wishList||p.shopList)){
        state.events=p.events||{};state.taskList=p.taskList||[];state.wishList=p.wishList||[];state.shopList=p.shopList||[];
        state.schedule={};state.repeatEvents=[];state.tasks={todo:[],shopping:[]};
        migrateOldSchedule();
      }
      state.viewingBackup=file.name||"バックアップ";
      state.viewingBackupInfo=p.exportedAt?`エクスポート: ${p.exportedAt.slice(0,10)}`:"";
      state.tab="日記"; state.viewDate=todayStr(); state.modal=null; state.storageAlert=false;
      showToast("バックアップを閲覧中（保存されません）","#818cf8");
      render();
    }catch(err){alert("閲覧できませんでした: "+err.message);}
  };
  reader.readAsText(file);e.target.value="";
}
function exitBackupView(){
  const snap=state._liveSnapshot;
  if(snap){ Object.keys(snap).forEach(k=>{ state[k]=snap[k]; }); }
  state._liveSnapshot=null; state.viewingBackup=null; state.viewingBackupInfo=null; state._viewWeather=null;
  state.modal=null;
  showToast("通常のデータに戻りました","#22c55e");
  render();
}

// ═══════════════════════════════════════════════════
// 起動
// ═══════════════════════════════════════════════════
loadStorage();
state.forecast=genForecast();
state.viewDate = todayStr();
// 夜更かし対応：日付をまたいでも、前日の就寝(睡眠開始)が未記録のうちは前日を既定表示にする。
// （起動時の初期表示のみ。正午以降は新しい日として扱う。日付ナビでいつでも切替可）
(function(){
  const now=new Date();
  if(now.getHours()<12){
    const y=addDays(todayStr(),-1);
    if(getDaily(y).bedTime==null) state.viewDate=y;
  }
})();
// ホーム画面ショートカット等から #widget で直接ウィジェット表示
// デフォルトの初期表示はウィジェット画面（起動時に今日をすぐ確認・チェックできる）
state.widget=true;
window.addEventListener('hashchange',()=>{ const w=(location.hash==='#widget'||location.hash==='#today'); if(w!==!!state.widget){ state.widget=w; if(w)state.viewDate=todayStr(); render(); } });
migrateGoalsToTree(); // 旧・期間別の記入内容を目標ツリーへ一度だけ移行
migrateResistsToInvest(); // 旧「我慢」ログを未来投資へ一度だけ移行
// デバウンス中の保存を離脱/非表示時に確実に書き出す（取りこぼし防止）
window.addEventListener('pagehide',()=>{try{flushStorage();}catch(_){}});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ try{flushStorage();}catch(_){}} });
render();
document.title="体調管理 v"+APP_VERSION;
if(state._goalsMigratedCount){ setTimeout(()=>{ showToast(`過去の目標 ${state._goalsMigratedCount}件を目標ツリーに移動しました`,"#22c55e"); state._goalsMigratedCount=0; },900); }
checkStorageAndAlert();
checkBackupReminder();
// PWA: Service Worker登録＋自動更新
if('serviceWorker' in navigator){
  // 既に別のSWが制御している状態で新SWが有効化されたら1度だけリロード（最新版を確実に表示）
  const hadController = !!navigator.serviceWorker.controller;
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(swReloaded || !hadController) return;
    swReloaded = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // 起動時と1時間ごとに更新チェック
    reg.update().catch(()=>{});
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
    // 待機中の新SWがあれば即時切替を促す
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed' && navigator.serviceWorker.controller){
          try{ nw.postMessage('skipWaiting'); }catch(_){}
        }
      });
    });
  }).catch(()=>{});
  // 画面復帰時にも更新チェック（PWAを開き直したとき等）
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      navigator.serviceWorker.getRegistration().then(r=>{ if(r)r.update().catch(()=>{}); }).catch(()=>{});
    }
  });
}
// 保存済み都市があれば自動で天気取得
if(state.weatherCity) doFetchWeather(state.weatherCity);
// 1分ごとに日付変わりをチェック
setInterval(()=>{
  const td = todayStr();
  let changed=false;
  if(state.viewDate !== td && state.viewDate < td){
    // 今日タブを見ていた場合のみ自動で今日に進む
    if(state.viewDate === state._lastToday){ state.viewDate = td; changed=true; }
  }
  state._lastToday = td;
  // 日付が変わったときだけ再描画。操作中（モーダル表示中）は再描画しない
  // → 入力中のポップアップやAI分析結果が消えるのを防ぐ
  if(changed && !state.modal) render();
}, 60000);

// 現在時刻ラインだけを再描画なしで自動更新（30秒ごと）
function updateNowLine(){
  const el=document.getElementById('now-line');
  if(!el)return;
  const hourH=parseFloat(el.getAttribute('data-hourh'))||40;
  const startH=parseFloat(el.getAttribute('data-starth'))||0;
  const endH=parseFloat(el.getAttribute('data-endh'))||24;
  const now=new Date();
  const y=((now.getHours()+now.getMinutes()/60)-startH)*hourH;
  // 過去グレーの高さも当日は現在時刻まで追従
  const g=document.getElementById('past-gray');
  if(g&&g.getAttribute('data-today')==="1"){ g.style.height=Math.max(0,y)+'px'; }
  if(y<=0||y>=(endH-startH)*hourH){el.style.display='none';return;}
  el.style.display='block';
  el.style.top=y+'px';
}
setInterval(updateNowLine, 30000);
