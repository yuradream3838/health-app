  m.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"6px"}},"進捗メモ（任意）"));
  const noteTa=document.createElement('textarea');
  noteTa.style.cssText="width:100%;height:56px;padding:9px 12px;background:#0a1120;border:1px solid #1e3a5f;border-radius:8px;color:#94a3b8;font-size:13px;font-family:inherit;box-sizing:border-box;resize:vertical;margin-bottom:12px;line-height:1.5";
  noteTa.value=m0.note||"";noteTa.placeholder="進捗・気づきをメモ...";
  noteTa.addEventListener('input',e=>{state.goalTreeModal.note=e.target.value;});
  m.appendChild(noteTa);
  // ✅ 完了日時の編集（達成済みの目標のみ）。予定タブの「実績」の表示位置に反映される。
  if(m0.mode==="edit"){
    const cf=gtFind(m0.id); const cnode=cf&&cf.node;
    if(cnode && !isRangeDaily(cnode) && cnode.done){
      const cur = cnode.doneAt ? new Date(cnode.doneAt) : new Date();
      m.appendChild(div({style:{fontSize:"11px",color:"#4ade80",fontWeight:600,margin:"2px 0 5px"}},"✅ 完了日時（実績に反映）"));
      const row=div({style:{display:"flex",gap:"6px",marginBottom:"12px"}});
      const di=document.createElement('input'); di.type='date'; di.value=fmtDS(cur);
      di.style.cssText="flex:1;min-width:0;padding:8px;background:#0f172a;border:1px solid #22c55e55;border-radius:8px;color:#e2e8f0;font-size:13px;color-scheme:dark;font-family:inherit";
      const ti=document.createElement('input'); ti.type='time'; ti.value=`${String(cur.getHours()).padStart(2,'0')}:${String(cur.getMinutes()).padStart(2,'0')}`;
      ti.style.cssText="width:96px;flex-shrink:0;padding:8px;background:#0f172a;border:1px solid #22c55e55;border-radius:8px;color:#e2e8f0;font-size:13px;color-scheme:dark;font-family:inherit";
      const apply=()=>{ const dp=(di.value||fmtDS(cur)).split('-'); const tp=(ti.value||"00:00").split(':'); const dt=new Date(+dp[0],(+dp[1]||1)-1,+dp[2]||1,+tp[0]||0,+tp[1]||0,0,0); gtUpdate(cnode.id,{doneAt:dt.toISOString()}); showToast("完了日時を更新しました"); render(); };
      di.addEventListener('change',apply); ti.addEventListener('change',apply);
      row.appendChild(di); row.appendChild(ti); m.appendChild(row);
    } else if(cnode && isRangeDaily(cnode) && cnode.dailyDone && Object.keys(cnode.dailyDone).some(k=>cnode.dailyDone[k])){
      m.appendChild(div({style:{fontSize:"11px",color:"#4ade80",fontWeight:600,margin:"2px 0 5px"}},"✅ 各日の完了時刻（実績に反映）"));
      Object.keys(cnode.dailyDone).filter(k=>cnode.dailyDone[k]).sort().forEach(dsk=>{
        const ts=cnode.dailyDone[dsk]; const cur=(typeof ts==="string")?new Date(ts):null;
        const row=div({style:{display:"flex",gap:"8px",alignItems:"center",marginBottom:"6px"}});
        row.appendChild(span({style:{fontSize:"12px",color:"#94a3b8",width:"52px",flexShrink:0}},mdLabel(dsk)));
        const ti=document.createElement('input'); ti.type='time'; ti.value=cur?`${String(cur.getHours()).padStart(2,'0')}:${String(cur.getMinutes()).padStart(2,'0')}`:"00:00";
        ti.style.cssText="flex:1;min-width:0;padding:7px;background:#0f172a;border:1px solid #22c55e55;border-radius:8px;color:#e2e8f0;font-size:13px;color-scheme:dark;font-family:inherit";
        ti.addEventListener('change',(()=>{const k=dsk;return e=>{ const tp=(e.target.value||"00:00").split(':'); const dd=parseDS(k); dd.setHours(+tp[0]||0,+tp[1]||0,0,0); const f2=gtFind(cnode.id); if(f2){ const map={...(f2.node.dailyDone||{})}; map[k]=dd.toISOString(); f2.node.dailyDone=map; saveGoalTree(); showToast("完了時刻を更新しました"); render(); } };})());
        row.appendChild(ti); m.appendChild(row);
      });
    }
  }
  // 目標を予定へ（この目標を予定タブのスケジュールに追加する。連動なし）
  if(m0.mode==="edit"){
    m.appendChild(btn({style:{width:"100%",padding:"10px",marginBottom:"10px",background:"#0ea5e918",border:"1px solid #0ea5e955",borderRadius:"8px",color:"#38bdf8",fontSize:"13px",fontWeight:600,cursor:"pointer"},
      onClick:()=>{
        const f=gtFind(m0.id); const node=(f&&f.node)||{text:state.goalTreeModal.text};
        let target=state.viewDate||todayStr();
        if(node&&node.periodType==="daily"){ const ds=dailyGoalStart(node); if(ds)target=ds; } // 一日目標はその日へ
        openGoalAsEvent(node, target);
      }},"📅 この目標を予定に追加"));
  }
  const btns=[];
  if(m0.mode==="edit"){
    btns.push(btn({style:{padding:"9px 12px",background:"transparent",border:"1px solid #ef444455",borderRadius:"8px",color:"#f87171",cursor:"pointer",fontSize:"12px",fontWeight:600},
      onClick:()=>{ const f=gtFind(m0.id); const kids=f&&f.node.children&&f.node.children.length; if(confirm(kids?"下位目標も含めて削除しますか？":"この目標を削除しますか？")){ gtDelete(m0.id); state.goalTreeModal=null; render(); } }},"🗑 削除"));
  }
  btns.push(btn({className:"btn-ghost",style:{flex:1},onClick:()=>{state.goalTreeModal=null;render();}},"キャンセル"));
  btns.push(btn({style:{flex:1,padding:"10px",background:"linear-gradient(135deg,#0ea5e9,#6366f1)",border:"none",borderRadius:"8px",color:"#fff",fontSize:"13px",fontWeight:600,cursor:"pointer"},
    onClick:()=>{
      const text=(state.goalTreeModal.text||"").trim();
      if(!text){ alert("目標を入力してください"); return; }
      const pt=state.goalTreeModal.periodType||null;
      const pk=pt?(state.goalTreeModal.periodKey||pkDefault(pt,null,state.viewDate||todayStr())):null;
      const note=(state.goalTreeModal.note||"").trim();
      const linked=(state.goalTreeModal.linkedRoutines||[]).slice();
      // 一日目標の複数日（終了日が開始日より後のときのみ有効）
      const dStart=pt==="daily"?((pkParse(pk)||{}).date||(pk||"").replace("daily_","")):null;
      const dailyEnd=(pt==="daily"&&state.goalTreeModal.dailyEnd&&dStart&&state.goalTreeModal.dailyEnd>dStart)?state.goalTreeModal.dailyEnd:null;
      if(m0.mode==="add"){
        gtAddChild(m0.parentId==null?null:m0.parentId, text);
        const list=m0.parentId==null?state.goalTree:(gtFind(m0.parentId)?.node.children||[]); const created=list[list.length-1];
        if(created){ if(pt){created.periodType=pt;created.periodKey=pk;} if(dailyEnd)created.dailyEnd=dailyEnd; if(note)created.note=note; if(linked.length)created.linkedRoutines=linked; saveGoalTree(); }
      } else {
        gtUpdate(m0.id,{text, periodType:pt, periodKey:pk, note, linkedRoutines:linked, dailyEnd:dailyEnd||null});
      }
      state.goalTreeModal=null; render();
    }},"保存"));
  m.appendChild(div({style:{display:"flex",gap:"8px",alignItems:"center"}},btns));
  bg.appendChild(m);return bg;
}

function renderGoalTree(){
  const card=div({className:"card"});
  card.appendChild(div({style:{fontSize:"12px",color:"#64748b",marginBottom:"10px",lineHeight:1.6}},
    "🎯 最上位の目標（年間・四半期・月次など任意の期間）を置き、達成のための下位目標へ「＋」でどんどん掘り下げられます。子目標の達成率が親に集計されます。"));
  // 最上位の目標を追加（上部に配置）
  card.appendChild(div({style:{fontSize:"10px",color:"#64748b",marginBottom:"6px"}},"最上位の目標を追加"));
  const addRow=div({style:{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"12px"}});
  const addRoot=pt=>{ state.goalTreeModal={mode:"add",parentId:null,text:"",periodType:pt,periodKey:pt?pkDefault(pt,null,state.viewDate||todayStr()):null}; render(); };
  [["yearly","🏆 年間"],["quarterly","📅 四半期"],["monthly","🗓 月次"],["weekly","📆 週間"],["daily","☀️ 日次"],[null,"＋ 期間なし"]].forEach(([pt,lbl])=>{
    addRow.appendChild(btn({style:{flex:"1 1 30%",minWidth:"90px",padding:"9px 6px",background:"#0ea5e918",border:"1px solid #0ea5e955",borderRadius:"8px",color:"#38bdf8",fontSize:"12px",fontWeight:600,cursor:"pointer"},
      onClick:()=>addRoot(pt)},lbl));
  });
  card.appendChild(addRow);
  // 目標一覧（達成した最上位目標は既定で非表示）
  const roots=state.goalTree||[];
  const achievedRoots=roots.filter(n=>gtAchieved(n));
  const showAch=!!state.showAchievedGoals;
  const visibleRoots=showAch?roots:roots.filter(n=>!gtAchieved(n));
  if(!roots.length){
    card.appendChild(div({style:{fontSize:"12px",color:"#475569",textAlign:"center",padding:"18px 0"}},"まだ目標がありません。上のボタンから目標を追加してください。"));
  } else if(!visibleRoots.length){
    card.appendChild(div({style:{fontSize:"12px",color:"#475569",textAlign:"center",padding:"14px 0"}},"未達成の目標はありません 🎉"));
  } else {
    visibleRoots.forEach(root=>{ renderGoalTreeNode(root,0).forEach(r=>card.appendChild(r)); });
  }
  // 達成した目標の表示/非表示トグル（一番下）
  if(achievedRoots.length){
    const tg=btn({style:{width:"100%",marginTop:"12px",padding:"9px",borderRadius:"8px",cursor:"pointer",fontSize:"12px",fontWeight:600,border:"1px solid #334155",background:"transparent",color:"#94a3b8"}},
      showAch?`🙈 達成した目標を隠す（${achievedRoots.length}）`:`✅ 達成した目標を表示（${achievedRoots.length}）`);
    tg.addEventListener('click',()=>{ state.showAchievedGoals=!showAch; render(); });
    card.appendChild(tg);
  }
  return card;
}

function renderGoals(vd, ds){
  const wrap=div({style:{maxWidth:"600px",margin:"0 auto",padding:"10px 16px 60px"}});

  // モード切替：期間別 / 目標ツリー（期間別を左＝既定）
  const modeRow=div({style:{display:"flex",gap:"6px",marginBottom:"10px"}});
  [["period","📅 期間別"],["tree","🌳 目標ツリー"]].forEach(([k,lbl])=>{
    const on=(state.goalView||"period")===k;
    modeRow.appendChild(btn({style:{flex:1,padding:"9px",borderRadius:"8px",cursor:"pointer",fontSize:"12px",fontWeight:600,
      border:`1px solid ${on?"#38bdf8":"#334155"}`,background:on?"#0ea5e922":"transparent",color:on?"#38bdf8":"#64748b"},
      onClick:()=>{state.goalView=k;render();}},lbl));
  });
  wrap.appendChild(modeRow);
  if((state.goalView||"period")==="tree"){ wrap.appendChild(renderGoalTree()); return wrap; }


  // 期間別は「目標ツリーで期間設定した目標」の表示・チェック・進捗メモのみ。1日目標を一番上に。
  const GOAL_TYPES=[
    {type:"daily",     icon:"☀️",label:"一日目標"},
    {type:"weekly",    icon:"📆",label:"週間目標"},
    {type:"monthly",   icon:"🗓️",label:"月次目標"},
    {type:"quarterly", icon:"📅",label:"四半期目標"},
    {type:"yearly",    icon:"🏆",label:"年間目標"},
  ];
  wrap.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"10px",lineHeight:1.6}},
    "🌳 目標ツリーで各目標に期間を設定すると、その期間の欄に表示されます。ここでは達成チェックと進捗メモを編集できます（目標の追加・編集はツリーで）。"));

  // 1件分の目標ボックス（carriedLabel を渡すと繰り越し表示）
  const renderGoalBox=(n, carriedLabel)=>{
    const prog=gtProgress(n); const hasKids=n.children&&n.children.length; const pct=prog.total?Math.round(prog.done/prog.total*100):0;
    const range=isRangeDaily(n);
    const done=range?dailyGoalDone(n,vd):n.done;
    const box=div({style:{padding:"8px",background:carriedLabel?"#f9731611":"#6366f111",border:`1px solid ${carriedLabel?"#f9731644":"#6366f133"}`,borderRadius:"8px",marginBottom:"6px"}});
    const head=div({style:{display:"flex",alignItems:"center",gap:"8px"}});
    const cb=btn({style:{width:"22px",height:"22px",flexShrink:0,borderRadius:"6px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"13px",color:"#fff",
      border:`2px solid ${done?"#22c55e":"#334155"}`,background:done?"#22c55e":"transparent"}},done?"✓":"");
    cb.addEventListener('click',()=>{ if(range)setDailyGoalDone(n,vd,!done); else setGoalDone(n.id,!n.done); render(); });
    head.appendChild(cb);
    const tx=div({style:{flex:1,minWidth:0,cursor:"pointer"}},[
      carriedLabel?div({style:{fontSize:"9px",color:"#fb923c",fontWeight:700,marginBottom:"2px"}},`🔴 繰り越し（${carriedLabel}・未達成）`):null,
      div({style:{fontSize:"13px",fontWeight:600,color:done?"#475569":"#e2e8f0",textDecoration:done?"line-through":"none",wordBreak:"break-word"}},n.text||"(無題)"),
      range?div({style:{fontSize:"9px",color:"#a5b4fc",marginTop:"2px",fontWeight:600}},dailyRangeLabel(n)):null,
      hasKids?div({style:{fontSize:"9px",color:"#64748b",marginTop:"2px"}},`下位目標 ${prog.done}/${prog.total} (${pct}%)`):null
    ]);
    tx.addEventListener('click',()=>{state.goalView="tree";state.goalTreeModal={mode:"edit",id:n.id,text:n.text||""};render();});
    head.appendChild(tx);
    box.appendChild(head);
    // 連結した習慣の期間内の実施回数
    if(n.linkedRoutines&&n.linkedRoutines.length){
      const range=goalPeriodRange(n.periodType,n.periodKey);
      const cnt=range?countLinkedRoutineDone(n.linkedRoutines,range.start,range.end):0;
      box.appendChild(div({style:{fontSize:"10px",color:"#4ade80",marginTop:"6px",lineHeight:1.4}},`🔁 連結習慣の実施 ${cnt}回（${linkedRoutineNames(n.linkedRoutines).join("・")}）`));
    }
    const pr=document.createElement('textarea');
    pr.placeholder="進捗メモ..."; pr.value=n.note||"";
    pr.style.cssText="width:100%;min-height:38px;background:#0a1120;border:1px solid #1e3a5f;border-radius:7px;color:#94a3b8;font-size:12px;padding:7px;resize:vertical;box-sizing:border-box;font-family:inherit;margin-top:6px;line-height:1.5";
    pr.addEventListener('change',e=>{gtUpdate(n.id,{note:e.target.value});});
    pr.addEventListener('blur',e=>{gtUpdate(n.id,{note:e.target.value});});
    box.appendChild(pr);
    return box;
  };

  GOAL_TYPES.forEach(({type,icon,label})=>{
    const periodLabel=goalPeriodLabel(type,vd);
    let cur, carry;
    if(type==="daily"){
      // 複数日の一日目標も含めて当日該当を収集。繰り越しは単日目標のみ（範囲目標は毎日出るので除外）
      cur=gtCollectDaily(vd);
      const curIds=new Set(cur.map(n=>n.id));
      carry=gtCollectByPeriodCarry("daily", vd).carry.filter(n=>!isRangeDaily(n) && !curIds.has(n.id));
    } else {
      ({cur, carry}=gtCollectByPeriodCarry(type, vd)); // 当該期間＋過去の未達成（繰り越し）
    }
    const doneCount=type==="daily" ? cur.filter(n=>dailyGoalDone(n,vd)).length : cur.filter(gtAchieved).length;
    const total=cur.length+carry.length;
    const card=div({className:"card",style:{marginBottom:"10px"}});
    const headRow=div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:total?"8px":"0",cursor:"pointer"}},[
      div({},[
        div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0"}},`${icon} ${label} ›`),
        div({style:{fontSize:"10px",color:"#64748b",marginTop:"2px"}},periodLabel)
      ]),
      total?div({style:{fontSize:"11px",fontWeight:700,color:(doneCount===cur.length&&!carry.length)?"#22c55e":"#64748b"}},`${doneCount}/${cur.length}${carry.length?` +繰越${carry.length}`:""}`):null
    ]);
    headRow.addEventListener('click',(()=>{const t=type;return()=>{state.goalPeriodModal={type:t,vd};render();};})());
    card.appendChild(headRow);
    if(!total){
      card.appendChild(div({style:{fontSize:"11px",color:"#475569",padding:"2px 0"}},"連動する目標はありません（目標ツリーで期間を設定）"));
    } else {
      // 過去の未達成（繰り越し）を上に、当該期間を下に
      carry.forEach(n=>card.appendChild(renderGoalBox(n, pkShort(n.periodKey))));
      cur.forEach(n=>card.appendChild(renderGoalBox(n, null)));
    }
    wrap.appendChild(card);
  });

  return wrap;
}

// 期間別カードのヘッダーをタップ → その期間の目標一覧（編集・追加）
function renderGoalPeriodModal(){
  const pm=state.goalPeriodModal; if(!pm)return div({});
  const {type,vd}=pm;
  const META={daily:{icon:"☀️",label:"一日目標"},weekly:{icon:"📆",label:"週間目標"},monthly:{icon:"🗓️",label:"月次目標"},quarterly:{icon:"📅",label:"四半期目標"},yearly:{icon:"🏆",label:"年間目標"}}[type]||{icon:"🎯",label:"目標"};
  const key=getGoalKey(type,vd);
  const goals=type==="daily" ? gtCollectDaily(vd) : gtCollectByPeriod(type,key);
  const bg=div({className:"modal-center"});
  const m=div({className:"modal-box",style:{maxHeight:"85vh",overflowY:"auto"}});
  bg.addEventListener('click',()=>{state.goalPeriodModal=null;render();});
  m.addEventListener('click',e=>e.stopPropagation());
  m.appendChild(div({style:{fontSize:"15px",fontWeight:700,color:"#e2e8f0",marginBottom:"2px"}},`${META.icon} ${META.label}`));

  goals.forEach(n=>{
    const prog=gtProgress(n); const hasKids=n.children&&n.children.length; const pct=prog.total?Math.round(prog.done/prog.total*100):0;
    const range=isRangeDaily(n);
    const done=range?dailyGoalDone(n,vd):n.done;
    const row=div({style:{display:"flex",alignItems:"center",gap:"8px",padding:"8px",background:"#0f172a",borderRadius:"8px",marginBottom:"6px"}});
    const cb=btn({style:{width:"22px",height:"22px",flexShrink:0,borderRadius:"6px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"13px",color:"#fff",
      border:`2px solid ${done?"#22c55e":"#334155"}`,background:done?"#22c55e":"transparent"}},done?"✓":"");
    cb.addEventListener('click',(()=>{const nn=n,d=done;return()=>{ if(range)setDailyGoalDone(nn,vd,!d); else setGoalDone(nn.id,!d); render(); };})());
    row.appendChild(cb);
    const tx=div({style:{flex:1,minWidth:0,cursor:"pointer"}},[
      div({style:{fontSize:"13px",fontWeight:600,color:done?"#475569":"#e2e8f0",textDecoration:done?"line-through":"none",wordBreak:"break-word"}},n.text||"(無題)"),
      range?div({style:{fontSize:"9px",color:"#a5b4fc",marginTop:"2px",fontWeight:600}},dailyRangeLabel(n)):null,
      hasKids?div({style:{fontSize:"9px",color:"#64748b",marginTop:"2px"}},`下位目標 ${prog.done}/${prog.total} (${pct}%)`):null
    ]);
    tx.addEventListener('click',(()=>{const id=n.id,t=n.text||"";return()=>{state.goalTreeModal={mode:"edit",id,text:t};render();};})());
    row.appendChild(tx);
    const del=btn({style:{flexShrink:0,fontSize:"11px",padding:"4px 9px",borderRadius:"6px",cursor:"pointer",fontWeight:600,border:"1px solid #7f1d1d",background:"transparent",color:"#fca5a5"}},"🗑");
    del.addEventListener('click',(()=>{const id=n.id,t=n.text||"";return()=>{ if(confirm(`「${t}」を削除しますか？`)){ gtDelete(id); render(); } };})());
    row.appendChild(del);
    m.appendChild(row);
  });
  // 追加欄
  if(pm._add===undefined)pm._add="";
  const addWrap=div({style:{marginTop:"10px",padding:"10px",background:"#0f172a",borderRadius:"8px",border:"1px dashed #334155"}});
  addWrap.appendChild(div({style:{fontSize:"10px",color:"#64748b",marginBottom:"6px"}},"この期間に目標を追加"));
  const inp=document.createElement('input');inp.type='text';inp.value=pm._add;inp.placeholder="目標を入力...";
  inp.style.cssText="width:100%;padding:9px 12px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:8px";
  inp.addEventListener('input',e=>{pm._add=e.target.value;});
  addWrap.appendChild(inp);
  // 一日目標のみ：複数日にする終了日（任意）
  if(type==="daily"){
    if(pm._addEnd===undefined)pm._addEnd="";
    const er=div({style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}});
    er.appendChild(span({style:{fontSize:"10px",color:"#64748b",flexShrink:0}},`${vd.replace(/-/g,"/")}〜`));

    de.addEventListener('change',e=>{pm._addEnd=e.target.value;});
    er.appendChild(de);
    addWrap.appendChild(er);

function renderGoalHistory(vd){
  const type=state.goalHistoryType;
  const LABELS={yearly:"年間目標",quarterly:"四半期目標",monthly:"月次目標",weekly:"週間目標",daily:"一日目標"};

  const keys=Object.keys(state.goals).filter(k=>k.startsWith(prefix)).sort().reverse();

  const bg=div({className:"modal-bg"});
  const m=div({className:"modal",style:{maxHeight:"85vh",overflow:"hidden",display:"flex",flexDirection:"column"}});

  ])).querySelector('button').addEventListener('click',()=>{state.goalHistoryType=null;render();});

    keys.forEach(key=>{

        periodStr=`${mon.getMonth()+1}/${mon.getDate()}〜${sun.getMonth()+1}/${sun.getDate()}`;
      } else if(type==="monthly"){
        const p=raw.split('-');periodStr=`${p[0]}年${parseInt(p[1])}月`;

        state.goalEditKey=k;
        state.goalEditType=type2;
        state.goalEditText=g.text||"";
        state.goalEditProgress=g.progress||"";
        state.goalEditDone=g.done||false;

      item.appendChild(div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},[

async function doFetchWeather(city){
  if(state.viewingBackup)return; // 閲覧中は取得・保存しない
  state.weatherLoading=true;state.weatherError=null;state.weather=[];render();
  try{
    state.weather=await fetchWeatherAPI(city.lat,city.lon);
    state.weatherCity=city;
    try{localStorage.setItem(STORAGE_KEY+"_city",JSON.stringify(city));}catch{}

    // 天気データを日付キーで保存
    const td=todayStr();
    let weatherStore={};
    try{const s=localStorage.getItem(STORAGE_KEY+"_weather");if(s)weatherStore=JSON.parse(s);}catch{}
    weatherStore[td]=state.weather;

    // 90日の境界日を計算
    const cutoff90=new Date();cutoff90.setDate(cutoff90.getDate()-90);
    const cutoff90Str=`${cutoff90.getFullYear()}-${String(cutoff90.getMonth()+1).padStart(2,'0')}-${String(cutoff90.getDate()).padStart(2,'0')}`;

    // 各日付のデータを整理
    Object.keys(weatherStore).forEach(dateKey=>{
      if(dateKey>=cutoff90Str){
        // 90日以内：全時間保持
        return;
      }
      // 90日より前：体調記録のある時間とその前2時間のみ保持
      const scoredHours=state.logs
        .filter(l=>l.dateStr===dateKey&&l.score!=null)
        .map(l=>l.hour);
      if(scoredHours.length===0){
        // 体調記録なし→削除
        delete weatherStore[dateKey];
        return;
      }
      // 保持する時間を計算（記録時間とその前2時間）
      const keepHours=new Set();
      scoredHours.forEach(h=>{
        for(let i=0;i<=2;i++){
          const t=h-i;
          if(t>=0)keepHours.add(t);
        }
      });
      // 不要な時間を削除
      weatherStore[dateKey]=weatherStore[dateKey].filter(w=>keepHours.has(w.hour));
      if(weatherStore[dateKey].length===0) delete weatherStore[dateKey];
    });

    try{localStorage.setItem(STORAGE_KEY+"_weather",JSON.stringify(weatherStore));}catch{}
  }catch(e){
    state.weatherError=e.message;
  }
  state.weatherLoading=false;render();
}

function openScoreModal(dateStr,hour){
  const ex=getLog(dateStr,hour);
  state.editDate=dateStr;state.editHour=hour;

// 日付ユーティリティ
function parseDS(ds){const p=ds.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
function fmtDS(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addDays(ds,n){const x=parseDS(ds);x.setDate(x.getDate()+n);return fmtDS(x);}
// 共通の整形ヘルパー（各所でインライン定義していた重複を集約）
function mdLabel(ds){ if(!ds)return ""; const p=(""+ds).split('-'); return p.length>=3?`${parseInt(p[1])}/${parseInt(p[2])}`:""; } // "M/D"
function hhmm(h,m){ return `${String(h).padStart(2,'0')}:${String(m||0).padStart(2,'0')}`; } // "HH:MM"
// その夜の中途覚醒の合計（分）。覚醒はその朝(ds)の記録に付く
function getNightAwakeMins(ds){ return (getDaily(ds).awakenings||[]).reduce((a,x)=>a+(x.mins||0),0); }
// その日の朝に起きた睡眠(＝前日の就寝→当日の起床)の時間数（中途覚醒を差し引いた実睡眠）。未記録は null
function getNightSleepHours(ds){
  const bed=getDaily(addDays(ds,-1)).bedTime, wake=getDaily(ds).wakeTime;
  if(bed==null||wake==null)return null;
  const gross=(wake-bed+24)%24;
  return Math.max(0, gross - getNightAwakeMins(ds)/60);
}

function migrateSleepModel(){

// 繰り返し予定が指定日にマッチするか
function repeatMatches(ev, dateStr){
  const d=parseDS(dateStr), s=parseDS(ev.startDate);
  if(d<s)return false;
  if(ev.endDate){ const e2=parseDS(ev.endDate); if(d>e2)return false; } // これ以降変更で分割した終了日
  if(ev.exceptions && ev.exceptions.includes(dateStr))return false;     // この予定のみ変更で除外した日
  const t=ev.repeatType;
  if(t==="daily")return true;
  if(t==="w1"||t==="w2"||t==="w3"||t==="w4"){
    const k=parseInt(t.slice(1));
    const wds=(ev.weekdays&&ev.weekdays.length)?ev.weekdays:[s.getDay()];
    if(!wds.includes(d.getDay()))return false;
    // 週間隔は各週の月曜起点で判定（複数曜日でも正しく数える）
    const mon=x=>{const m=new Date(x.getFullYear(),x.getMonth(),x.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m;};
    const weeks=Math.round((mon(d)-mon(s))/(7*86400000));
    return weeks%k===0;
  }
  if(t==="nth"){
    if(d.getDay()!==s.getDay())return false;
    return Math.ceil(d.getDate()/7)===Math.ceil(s.getDate()/7);
  }
  if(t==="monthly")return d.getDate()===s.getDate();
  if(t==="yearly")return d.getMonth()===s.getMonth()&&d.getDate()===s.getDate();
  return false;
}

// 指定日の全予定（単発＋繰り返し展開）
// 2つの日付（YYYY-MM-DD）間の日数（含む両端）：同日=1
function daySpanInclusive(a,b){ return Math.round((parseDS(b)-parseDS(a))/86400000)+1; }
function getEventsForDate(vd){
  const singles=(state.schedule[vd]||[]).map(e=>{
    const m={...e,isRepeat:false};
    if(e.endDate && e.endDate>vd){ // 複数日予定の初日
      m._mdStart=vd; m._mdEnd=e.endDate; m._mdCount=daySpanInclusive(vd,e.endDate); m._mdIndex=1; m._mdFirst=true; m.allDay=true;
    }
    return m;
  });
  // 複数日にまたがる予定：別の起点日から vd の範囲に入るものを継続表示
  const multi=[];
  Object.keys(state.schedule||{}).forEach(sd=>{
    if(sd===vd) return;
    (state.schedule[sd]||[]).forEach(e=>{
      if(e.endDate && e.endDate>sd && vd>sd && vd<=e.endDate){
        multi.push({...e, isRepeat:false, allDay:true, _mdStart:sd, _mdEnd:e.endDate,
          _mdCount:daySpanInclusive(sd,e.endDate), _mdIndex:daySpanInclusive(sd,vd), _mdCont:true, _mdLast:(vd===e.endDate)});
      }
    });
  });
  const repeats=(state.repeatEvents||[]).filter(ev=>repeatMatches(ev,vd)).map(e=>({...e,isRepeat:true}));
  return [...singles,...multi,...repeats].sort((a,b)=>((a.startH||0)*60+(a.startM||0))-((b.startH||0)*60+(b.startM||0)));
}

// 繰り返しタイプのラベル
function repeatLabel(t, startDate){
  const s=parseDS(startDate);
  const w=WEEKDAYS_JP[s.getDay()];
  const nth=Math.ceil(s.getDate()/7);
  const map={
    daily:"毎日", w1:`毎週${w}曜`, w2:`2週ごと${w}曜`, w3:`3週ごと${w}曜`, w4:`4週ごと${w}曜`,
    nth:`第${nth}${w}曜`, monthly:`毎月${s.getDate()}日`, yearly:`毎年${s.getMonth()+1}/${s.getDate()}`
  };
  return map[t]||"";
}

// TODOタブから「実際の行動」を取得（タイマー＋チェック完了）
// 日跨ぎ対応：予定/実績の絶対分スパン（endNextDay または 終了<開始 で翌日へ延長）
function itemAbsSpan(it){
  let s=(it.startH||0)*60+(it.startM||0);
  let e=(it.endH!=null?it.endH*60+(it.endM||0):s+15);
  if(it.startNextDay) s+=1440;  // 開始を翌日に
  if(it.endNextDay) e+=1440;    // 終了を翌日に
  if(e<=s) e+=1440;
  return {s,e};
}
// 所有日(vd)に表示する部分：[start, min(1440,end)]
function crossOwnerSeg(it){ const {s,e}=itemAbsSpan(it); if(s>=1440) return null; return {...it, startMin:s, endMin:Math.min(1440,e)}; }
// 翌日にまたがった尾部：[max(0,start-1440), end-1440]（開始が翌日の実績は翌日側で正しい開始時刻に）
function crossTailSeg(it){ const {s,e}=itemAbsSpan(it); if(e<=1440) return null; return {...it, startMin:Math.max(0,s-1440), endMin:Math.min(1440,e-1440), _tail:true}; }

// 達成した目標を「実際の行動」として返す（達成時刻の日付がvdのもの）。
// 通常目標は node.doneAt、範囲一日目標は dailyDone[vd] のタイムスタンプを達成時刻に使う。
function goalActualsForDate(vd){
  const out=[];
  const mm=iso=>{try{const x=new Date(iso);if(isNaN(x))return null;return x.getHours()*60+x.getMinutes();}catch{return null;}};
  const onVd=iso=>{try{return fmtDS(new Date(iso))===vd;}catch{return false;}};
  const push=(n,m)=>{ if(m!=null) out.push({title:`🎯 ${n.text||"目標"}`,startMin:m,endMin:m+12,isPoint:true,color:"#a78bfa",goalId:n.id}); };
  const walk=list=>{ (list||[]).forEach(n=>{
    if(isRangeDaily(n)){
      const ts=n.dailyDone&&n.dailyDone[vd];
      if(typeof ts==="string") push(n, mm(ts)); // 旧データの true は時刻不明なので表示しない
    } else if(n.done && n.doneAt && onVd(n.doneAt)){
      push(n, mm(n.doneAt));
    }
    if(n.children&&n.children.length) walk(n.children);
  }); };
  walk(state.goalTree);
  return out;
}
function getActualActivities(vd){
  const acts=[];
  const routines=state.routines||[];
  const routineIds=new Set(routines.flatMap(g=>g.ids));
  const mm=dt=>{const x=new Date(dt);return x.getHours()*60+x.getMinutes();};
  // 完了時刻の「日付」が vd のものを vd に表示する（当日分でも、日付をまたいで
  // 翌日に完了したものはその翌日側に反映される）。前日・当日のtodosを走査。
  const onVd=iso=>{try{return fmtDS(new Date(iso))===vd;}catch{return false;}};
  const scanDays=[addDays(vd,-1), vd];
  scanDays.forEach(DD=>{
    const t=state.todos[DD]||{};
    TODO_ITEMS.forEach(item=>{
      if(routineIds.has(item.id))return; // ルーティンは後でまとめて1ブロックに
      const d=t[item.id];
      if(!d||d.excluded)return;
      if(item.multi&&d.sessions){
        d.sessions.forEach(s=>{
          if(s.startTime&&s.endTime&&onVd(s.startTime)){
            acts.push({title:item.label+(s.note?`：${s.note}`:""),startMin:mm(s.startTime),endMin:mm(s.endTime)});
          }
        });
      } else if(item.type==="timer"&&d.startTime&&d.endTime){
        if(onVd(d.startTime)) acts.push({title:item.label,startMin:mm(d.startTime),endMin:mm(d.endTime)});
      } else if(item.type==="check"&&d.checked&&d.time){
        if(onVd(d.time)) acts.push({title:"✓"+item.label,startMin:mm(d.time),endMin:mm(d.time)+12,isPoint:true});
      }
    });
  });
  // ルーティンは1ブロックにまとめて表示（完了時刻の最早〜最遅）。
  // 完了時刻の日付が vd のものだけ集約。※所有日(DD)ごとに別ブロックにする
  //   → 前日のナイトルーティンが0時をまたいで当日に完了しても、当日のナイトルーティンと
  //     まとまらず、別々のブロックとして表示される。
  routines.forEach(g=>{
    scanDays.forEach(DD=>{
      const t=state.todos[DD]||{};
      const mins=[];
      const addMin=iso=>{ if(iso&&onVd(iso)) mins.push(mm(iso)); };
      (g.ids||[]).forEach(id=>{
        const d=t[id];
        if(!d||d.excluded)return;
        if(d.checked&&d.time) addMin(d.time);
        addMin(d.startTime);
        addMin(d.endTime);
        (d.sessions||[]).forEach(s=>{ addMin(s.startTime); addMin(s.endTime); });
      });
      if(mins.length){
        const s=Math.min(...mins), e=Math.max(...mins);
        acts.push({title:g.title, startMin:s, endMin:Math.max(e, s+16), color:g.color});
      }
    });
  });
  // アルコール記録も実際の行動として反映（琥珀色で区別）。
  // 「翌日」(startNextDay)の飲酒は入力日ではなく実際に飲んだ翌日側へ表示。
  const daily=getDaily(vd);
  for(let off=-1; off<=0; off++){
    const D=addDays(vd,off);
    (getDaily(D).drinks||[]).forEach(dr=>{
      if(off + (dr.startNextDay?1:0) !== 0) return; // この飲酒の実消費日がvdでなければ除外
      const dt=resolveDT(dr);
      const sMin=(dr.hour||0)*60+(dr.min||0);
      acts.push({title:`${dt.emoji}${dt.label}`,startMin:sMin,endMin:sMin+12,isPoint:true,color:"#f59e0b"});
    });
  }
  // 睡眠：就寝日(D)を1つの夜として bed(D)→wake(D+1) を span&clip で反映
  // （その日の就寝と、翌朝の起床。就寝が早朝<12なら翌日就寝として扱う）
  {
    const SC="#60a5fa";
    for(let off=-1; off<=0; off++){
      const D=addDays(vd,off);
      const bed=getDaily(D).bedTime, wake=getDaily(addDays(D,1)).wakeTime;
      if(bed==null && wake==null) continue;
      let bedAbs = bed!=null ? ((bed<12?off+1:off)*1440 + bed*60) : null;
      let wakeAbs= wake!=null ? ((off+1)*1440 + wake*60) : null;
      if(bedAbs==null) bedAbs=wakeAbs-480;   // 就寝未記録→8h仮定
      if(wakeAbs==null) wakeAbs=bedAbs+480;   // 起床未記録→8h仮定
      // 中途覚醒（その朝の記録）を睡眠から差し引き、覚醒時間帯は睡眠実績を出さない
      const awakes=getDaily(addDays(D,1)).awakenings||[];
      let segs=[[bedAbs,wakeAbs]];
      awakes.forEach(aw=>{
        const awBase=(aw.hour<12?off+1:off);
        const a0=awBase*1440+aw.hour*60+(aw.min||0), a1=a0+(aw.mins||0);
        segs=segs.reduce((acc,[s0,s1])=>{ if(a1<=s0||a0>=s1){acc.push([s0,s1]);} else { if(a0>s0)acc.push([s0,a0]); if(a1<s1)acc.push([a1,s1]); } return acc; },[]);
      });
      segs.forEach(([s0,s1])=>{ const s=Math.max(0,Math.round(s0)), e=Math.min(1440,Math.round(s1)); if(e>s) acts.push({title:"😴 睡眠",startMin:s,endMin:e,color:SC}); });
    }
  }
  // 昼寝も反映
  (daily.naps||[]).forEach(n=>{
    const s=(n.hour||0)*60+(n.min||0);
    let e=n.endHour!=null?(n.endHour*60+(n.endMin||0)):s+(n.mins||30);
    if(e<=s)e=s+(n.mins||30);
    acts.push({title:"💤 昼寝",startMin:s,endMin:e,color:"#93c5fd"});
  });
  // 射精も実際の行動として反映（ピンクで区別・点イベント）。タグは略記表示（自慰→ON / セックス→SE）
  (daily.ejaculations||[]).forEach(ej=>{
    if(ej.startNextDay) return; // 翌日ぶんは翌日側のタイムラインで表示
    const s=(ej.hour||0)*60+(ej.min||0);
    const tagAbbr = ej.tag==="自慰"?"ON":ej.tag==="セックス"?"SE":(ej.tag||"");
    acts.push({title:`💧${tagAbbr?" "+tagAbbr:""}`,startMin:s,endMin:s+12,isPoint:true,color:"#ec4899"});
  });
  // 服薬（点イベント）
  (daily.meds||[]).forEach(md0=>{
    const s=(md0.hour||0)*60+(md0.min||0);
    acts.push({title:`💊 ${md0.name||""}`.trim(),startMin:s,endMin:s+12,isPoint:true,color:"#14b8a6"});
  });
  // 日記で記録した実際の勤務は実際(右)列に反映（予定シフトとは独立）。
  // 残業込みで0時を跨ぐ場合は、その勤務を所有する日(D)を基準に絶対分で計算し、
  // 表示日(vd)へ切り出す（span&clip）＝翌日にも続きが表示される。
  for(let off=-1; off<=0; off++){
    const D=addDays(vd,off);
    const dd=getDaily(D);
    if(dd.workStart==null||dd.workEnd==null)continue;
    const wsAbs=off*1440+Math.round(dd.workStart*60);
    const weAbs=off*1440+Math.round((dd.workEnd+(dd.overtime||0))*60);
    const s=Math.max(0,wsAbs), e=Math.min(1440,weAbs);
    if(e>s) acts.push({title:"💼 仕事",startMin:s,endMin:e,color:"#2dd4bf"});
  }
  // 定期ルーティン：チェック済みを実際列へ。
  //  完了時刻(rec.time)がある場合は「その時刻の日付」がvdのものだけ表示する（前日キーに記録されていても
  //  0時すぎ＝翌日に完了したものは翌日側に出す＝日付ズレ防止）。前日・当日のキーを走査。
  [addDays(vd,-1), vd].forEach(DD=>{
    (state.customTodos||[]).forEach(ct=>{
      const rec=(state.todos[DD]||{})[ct.uid];
      if(rec&&rec.checked&&rec.time&&onVd(rec.time)){
        const t2=new Date(rec.time); const mins=t2.getHours()*60+t2.getMinutes();
        acts.push({title:"✓"+ct.label,startMin:mins,endMin:mins+12,isPoint:true,color:ct.color||"#22c55e"});
      }
    });
  });
  //  完了時刻の記録がない（チェックのみ）当日該当分は、予定時刻の位置に表示
  (state.customTodos||[]).forEach(ct=>{
    const rec=(state.todos[vd]||{})[ct.uid];
    if(rec&&rec.checked&&!rec.time){ const tt=customTodoTimeFor(ct,vd); if(tt){ const sp=customTodoSpan(tt); if(sp.s<1440) acts.push({title:"✓"+ct.label,startMin:sp.s,endMin:Math.min(1440,sp.e),isPoint:(sp.e-sp.s)<=12,color:ct.color||"#22c55e"}); } }
  });
  // 手動登録した実績（予定外・突発的な行動を含む）。日跨ぎは当日側を末尾までクリップ
  (daily.actuals||[]).forEach(a=>{
    const {s,e}=itemAbsSpan(a);
    if(s>=1440)return;
    acts.push({title:(a.unplanned?"⚡ ":"")+a.title,startMin:s,endMin:Math.min(1440,e),color:a.color||"#f472b6",manualUid:a.uid,unplanned:!!a.unplanned});
  });
  // 達成した目標を実績に反映（達成時刻がvdのもの）。紫の点マーカーで表示。
  goalActualsForDate(vd).forEach(g=>acts.push(g));
  return acts.sort((a,b)=>a.startMin-b.startMin);
}

// 左（予定）列に出すパターン由来のブロック（シフト計画＋パターン予定）
function getPlannedExtras(vd){
  const out=[];
  const sk=getPlanShiftKey(vd);
  // シフト計画（パターン or 予定上書き・カスタム時刻）を予定(左)へ。実績(workStart)とは独立
  const sb=getPlanShiftBlock(vd);
  if(sb){
    out.push({title:`💼 ${sb.ovLabel||sb.label}${sb.place?` 📍${sb.place}`:""}${sb.note?" 📝":""}`,color:sb.color,startH:sb.startH,startM:sb.startM,endH:sb.endH,endM:sb.endM,isPattern:true,shiftBlock:true,shiftBaseLabel:sb.label,shiftNote:sb.note,shiftOvLabel:sb.ovLabel,shiftPlace:sb.place});
  }
  // パターン予定（睡眠など）。シフト連動なら当日のシフトで時間が変わる。0時またぎは分割
  // 日をまたぐ睡眠などは「就寝する日」を1つの夜として扱う：
  //  ・今夜(vd)の就寝→24時 は vd のシフトで
  //  ・今朝(vd)の起床(0時→) は【前日】の夜から継続 → 前日のシフトで描画
  // 各パターンを「所有する日(D)」ごとに絶対時間帯で計算し、表示日(vd)に切り出す（span & clip）。
  //  ・翌日フラグ(nextDay)で、その日の睡眠を翌日にずらせる（2直明けの睡眠など）
  //  ・終了<開始 は0時またぎ（翌朝まで）として扱う
  //  ・1つの夜=1つの所有日、なので境目で重複・欠落が起きない
  const addD=(ds,n)=>{const x=parseDS(ds);x.setDate(x.getDate()+n);return fmtDS(x);};
  (state.planPatterns||[]).forEach(p=>{
    if(p.enabled===false)return;
    for(let off=-2; off<=0; off++){
      const D=addD(vd,off);
      const t=patternTimesFor(p,D);
      if(!t)continue;
      const base=off+(t.nextDay?1:0);                 // vd基準の日数（この夜の開始日）
      let startAbs=base*1440+t.sH*60+(t.sM||0);
      let endAbs  =base*1440+t.eH*60+(t.eM||0);
      if(endAbs<=startAbs)endAbs+=1440;               // 0時またぎ
      const s=Math.max(0,startAbs), e=Math.min(1440,endAbs);
      if(e<=s)continue;                                // vd に掛からない
      const ovObj=(getDaily(D).patternOv||{})[p.uid];
      const dispTitle=(ovObj&&ovObj.labelOverride)||p.title;
      const noteOv=(ovObj&&ovObj.noteOverride)||"";
      // このパターンが「終わる日」（＝起床する日）。0時をまたぐ睡眠は所有日の翌日に起床する。
      const endMin=t.eH*60+(t.eM||0), startMin=t.sH*60+(t.sM||0);
      const wakeDate=addD(D, (t.nextDay?1:0)+(endMin<=startMin?1:0));
      out.push({title:dispTitle+(noteOv?" 📝":""),color:p.color||"#38bdf8",startH:Math.floor(s/60),startM:s%60,endH:Math.floor(e/60),endM:e%60,
        isPattern:true,patternUid:p.uid,oSH:t.sH,oSM:t.sM,oEH:t.eH,oEM:t.eM,oNext:!!t.nextDay,ovDate:D,wakeDate,ovDay:!!(ovObj&&ovObj.startH!=null),patternNote:noteOv});
    }
  });
  // たまにやること（カスタムTODO）で時刻設定があるものは、その日の予定(左)に表示。
  // 「終了は翌日」で0時をまたぐ場合は、所有日を基準に絶対分で計算し表示日(vd)へ切り出す。
  for(let off=-2; off<=0; off++){
    const D=addD(vd,off);
    dueCustomTodos(D).forEach(ct=>{
      if((state.todos[D]||{})[ct.uid]?.excluded)return; // 除外した回は予定にも出さない
      const tt=customTodoTimeFor(ct,D); if(!tt)return;
      const {s,e}=customTodoSpan(tt);
      const startAbs=off*1440+s, endAbs=off*1440+e;
      const cs=Math.max(0,startAbs), ce=Math.min(1440,endAbs);
      if(ce<=cs)return; // vd に掛からない
      const rec=(state.todos[D]||{})[ct.uid]||{};
      const lbl=rec.labelOverride||ct.label;
      out.push({title:`☑️ ${lbl}${rec.noteOverride?" 📝":""}`,color:ct.color||"#38bdf8",startH:Math.floor(cs/60),startM:cs%60,endH:Math.floor(ce/60),endM:ce%60,customTodo:true,ctUid:ct.uid,ctLabel:lbl,ctDate:D});
    });
  }
  return out;
}
// 指定日Dの占有状況（予定＋シフト・パターン・定期ルーティンなど時間を占めるすべて）と空き時間を返す。
// 予定追加モーダルで「その日の予定・空き時間」を確認するために使う。excludeUidの予定は除外（編集中の自分自身）。
function dayOccupancy(D, excludeUid){
  const allDay=[], timed=[];
  getEventsForDate(D).forEach(e=>{
    if(excludeUid!=null && String(e.uid)===String(excludeUid))return;
    if(e.allDay){ allDay.push({title:e.title||"予定",color:e.color||"#38bdf8"}); return; }
    let s=(e.startH||0)*60+(e.startM||0), en=(e.endH||0)*60+(e.endM||0);
    if(e.endNextDay)en+=1440; if(en<=s)en+=1440;
    const cs=Math.max(0,Math.min(1440,s)), ce=Math.max(0,Math.min(1440,en));
    if(ce>cs) timed.push({s:cs,e:ce,title:e.title||"予定",color:e.color||"#38bdf8"});
  });
  getPlannedExtras(D).forEach(x=>{
    const s=(x.startH||0)*60+(x.startM||0), en=(x.endH||0)*60+(x.endM||0);
    const cs=Math.max(0,Math.min(1440,s)), ce=Math.max(0,Math.min(1440,en));
    if(ce>cs) timed.push({s:cs,e:ce,title:x.title||"予定",color:x.color||"#38bdf8"});
  });
  timed.sort((a,b)=>a.s-b.s||a.e-b.e);
  // 占有区間をマージして、30分以上の空きスロットを算出
  const merged=[];
  timed.forEach(t=>{ const last=merged[merged.length-1]; if(last && t.s<=last.e){ last.e=Math.max(last.e,t.e); } else merged.push({s:t.s,e:t.e}); });
  const free=[]; let cur=0;
  merged.forEach(iv=>{ if(iv.s-cur>=30) free.push({s:cur,e:iv.s}); cur=Math.max(cur,iv.e); });
  if(1440-cur>=30) free.push({s:cur,e:1440});
  return {allDay, timed, free};
}
// パターンpの指定日dsでの時刻 {sH,sM,eH,eM,nextDay}。非表示/対象外は null
function patternTimesFor(p,ds){
  if(!p||p.enabled===false)return null;
  const ov=(getDaily(ds).patternOv||{})[p.uid];
  if(ov&&ov.hidden)return null;
  if(ov&&ov.startH!=null) return {sH:ov.startH,sM:ov.startM||0,eH:ov.endH,eM:ov.endM||0,nextDay:!!ov.nextDay};
  const dow=parseDS(ds).getDay();
  if(Array.isArray(p.weekdays)&&p.weekdays.length&&!p.weekdays.includes(dow))return null;
  // 曜日別の時間上書き：設定された曜日はシフト連動/固定の基本時刻より優先。
  // 各曜日上書きはさらに「直で分ける」ことができ、その場合は当日のシフトで時間が変わる。
  const wt=(p.weekdayTimes||{})[dow];
  if(wt){
    if(wt.byShift){
      const dshift=getPlanShiftKey(ds)||"off";
      const st=(wt.shiftTimes||{})[dshift];
      if(st&&st.on!==false&&st.startH!=null) return {sH:st.startH,sM:st.startM||0,eH:st.endH,eM:st.endM||0,nextDay:!!st.nextDay};
      return null; // その直は非表示指定
    }
    if(wt.startH!=null) return {sH:wt.startH,sM:wt.startM||0,eH:wt.endH,eM:wt.endM||0,nextDay:!!wt.nextDay};
  }
  if(p.byShift){
    const dshift=getPlanShiftKey(ds)||"off";
    const st=(p.shiftTimes||{})[dshift];
    if(!st||st.on===false)return null;
    return {sH:st.startH,sM:st.startM||0,eH:st.endH,eM:st.endM||0,nextDay:!!st.nextDay};
  }
  return {sH:p.startH,sM:p.startM||0,eH:p.endH,eM:p.endM||0,nextDay:!!p.nextDay};
}

// 自由入力の時刻フィールド（HH:MM）
function timeField(getH,getM,setHM){
  const inp=document.createElement('input');inp.type='time';
  const clamp=n=>Math.max(0,Math.min(23,n|0));
  inp.value=`${String(clamp(getH())).padStart(2,'0')}:${String(getM()||0).padStart(2,'0')}`;
  inp.style.cssText="flex:1;min-width:0;padding:9px 10px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:15px;font-family:inherit;color-scheme:dark";
  inp.addEventListener('change',e=>{const parts=(e.target.value||"").split(':');const h=Number(parts[0]),mm=Number(parts[1]);if(!isNaN(h)&&!isNaN(mm))setHM(h,mm);});
  return inp;
}

            border:`1px solid ${st.nextDay?"#38bdf8":"#334155"}`,background:st.nextDay?"#0ea5e922":"transparent",color:st.nextDay?"#38bdf8":"#475569"}},st.nextDay?"翌日":"当日");

          wrapR.appendChild(timeRow(()=>st.startH,()=>st.startM||0,()=>st.endH,()=>st.endM||0,ch=>{const cur=p.shiftTimes||{};upd(p.uid,{shiftTimes:{...cur,[k]:{...st,...ch}}});}));

        if(o.byShift){ setWt({byShift:false}); }

          const base={on:true,startH:o.startH??18,startM:o.startM||0,endH:o.endH??19,endM:o.endM||0,nextDay:!!o.nextDay};
          setWt({byShift:true,shiftTimes:o.shiftTimes||{s1:{...base},s2:{...base},off:{...base}}});

      });
      head.appendChild(byB);
      if(!o.byShift){

      sub.appendChild(head);
      if(o.byShift){
        const stAll=o.shiftTimes||{};
        SHIFT_OPTS.forEach(([k,slbl])=>{
          const st=stAll[k]||{on:true,startH:o.startH??18,startM:o.startM||0,endH:o.endH??19,endM:o.endM||0};
          const setSt=ch=>{const cur=o.shiftTimes||{};setWt({shiftTimes:{...cur,[k]:{...st,...ch}}});};
          const sh=div({style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"2px"}});
          const onB=btn({style:{fontSize:"10px",padding:"2px 8px",borderRadius:"6px",cursor:"pointer",fontWeight:700,flexShrink:0,
            border:`1px solid ${st.on!==false?SHIFT_TYPES[k].color:"#334155"}`,background:st.on!==false?SHIFT_TYPES[k].color+"22":"transparent",color:st.on!==false?SHIFT_TYPES[k].color:"#475569"}},`${slbl}${st.on!==false?"":"（なし）"}`);
          onB.addEventListener('click',()=>setSt({on:st.on===false}));
          sh.appendChild(onB);
          if(st.on!==false){
            const ndB=btn({style:{fontSize:"10px",padding:"2px 8px",borderRadius:"6px",cursor:"pointer",fontWeight:600,
              border:`1px solid ${st.nextDay?"#38bdf8":"#334155"}`,background:st.nextDay?"#0ea5e922":"transparent",color:st.nextDay?"#38bdf8":"#475569"}},st.nextDay?"翌日":"当日");
            ndB.addEventListener('click',()=>setSt({nextDay:!st.nextDay}));
            sh.appendChild(ndB);
          }
          sub.appendChild(sh);
          if(st.on!==false) sub.appendChild(timeRow(()=>st.startH,()=>st.startM||0,()=>st.endH,()=>st.endM||0,ch=>setSt(ch)));
        });
      } else {
        sub.appendChild(timeRow(()=>o.startH,()=>o.startM||0,()=>o.endH,()=>o.endM||0,ch=>setWt(ch)));
      }
      wtWrap.appendChild(sub);
    });
    box.appendChild(wtWrap);
    // 色
    const l4=div({style:{display:"flex",gap:"6px"}});
    [...EV_COLORS,"#60a5fa"].forEach(c=>{const on=p.color===c;const cb=btn({style:{width:"24px",height:"24px",borderRadius:"6px",cursor:"pointer",background:c+(on?"":"55"),border:`2px solid ${on?c:"transparent"}`}},"");cb.addEventListener('click',()=>upd(p.uid,{color:c}));l4.appendChild(cb);});
    box.appendChild(l4);
    // 連動ルーティン（セット/単体）：完了すると予定タブでこのパターンがグレーアウトする
    const lkRow=div({style:{marginTop:"8px",display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}});
    lkRow.appendChild(span({style:{fontSize:"10px",color:"#64748b",flexShrink:0}},"🔗 連動ルーティン"));
    const lkSel=document.createElement('select');lkSel.className='sel';lkSel.style.cssText="flex:1;min-width:120px;font-size:12px;padding:4px 2px";
    const lkVal=lk=>!lk?"":(lk.t==="set"?"set:"+lk.key:lk.t==="item"?"item:"+lk.id:lk.t);
    const curLk=lkVal(p.linkRoutine);
    const addOpt=(val,label)=>{const o=document.createElement('option');o.value=val;o.textContent=label;if(val===curLk)o.selected=true;lkSel.appendChild(o);};
    addOpt("","なし");
    addOpt("wake","🌅 起床時刻を入力");
    addOpt("bed","🌙 就寝時刻を入力");
    addOpt("work","💼 シフトの時間を入力");
    (state.routines||[]).forEach(g=>addOpt("set:"+g.key,"セット: "+(g.title||g.key)));
    TODO_ITEMS.forEach(it=>addOpt("item:"+it.id,"単体: "+it.label));
    lkSel.addEventListener('change',e=>{ const v=e.target.value; let lk=null; if(v==="wake"||v==="bed"||v==="work")lk={t:v}; else if(v.indexOf("set:")===0)lk={t:"set",key:v.slice(4)}; else if(v.indexOf("item:")===0)lk={t:"item",id:v.slice(5)}; upd(p.uid,{linkRoutine:lk}); });
    lkRow.appendChild(lkSel);
    box.appendChild(lkRow);
    box.appendChild(div({style:{fontSize:"9px",color:"#475569",marginTop:"3px"}},"連動先が完了すると、予定タブでこの予定がグレーアウトします"));
    card.appendChild(box);
  });
  const templates=[{t:"😴 睡眠",c:"#60a5fa",s:[23,0],e:[7,0]},{t:"🏋️ 運動",c:"#22c55e",s:[19,0],e:[20,0]},{t:"🍽️ 食事",c:"#fb923c",s:[12,0],e:[13,0]}];
  const addRow=div({style:{display:"flex",gap:"6px",flexWrap:"wrap",marginTop:"4px"}});
  templates.forEach(tp=>{
    const b=btn({style:{fontSize:"11px",padding:"6px 10px",background:"#0ea5e918",border:"1px solid #0ea5e9",borderRadius:"7px",color:"#38bdf8",cursor:"pointer",fontWeight:600},},"＋ "+tp.t);
    b.addEventListener('click',()=>{state.planPatterns=[...(state.planPatterns||[]),{uid:Date.now(),title:tp.t,color:tp.c,startH:tp.s[0],startM:tp.s[1],endH:tp.e[0],endM:tp.e[1],weekdays:[0,1,2,3,4,5,6],enabled:true}];savePlanPatterns();render();});
    addRow.appendChild(b);
  });
  card.appendChild(addRow);
  return card;
}

// ── 予定・タスクの横断検索 ──
// 名前で検索し、「どこで設定したか」（予定直接／定期ルーティン／ルーティン／
// パターン／目標／TODO）を示して、その設定画面へ直接ジャンプできる。
function collectSearchItems(){
  const items=[];
  const md=mdLabel, hm=hhmm;
  const WD=["日","月","火","水","木","金","土"];
  // 1. 予定（直接・単発）
  Object.keys(state.schedule||{}).forEach(dsk=>{
    (state.schedule[dsk]||[]).forEach(e=>{
      items.push({name:e.title||"(無題)",src:e.fromTask?"todo":"direct",
        srcLabel:e.fromTask?"予定（TODO由来）":"予定（直接）",icon:"📅",
        detail:`${md(dsk)}${e.allDay?" 終日":" "+hm(e.startH,e.startM)}`,
        onTap:()=>{ state.widget=false; state.viewDate=dsk; state.tab="予定"; state.scheduleSubTab="日";
          state.modal="addEvent";state.editEventUid=e.uid;state.editEventIsRepeat=false;state.editEventDate=dsk;state.eventEditMode=false;
          state.newEvTitle=e.title;state.newEvH=e.startH;state.newEvM=e.startM;state.newEvEndH=e.endH;state.newEvEndM=e.endM;
          state.newEvRepeat="none";state.newEvColor=e.color||EV_COLORS[0];state.newEvWeekdays=[parseDS(dsk).getDay()];state.newEvDate=dsk;state.newEvEndDate=e.endDate||null;
          state.newEvFromTask=e.fromTask||null;state.newEvAllDay=!!e.allDay;state.newEvPlace=e.place||"";state.newEvNote=e.note||"";state.newEvPreDays=e.preDays||0;state.editScope="this";render(); }});
    });
  });
  // 2. 予定（繰り返し）
  (state.repeatEvents||[]).forEach(e=>{
    const rl=e.repeatType==="daily"?"毎日":e.repeatType==="weekly"?`毎週 ${(e.weekdays||[]).map(i=>WD[i]).join("・")}`:e.repeatType==="monthly"?"毎月":"繰り返し";
    items.push({name:e.title||"(無題)",src:e.fromTask?"todo":"direct",
      srcLabel:e.fromTask?"予定（TODO由来・繰り返し）":"予定（繰り返し）",icon:"🔁",
      detail:`${rl}${e.allDay?" 終日":" "+hm(e.startH,e.startM)}`,
      onTap:()=>{ state.widget=false; state.tab="予定"; state.scheduleSubTab="日"; state.viewDate=todayStr();
        state.modal="addEvent";state.editEventUid=e.uid;state.editEventIsRepeat=true;state.editEventDate=todayStr();state.eventEditMode=false;
        state.newEvTitle=e.title;state.newEvH=e.startH;state.newEvM=e.startM;state.newEvEndH=e.endH;state.newEvEndM=e.endM;
        state.newEvRepeat=e.repeatType||"weekly";state.newEvColor=e.color||EV_COLORS[0];
        state.newEvWeekdays=(e.weekdays&&e.weekdays.length)?[...e.weekdays]:[parseDS(e.startDate||todayStr()).getDay()];state.newEvDate=todayStr();state.newEvEndDate=null;
        state.newEvFromTask=e.fromTask||null;state.newEvAllDay=!!e.allDay;state.newEvPlace=e.place||"";state.newEvNote=e.note||"";state.newEvPreDays=e.preDays||0;state.editScope="this";render(); }});
  });
  // 3. 定期ルーティン
  (state.customTodos||[]).forEach(ct=>{
    items.push({name:ct.label||"(無題)",src:"routine",srcLabel:"定期ルーティン",icon:"🔁",
      detail:customTodoIntervalLabel(ct),
      onTap:()=>{ state.widget=false; state.tab="タスク"; state.taskSubTab="定期ルーティン"; state.customTodoModal={...ct}; render(); }});
  });
  // 4. ルーティン（毎日・固定項目）
  TODO_ITEMS.forEach(it=>{
    items.push({name:it.label,src:"daily",srcLabel:"ルーティン（毎日）",icon:"📋",
      detail:it.type==="timer"?"タイマー":"チェック",
      onTap:()=>{ state.widget=false; state.tab="タスク"; state.taskSubTab="ルーティン"; render(); }});
  });
  // 5. パターン予定（睡眠など）
  (state.planPatterns||[]).forEach(p=>{
    items.push({name:p.title||"(無題)",src:"pattern",srcLabel:"パターン予定",icon:"🗓",
      detail:p.enabled===false?"無効":"パターン",
      onTap:()=>{ state.widget=false; state.tab="設定"; render(); showToast("設定 → パターン予定 で編集できます"); }});
  });
  // 6. 目標（ツリー・下位まで）
  const GP={daily:"日次",weekly:"週間",monthly:"月次",quarterly:"四半期",yearly:"年間"};
  const walkGoals=nodes=>{(nodes||[]).forEach(n=>{
    items.push({name:n.text||"(無題)",src:"goal",
      srcLabel:"目標"+(n.periodType&&GP[n.periodType]?`（${GP[n.periodType]}）`:""),icon:"🎯",
      detail:n.done?"達成":"未達成",
      onTap:()=>{ state.widget=false; state.tab="タスク"; state.taskSubTab="目標"; state.goalView="tree"; state.goalTreeModal={mode:"edit",id:n.id,text:n.text||""}; render(); }});
    if(n.children&&n.children.length)walkGoals(n.children);
  });};
  walkGoals(state.goalTree);
  // 7. TODO
  ((state.tasks&&state.tasks.todo)||[]).forEach(t=>{
    items.push({name:t.text||"(無題)",src:"todo",srcLabel:"TODO",icon:"✅",
      detail:t.done?"完了":"未完了",
      onTap:()=>{ state.widget=false; state.tab="タスク"; state.taskSubTab="TODO"; render(); }});
  });
  return items;
}

// パターン予定に連動したルーティン（セット/単体）が完了しているか（グレーアウト判定用）
function routineSetAllDone(setObj, vd){
  const ids=(setObj&&setObj.ids)||[];
  if(!ids.length)return false;
  return ids.every(id=>{ const item=TODO_ITEMS.find(x=>x.id===id); return item?isTodoDone(vd,item):true; });
}
function patternLinkDone(p, vd){
  const lk=p&&p.linkRoutine; if(!lk)return false;
  if(lk.t==="set"){ const s=(state.routines||[]).find(g=>g.key===lk.key); return s?routineSetAllDone(s,vd):false; }
  if(lk.t==="item"){ const item=TODO_ITEMS.find(x=>x.id===lk.id); return item?isTodoDone(vd,item):false; }
  if(lk.t==="wake"){ return getDaily(vd).wakeTime!=null; }        // 起床時刻を入力したら
  if(lk.t==="bed"){ return getDaily(vd).bedTime!=null; }          // 就寝時刻を入力したら
  if(lk.t==="work"){ const d=getDaily(vd); return d.workStart!=null && d.workEnd!=null; } // シフト（出勤・退勤）を入力したら
  return false;
}
// 通常の予定が実績に反映済みか（実績に fromEventUid=この予定 のレコードがあるか）
function eventReflected(ev, vd){
  if(!ev||ev.uid==null)return false;
  return (getDaily(vd).actuals||[]).some(a=>a.fromEventUid!=null && String(a.fromEventUid)===String(ev.uid));
}
// 予定ブロックが「完了」しているか（グレーアウト判定を一元化）：
//  定期ルーティン=所有日でチェック済み／シフト=勤務時間入力／パターン=連動ルーティン完了／通常の予定=実績に反映済み
function planBlockDone(ev, vd){
  if(ev.customTodo) return !!(((state.todos[ev.ctDate||vd]||{})[ev.ctUid])||{}).checked;
  if(ev.shiftBlock){ const d=getDaily(vd); return d.workStart!=null && d.workEnd!=null; }
  if(ev.isPattern){ const pp=(state.planPatterns||[]).find(x=>x.uid===ev.patternUid); if(!pp)return false;
    // 連動ルーティンの完了判定に使う日を決める。連動する単体/セットのルーティンは
    // 「実際にやった日」のTODOとしてチェック＝記録されるが、その日は時刻帯で変わる：
    //   ・深夜帯(0〜5時)のルーティン（シャワー・ナイト等）は所有日側に記録される
    //   ・朝(5時〜)のルーティン（モーニング等）は、翌日にずらす(nextDay)場合は表示日側に記録される
    // よって nextDay かつ開始が5時以降なら「翌日(表示日)」、それ以外は「所有日(ovDate)」で判定する。
    // 起床連動だけは「起床する日(wakeDate)」で判定（起床時刻はその日に記録されるため）。
    let day;
    if(pp.linkRoutine&&pp.linkRoutine.t==='wake') day = ev.wakeDate||vd;
    else { const sh=(ev.oSH!=null?ev.oSH:ev.startH); day = addDays(ev.ovDate||vd, (ev.oNext && sh>=5)?1:0); }
    return patternLinkDone(pp,day); }
  if(ev.uid!=null && !ev._tail) return eventReflected(ev,vd);
  return false;
}
