        const cb=btn({style:{width:"20px",height:"20px",borderRadius:"5px",flexShrink:0,border:"2px solid #334155",background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",color:"#fff"}},"");
        cb.addEventListener('click',(()=>{const uid=t.uid,tx=t.text;return()=>{ state.tasks.todo=state.tasks.todo.map(x=>x.uid===uid?{...x,done:true}:x); saveTasks(); showToast(`✅ ${tx}`); render(); };})());
        row.appendChild(cb);
        row.appendChild(span({style:{flexShrink:0,fontSize:"10px",fontWeight:700,padding:"1px 6px",borderRadius:"8px",color:overdue?"#f97316":"#38bdf8",background:(overdue?"#f97316":"#38bdf8")+"1f",border:`1px solid ${(overdue?"#f97316":"#38bdf8")}55`}},overdue?"期日超過":"期日"));
        const lab=div({style:{flex:1,fontSize:"12px",color:"#e2e8f0",cursor:"pointer",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},`✅ ${(t.imp&&t.urg)?"🔴":t.urg?"⚡":t.imp?"⭐":""}${t.text||"(無題)"}`);
        lab.addEventListener('click',()=>{ state.tab="タスク"; state.taskSubTab="TODO"; render(); });
        row.appendChild(lab);
        ad.appendChild(row);
      });
      // 完了した定期ルーティン（折りたたみ。タップで完了時刻の編集モーダルを開ける）
      if(doneCustom.length){
        const open=!!state.schedDoneOpen;
        const tg=btn({style:{width:"100%",marginTop:"6px",padding:"6px",borderRadius:"7px",cursor:"pointer",fontSize:"11px",fontWeight:600,border:"1px solid #22c55e33",background:"transparent",color:"#4ade80"}},
          open?`✅ 完了 ${doneCustom.length}件（隠す）`:`✅ 完了 ${doneCustom.length}件（時刻を編集）`);
        tg.addEventListener('click',()=>{ state.schedDoneOpen=!open; render(); });
        ad.appendChild(tg);
        if(open){
          doneCustom.forEach(ct=>{
            const rec=(state.todos[vd]||{})[ct.uid]||{};
            const lbl=rec.labelOverride||ct.label;
            const tstr = rec.time ? (()=>{const t=new Date(rec.time);return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;})() : "";
            const row=div({style:{display:"flex",alignItems:"center",gap:"8px",padding:"4px 2px",cursor:"pointer"}});
            row.appendChild(span({style:{width:"20px",height:"20px",borderRadius:"5px",flexShrink:0,border:"2px solid #22c55e",background:"#22c55e",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",color:"#fff"}},"✓"));
            if(tstr)row.appendChild(span({style:{flexShrink:0,fontSize:"11px",fontWeight:600,color:"#4ade80",minWidth:"42px"}},tstr));
            row.appendChild(div({style:{flex:1,fontSize:"12px",color:"#94a3b8",textDecoration:"line-through",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},`🔁 ${lbl}`));
            row.addEventListener('click',(()=>{const uid=ct.uid,l=lbl;return()=>{ state.planCustomTodo={uid,label:l,vd}; state.modal="planCustomTodo"; render(); };})());
            ad.appendChild(row);
          });
        }
      }
      wrap.appendChild(ad);
    }
  }

  // AI提案結果の確認カード
  if(state.aiScheduleProposal){
    const p=state.aiScheduleProposal;
    const pc=div({className:"card",style:{border:"1px solid #6366f155"}});
    pc.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#a5b4fc",marginBottom:"8px"}},"🤖 AIのスケジュール提案"));
    if(p.comment)pc.appendChild(div({style:{fontSize:"11px",color:"#94a3b8",marginBottom:"10px",lineHeight:1.6}},p.comment));
    (p.events||[]).forEach(ev=>{
      pc.appendChild(div({style:{display:"flex",gap:"8px",alignItems:"center",padding:"5px 8px",background:"#0f172a",borderRadius:"6px",marginBottom:"4px"}},[
        span({style:{fontSize:"11px",color:"#64748b",minWidth:"84px"}},`${String(ev.startH).padStart(2,'0')}:${String(ev.startM).padStart(2,'0')}〜${String(ev.endH).padStart(2,'0')}:${String(ev.endM).padStart(2,'0')}`),
        span({style:{fontSize:"12px",color:"#e2e8f0"}},ev.title)
      ]));
    });
    pc.appendChild(div({style:{display:"flex",gap:"8px",marginTop:"10px"}},[
      btn({className:"btn-ghost",style:{flex:1},onClick:()=>{state.aiScheduleProposal=null;render();}},"却下"),
      btn({style:{flex:2,padding:"9px",background:"linear-gradient(135deg,#0ea5e9,#6366f1)",border:"none",borderRadius:"8px",color:"#fff",fontSize:"12px",fontWeight:600,cursor:"pointer"},
        onClick:()=>{
          if(!state.schedule[vd])state.schedule[vd]=[];
          (state.aiScheduleProposal.events||[]).forEach(ev=>{
            state.schedule[vd].push({uid:Date.now()+Math.random(),title:ev.title,startH:ev.startH,startM:ev.startM,endH:ev.endH,endM:ev.endM,color:EV_COLORS[0]});
          });
          saveSchedule();state.aiScheduleProposal=null;render();
          showToast("📅 スケジュールを登録しました");
        }},"この予定を登録")
    ]));
    // 対話（提案を会話で調整できる）
    pc.appendChild(renderAIChat(state.aiScheduleChat, state.aiScheduleChatLoading, "aiScheduleInput", ()=>aiScheduleChatSend(vd), "例: 午後は空けて／もっと軽めに"));
    wrap.appendChild(pc);
  }

  // タイムライン（0〜24時）。1時間の高さは調整可能（既定56px・ピンチ/ボタンで変更）
  if(state.scheduleHourH==null){ let v=null; try{v=localStorage.getItem(STORAGE_KEY+"_hourh");}catch{} state.scheduleHourH=v?Math.max(30,Math.min(150,parseFloat(v)||56)):56; }
  const HOUR_H=state.scheduleHourH, START_H=0, END_H=24;
  const setHourH=nh=>{ state.scheduleHourH=Math.max(30,Math.min(150,Math.round(nh))); try{localStorage.setItem(STORAGE_KEY+"_hourh",String(state.scheduleHourH));}catch{} render(); };
  const tlCard=div({className:"card",style:{padding:"10px"}});
  // ズーム操作＋操作ヒント
  const zoomRow=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"6px"}});
  zoomRow.appendChild(span({style:{fontSize:"9px",color:"#475569"}},"空き時間タップで追加 / スワイプで前後日 / ピンチで拡大"));
  const zoomCtl=div({style:{display:"flex",alignItems:"center",gap:"5px"}});
  zoomCtl.appendChild(span({style:{fontSize:"10px",color:"#475569"}},"幅"));
  const zBtn=(lbl,delta)=>btn({style:{width:"26px",height:"24px",border:"1px solid #334155",borderRadius:"6px",background:"#0f172a",color:"#94a3b8",fontSize:"14px",fontWeight:700,cursor:"pointer",lineHeight:1},onClick:()=>setHourH((state.scheduleHourH||56)+delta)},lbl);
  zoomCtl.appendChild(zBtn("−",-8));
  zoomCtl.appendChild(zBtn("＋",8));
  zoomRow.appendChild(zoomCtl);
  tlCard.appendChild(zoomRow);
  tlCard.appendChild(div({style:{display:"flex",marginBottom:"6px"}},[
    div({style:{width:"34px"}},""),
    div({style:{flex:1,fontSize:"10px",fontWeight:700,color:"#38bdf8",textAlign:"center"}},"📅 予定"),
    div({style:{flex:1,fontSize:"10px",fontWeight:700,color:"#22c55e",textAlign:"center"}},"✔ 実際（TODO・睡眠・仕事・飲酒）")
  ]));

  const tl=div({style:{position:"relative",height:`${(END_H-START_H)*HOUR_H}px`}});
  for(let h2=START_H;h2<END_H;h2++){
    tl.appendChild(div({style:{position:"absolute",top:`${(h2-START_H)*HOUR_H}px`,left:0,right:0,borderTop:"1px solid #1e3a5f55",display:"flex"}},[
      div({style:{width:"34px",fontSize:"11px",color:"#64748b",marginTop:"-7px"}},`${h2}:00`)
    ]));
  }
  // 時間経過ではグレーアウトしない。予定のグレーは完了ベース（実績反映／チェック／連動ルーティン完了）で各ブロックに適用。
  if(isToday){
    const now=new Date();const nowY=((now.getHours()+now.getMinutes()/60)-START_H)*HOUR_H;
    if(nowY>0&&nowY<(END_H-START_H)*HOUR_H){
      tl.appendChild(div({id:"now-line","data-hourh":HOUR_H,"data-starth":START_H,"data-endh":END_H,style:{position:"absolute",top:`${nowY}px`,left:"30px",right:0,borderTop:"1.5px solid #38bdf8",zIndex:5}},[
        div({style:{width:"6px",height:"6px",borderRadius:"50%",background:"#38bdf8",marginTop:"-4px"}})
      ]));
    }
  }
  // 重なりをレーン（横並び）に振り分けて文字被りを防ぐ
  const layoutLanes=(items)=>{
    const arr=items.map(ev=>{
      const s=(ev.startMin!=null?ev.startMin:ev.startH*60+ev.startM);
      let e=(ev.endMin!=null?ev.endMin:ev.endH*60+ev.endM);
      if(e<=s)e=s+(ev.isPoint?12:16);
      return {ev,s,e,lane:0,lanes:1};
    }).sort((a,b)=>a.s-b.s||a.e-b.e);
    // 連続して重なるものをクラスタ化し、各クラスタ内でレーン割当
    let cluster=[], clusterEnd=-1;
    const flush=()=>{
      if(!cluster.length)return;
      const laneEnd=[];
      cluster.forEach(o=>{
        let placed=false;
        for(let i=0;i<laneEnd.length;i++){ if(o.s>=laneEnd[i]){o.lane=i;laneEnd[i]=o.e;placed=true;break;} }
        if(!placed){ o.lane=laneEnd.length; laneEnd.push(o.e); }
      });
      cluster.forEach(o=>o.lanes=laneEnd.length);
      cluster=[]; clusterEnd=-1;
    };
    arr.forEach(o=>{
      if(cluster.length && o.s>=clusterEnd) flush();
      cluster.push(o); clusterEnd=Math.max(clusterEnd,o.e);
    });
    flush();
    return arr;
  };
  const blockArea=(items,leftBase,widthArea,defaultColor,onTap,onMove)=>{
    layoutLanes(items).forEach(({ev,s:sMin,e:eMin,lane,lanes})=>{
      const color=ev.color||defaultColor;
      const top=((sMin/60)-START_H)*HOUR_H;
      const height=ev.isPoint?14:Math.max(16,((eMin-sMin)/60)*HOUR_H-2);
      if(top+height<0||top>(END_H-START_H)*HOUR_H)return;
      // レーン位置（横分割）。widthArea/leftBase は calc 用の生の式
      const left=`calc((${leftBase}) + (${widthArea}) * ${(lane/lanes).toFixed(4)})`;
      const width=`calc((${widthArea}) * ${(1/lanes).toFixed(4)} - 2px)`;
      const tcol=textOn(color);
      // 完了ベースのグレーアウト（時間経過では暗くしない）。判定は planBlockDone に一元化
      const blockDone=planBlockDone(ev,vd);
      const blockOpacity = blockDone?0.4:1;
      const block=div({style:{
        position:"absolute",top:`${Math.max(0,top)}px`,left,width,
        height:`${height}px`,background:color,border:`1px solid ${color}`,
        borderRadius:"5px",padding:"1px 5px",opacity:blockOpacity,
        overflow:"hidden",cursor:onTap?"pointer":"default",zIndex:3,boxSizing:"border-box"
      }});
      // 完了の目印（右上に小さな✓）
      if(blockDone) block.appendChild(div({style:{position:"absolute",top:"1px",right:"2px",fontSize:"9px",lineHeight:1,color:tcol,opacity:0.9,fontWeight:700}},"✓"));
      // タイトルは折り返し＋高さに応じて行数をクランプ。入り切らないときは字を小さくして表示量を増やす（最小8px）
      const titleText=(ev.isRepeat?"🔁":"")+ev.title+(ev.place?` 📍${ev.place}`:"")+(ev.note?" 📝":"");
      const longTitle = titleText.length>=14;
      // 長いタイトルは時刻行を省いてタイトルに高さを回す（なるべく全文を表示）
      const timeShown = height>34 && !ev.isPoint && lanes===1 && !longTitle;
      let tFont = height<20 ? 8 : (height<30 ? 9 : (lanes>=3 ? 9 : (lanes===2 ? 10 : 11)));
      // 長いタイトルはさらに1〜2px小さく（狭い/低いブロックでもなるべく全体を表示、最小8px）
      if(longTitle && tFont>8) tFont-=1;
      if(titleText.length>=22 && tFont>8) tFont-=1;
      const lineH = tFont*1.16;
      const availH = height - 2 - (timeShown ? (tFont+3) : 0);
      const clampLines = Math.max(1, Math.floor(availH/lineH));
      block.appendChild(div({style:{fontSize:tFont+"px",fontWeight:700,color:tcol,lineHeight:"1.16",wordBreak:"break-word",overflowWrap:"anywhere",overflow:"hidden",
        display:"-webkit-box",WebkitBoxOrient:"vertical",WebkitLineClamp:String(clampLines)}},titleText));
      if(timeShown)block.appendChild(div({style:{fontSize:"10px",color:tcol==="#ffffff"?"#ffffffcc":"#0a1120aa",lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},`${Math.floor(sMin/60)}:${String(sMin%60).padStart(2,'0')}〜${Math.floor(eMin/60)}:${String(eMin%60).padStart(2,'0')}`));
      // ドラッグで時間移動（単発の直接予定のみ・0時またぎ以外）
      const movable = onMove && ev.uid!=null && !ev.isRepeat && !ev.isPattern && !ev.customTodo && !ev._tail && !ev.allDay && !ev.endNextDay;
      if(movable){
        const durMin=Math.max(12, eMin-sMin);
        const origTopPx=Math.max(0,top);
        let pid=null, startClientY=0, curTopPx=origTopPx, dragging=false;
        block.style.touchAction="none";
        block.addEventListener('pointerdown',e=>{ pid=e.pointerId; startClientY=e.clientY; curTopPx=parseFloat(block.style.top)||origTopPx; dragging=false; try{block.setPointerCapture(pid);}catch(_){} e.stopPropagation(); });
        block.addEventListener('pointermove',e=>{ if(pid==null||e.pointerId!==pid)return; const dy=e.clientY-startClientY; if(Math.abs(dy)>4)dragging=true; if(dragging){ e.stopPropagation(); curTopPx=Math.max(0,Math.min((END_H-START_H)*HOUR_H-height, origTopPx+dy)); block.style.top=curTopPx+'px'; block.style.opacity="0.85"; block.style.zIndex="6"; } });
        const endDrag=e=>{ if(pid==null||(e&&e.pointerId!==pid))return; try{block.releasePointerCapture(pid);}catch(_){} pid=null; block.style.opacity=""; block.style.zIndex="3";
          if(dragging){ if(e)e.stopPropagation();
            let ns=Math.round(((curTopPx/HOUR_H)+START_H)*60/5)*5; // 5分刻み
            ns=Math.max(0,Math.min(1440-durMin, ns));
            onMove(ev, ns, durMin);
          } else if(onTap){ swallowClickUntil=Date.now()+700; setTimeout(()=>{swallowClickUntil=0;},750); onTap(ev); }
        };
        block.addEventListener('pointerup',endDrag);
        block.addEventListener('pointercancel',endDrag);
      } else if(onTap){ block.addEventListener('click',()=>onTap(ev)); }
      tl.appendChild(block);
    });
  };
  // 空き時間タップで作成（左半分=予定 / 右半分=実績）。ブロック(z3)の下(z1)に敷く
  const tapLayer=div({style:{position:"absolute",inset:"0",zIndex:1,cursor:"pointer"}});
  tapLayer.addEventListener('click',e=>{
    const rect=tapLayer.getBoundingClientRect();
    const y=e.clientY-rect.top, x=e.clientX-rect.left;
    const hour=Math.max(0,Math.min(23,Math.floor(y/HOUR_H)+START_H));
    if(x > rect.width*0.5) openActualEdit(vd,null,hour); else openAddEvent(vd,hour);
  });
  tl.appendChild(tapLayer);
  blockArea(events,"36px","50% - 40px",EV_COLORS[0],ev=>{
    if(ev._tail){ state.viewDate=addDays(vd,-1); render(); return; } // 前日の予定 → 前日へ移動して編集
    if(ev.customTodo){ state.planCustomTodo={uid:ev.ctUid,label:ev.ctLabel||ev.title,vd:ev.ctDate||vd}; state.modal="planCustomTodo"; render(); return; }
    if(ev.isPattern){ openPatternEdit(ev,vd); return; }
    state.modal="addEvent";state.editEventUid=ev.uid;state.editEventIsRepeat=!!ev.isRepeat;state.editEventDate=vd;state.eventEditMode=false;
    state.newEvDate=vd;state.newEvEndDate=ev.endDate||null;
    state.newEvTitle=ev.title;state.newEvH=ev.startH;state.newEvM=ev.startM;
    state.newEvEndH=ev.endH;state.newEvEndM=ev.endM;
    state.newEvRepeat=ev.isRepeat?ev.repeatType:"none";
    state.newEvColor=ev.color||EV_COLORS[0];
    state.newEvWeekdays=(ev.weekdays&&ev.weekdays.length)?[...ev.weekdays]:[parseDS(ev.startDate||vd).getDay()];
    state.newEvFromTask=ev.fromTask||null;
    state.newEvAllDay=!!ev.allDay;
    state.newEvPlace=ev.place||"";state.newEvNote=ev.note||"";state.newEvPreDays=ev.preDays||0;
    state.editScope="this";
    render();
  },(ev,newStartMin,durMin)=>{
    // ドラッグで時間移動：該当日の単発予定の開始/終了を更新（duration維持・5分刻み）
    const arr=state.schedule[vd]||[];
    const idx=arr.findIndex(x=>x.uid===ev.uid);
    if(idx<0)return;
    const endTotal=newStartMin+durMin;
    const sh=Math.floor(newStartMin/60), sm=newStartMin%60;
    const eh=Math.floor(endTotal/60), em=endTotal%60;
    arr[idx]={...arr[idx],startH:sh,startM:sm,endH:eh,endM:em,endNextDay:false};
    saveSchedule(); render();
    showToast(`⏰ ${sh}:${String(sm).padStart(2,'0')}〜 に移動`);
  });
  blockArea(actuals,"50% + 2px","50% - 6px","#22c55e",(ev)=>{ if(ev._tail){ state.viewDate=addDays(vd,-1); render(); return; } if(ev.manualUid) openActualEdit(vd, ev.manualUid); });

  tlCard.appendChild(tl);
  wrap.appendChild(tlCard);

  // 非表示にした予定を戻す（パターンの「この日は非表示」／繰り返し予定の除外／定期ルーティンの除外）— 一番下に表示
  {
    const hiddenItems=[];
    // パターン予定：所有日(vd-2..vd)で hidden 指定のもの
    for(let off=-2; off<=0; off++){
      const D=addDays(vd,off);
      const pov=getDaily(D).patternOv||{};
      (state.planPatterns||[]).forEach(p=>{ if(pov[p.uid]&&pov[p.uid].hidden){ hiddenItems.push({label:(p.title||"予定")+(off!==0?"（前日分）":""), restore:()=>{ const d=getDaily(D); const ov={...(d.patternOv||{})}; delete ov[p.uid]; setDaily(D,{patternOv:ov}); showToast("予定を戻しました"); render(); }}); } });
    }
    // 繰り返し予定：この日を例外（この予定のみ削除）にしたもの
    (state.repeatEvents||[]).forEach(e=>{ if((e.exceptions||[]).includes(vd) && repeatMatches({...e,exceptions:[]}, vd)){ hiddenItems.push({label:"🔁 "+(e.title||"予定"), restore:()=>{ e.exceptions=(e.exceptions||[]).filter(x=>x!==vd); saveRepeatEvents(); showToast("予定を戻しました"); render(); }}); } });
    // 定期ルーティン：この日を除外したもの（別の日へ移動した回=movedToは「非表示」ではないので除く）
    (state.customTodos||[]).forEach(ct=>{ const rec=(state.todos[vd]||{})[ct.uid]; if(rec&&rec.excluded&&!rec.movedTo && customTodoDue(ct,vd)){ hiddenItems.push({label:"🔁 "+(ct.label||"定期ルーティン"), restore:()=>{ const cur=(state.todos[vd]||{})[ct.uid]||{}; setTodo(vd,ct.uid,{...cur,excluded:false}); showToast("予定を戻しました"); render(); }}); } });
    if(hiddenItems.length){
      const hc=div({className:"card",style:{padding:"8px 10px",marginTop:"8px",border:"1px solid #33415577"}});
      hc.appendChild(div({style:{fontSize:"10px",fontWeight:700,color:"#94a3b8",marginBottom:"6px"}},`🙈 非表示にした予定（${hiddenItems.length}）`));
      hiddenItems.forEach(it=>{
        const row=div({style:{display:"flex",alignItems:"center",gap:"8px",padding:"4px 2px"}});
        row.appendChild(div({style:{flex:1,fontSize:"12px",color:"#64748b",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},it.label));
        const rb=btn({style:{flexShrink:0,fontSize:"11px",padding:"3px 10px",borderRadius:"7px",cursor:"pointer",fontWeight:600,border:"1px solid #38bdf8",background:"#0ea5e918",color:"#38bdf8"}},"↩ 戻す");
        rb.addEventListener('click',it.restore);
        row.appendChild(rb);
        hc.appendChild(row);
      });
      wrap.appendChild(hc);
    }
  }

  attachScheduleGestures(wrap, tl);
  return wrap;
}

// 予定タブ「日」のジェスチャー：単一指の左右スワイプで前後日、2本指ピンチで1時間の高さ調整
function attachScheduleGestures(dayWrap, tl){
  let sx=0,sy=0,st=0,singleActive=false,multi=false;
  let pStartDist=0,pStartH=0,pinching=false,pinchF=1;
  const D=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  // 単一指スワイプ（前後日）
  dayWrap.addEventListener('touchstart',e=>{
    if(e.touches.length>1){ multi=true; singleActive=false; return; }
    multi=false; const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); singleActive=true;
  },{passive:true});
  dayWrap.addEventListener('touchend',e=>{
    if(singleActive && !multi && !pinching && e.changedTouches.length){
      const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6 && (Date.now()-st)<700){
        singleActive=false;
        if(dx>0) prevDate(); else nextDate();
        return;
      }
    }
    singleActive=false;
  },{passive:true});
  // 2本指ピンチ（1時間の高さ）— タイムライン上で
  if(tl){
    tl.addEventListener('touchstart',e=>{
      if(e.touches.length===2){ pinching=true; multi=true; pStartDist=D(e.touches)||1; pStartH=state.scheduleHourH||56; pinchF=1; tl.style.transformOrigin='top center'; }
    },{passive:false});
    tl.addEventListener('touchmove',e=>{
      if(pinching && e.touches.length===2){
        e.preventDefault();
        const raw=D(e.touches)/pStartDist;
        pinchF=Math.max(30/pStartH, Math.min(150/pStartH, raw));
        tl.style.transform=`scaleY(${pinchF.toFixed(3)})`;
      }
    },{passive:false});
    tl.addEventListener('touchend',e=>{
      if(pinching && e.touches.length<2){
        pinching=false;
        tl.style.transform=''; tl.style.transformOrigin='';
        const nh=Math.round(Math.max(30,Math.min(150,pStartH*pinchF)));
        if(nh!==state.scheduleHourH){
          state.scheduleHourH=nh;
          try{localStorage.setItem(STORAGE_KEY+"_hourh",String(nh));}catch{}
        }
        render();
      }
    },{passive:true});
  }
}

// ── 週カレンダー ──
function renderWeekCalendar(vd,ds){
  const wrap=div({});
  // vdの週（月曜始まり）
  const base=parseDS(vd);
  const mondayOff=(base.getDay()+6)%7;
  const monday=new Date(base);monday.setDate(monday.getDate()-mondayOff);

  wrap.appendChild(div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}},[
    btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#94a3b8",cursor:"pointer",fontSize:"14px",padding:"2px 10px"},
      onClick:()=>{const n=new Date(parseDS(state.viewDate));n.setDate(n.getDate()-7);state.viewDate=fmtDS(n);render();}},"‹"),
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0"}},
      `${monday.getMonth()+1}/${monday.getDate()} 〜 の週`),
    btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#94a3b8",cursor:"pointer",fontSize:"14px",padding:"2px 10px"},
      onClick:()=>{const n=new Date(parseDS(state.viewDate));n.setDate(n.getDate()+7);state.viewDate=fmtDS(n);render();}},"›")
  ]));

  // シフト操作バー（入れ替えモード）
  const shiftOn=state.shiftPattern&&state.shiftPattern.enabled;
  wrap.appendChild(div({style:{display:"flex",gap:"6px",alignItems:"center",marginBottom:"8px"}},[
    div({style:{flex:1,fontSize:"10px",color:"#64748b"}},
      state.swapMode?(state.swapFirst?"入れ替える2日目をタップ":"入れ替える1日目をタップ"):"シフトバッジをタップで 1直→2直→休み1→休み2→自動 を切替"),
    btn({style:{fontSize:"11px",padding:"5px 12px",borderRadius:"7px",cursor:"pointer",fontWeight:600,
      border:`1px solid ${state.swapMode?"#f59e0b":"#334155"}`,background:state.swapMode?"#f59e0b22":"transparent",color:state.swapMode?"#f59e0b":"#94a3b8"},
      onClick:()=>{state.swapMode=!state.swapMode;state.swapFirst=null;render();}},state.swapMode?"入れ替え中…やめる":"🔄 2日を入れ替え")
  ]));

  const cycleDayShift=(dsK)=>{
    const ov=getDaily(dsK).planShift; // 予定上書きの有無
    if(ov==null){ setDayShift(dsK,"s1"); }
    else if(ov==="s1"){ setDayShift(dsK,"s2"); }
    else if(ov==="s2"){ setDayShift(dsK,"off"); }
    else if(ov==="off"){ setDayShift(dsK,"off2"); }
    else { setDayShift(dsK,null); }
    render();
  };
  const doSwap=(a,b)=>{ const ka=currentShiftKey(a)||"off", kb=currentShiftKey(b)||"off"; setDayShift(a,kb); setDayShift(b,ka); };
  const onDayTap=(dsK)=>{
    if(state.swapMode){
      if(!state.swapFirst){ state.swapFirst=dsK; }
      else if(state.swapFirst===dsK){ state.swapFirst=null; }
      else { doSwap(state.swapFirst,dsK); state.swapFirst=null; showToast("🔄 シフトを入れ替えました"); }
      render();
    } else { state.viewDate=dsK;state.scheduleSubTab="日";render(); }
  };

  const card=div({className:"card",style:{padding:"8px"}});
  const grid=div({style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"}});
  const DAY_LBL=["月","火","水","木","金","土","日"];
  for(let i=0;i<7;i++){
    const d2=new Date(monday);d2.setDate(d2.getDate()+i);
    const dsK=fmtDS(d2);
    const isT=dsK===todayStr();
    const isSel=state.swapMode&&state.swapFirst===dsK;
    const evs=getEventsForDate(dsK);
    const col=div({style:{minHeight:"120px",background:isSel?"#f59e0b22":"#0f172a",borderRadius:"6px",padding:"4px 3px",border:`1px solid ${isSel?"#f59e0b":isT?"#38bdf8":"#1e3a5f"}`,cursor:"pointer",overflow:"hidden"}});
    col.appendChild(div({style:{textAlign:"center",fontSize:"9px",color:isT?"#38bdf8":"#64748b",fontWeight:isT?700:400,marginBottom:"3px"}},`${DAY_LBL[i]} ${d2.getDate()}`));
    // シフトバッジ（予定シフト）
    const sk=currentShiftKey(dsK);
    if(shiftOn||sk){
      const isOverride=getDaily(dsK).planShift!=null;
      const sh=sk?SHIFT_TYPES[sk]:null;
      const badge=div({style:{textAlign:"center",fontSize:"9px",fontWeight:700,marginBottom:"3px",padding:"2px 0",borderRadius:"4px",cursor:"pointer",
        color:sh?sh.color:"#475569",background:sh?sh.color+"22":"transparent",border:`1px solid ${sh?sh.color+"55":"#1e3a5f"}`,
        opacity:isOverride?1:0.7}},(sh?sh.label:"—")+(isOverride?"":"˚"));
      badge.addEventListener('click',(()=>{const k=dsK;return e=>{e.stopPropagation(); if(state.swapMode)onDayTap(k); else cycleDayShift(k);};})());
      col.appendChild(badge);
    }
    evs.slice(0,5).forEach(ev=>{
      const c=ev.color||EV_COLORS[0];
      col.appendChild(div({style:{fontSize:"8px",color:c,background:c+"22",borderLeft:`2px solid ${c}`,borderRadius:"3px",padding:"1px 3px",marginBottom:"2px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},
        `${ev.allDay?"終日":`${String(ev.startH).padStart(2,'0')}:${String(ev.startM).padStart(2,'0')}`} ${ev.title}`));
    });
    if(evs.length>5)col.appendChild(div({style:{fontSize:"8px",color:"#475569",textAlign:"center"}},`+${evs.length-5}`));
    col.addEventListener('click',(()=>{const k=dsK;return()=>onDayTap(k);})());
    grid.appendChild(col);
  }
  card.appendChild(grid);
  wrap.appendChild(card);
  wrap.appendChild(div({style:{textAlign:"center",fontSize:"10px",color:"#475569",marginTop:"6px"}},
    state.swapMode?"入れ替えたい2日をタップ":"日をタップで日表示へ／シフトは「˚」が自動、無印が手動"));
  return wrap;
}

// ── 月カレンダー ──
function renderMonthCalendar(vd,ds){
  const wrap=div({});
  const base=parseDS(vd);
  const y=base.getFullYear(),m=base.getMonth()+1;

  wrap.appendChild(div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}},[
    btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#94a3b8",cursor:"pointer",fontSize:"14px",padding:"2px 10px"},
      onClick:()=>{const n=new Date(y,m-2,1);state.viewDate=fmtDS(n);render();}},"‹"),
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0"}},`${y}年${m}月`),
    btn({style:{background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#94a3b8",cursor:"pointer",fontSize:"14px",padding:"2px 10px"},
      onClick:()=>{const n=new Date(y,m,1);state.viewDate=fmtDS(n);render();}},"›")
  ]));

  const card=div({className:"card",style:{padding:"8px"}});
  card.appendChild(div({style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px",marginBottom:"3px"}},
    ["月","火","水","木","金","土","日"].map(w=>div({style:{textAlign:"center",fontSize:"9px",color:"#475569"}},w))));

  const firstDay=new Date(y,m-1,1);
  const daysInMonth=new Date(y,m,0).getDate();
  const startBlank=(firstDay.getDay()+6)%7;
  const grid=div({style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"}});
  for(let i=0;i<startBlank;i++)grid.appendChild(div({},""));
  const todayD2=todayStr();
  for(let day=1;day<=daysInMonth;day++){
    const dsK=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const evs=getEventsForDate(dsK);
    const isT=dsK===todayD2;
    const cell=div({style:{minHeight:"52px",borderRadius:"6px",padding:"3px",
      background:"#0f172a",border:`1px solid ${isT?"#38bdf8":"#1e3a5f"}`,cursor:"pointer",overflow:"hidden"}});
    cell.appendChild(div({style:{fontSize:"9px",color:isT?"#38bdf8":"#64748b",fontWeight:isT?700:400,marginBottom:"2px"}},String(day)));
    evs.slice(0,3).forEach(ev=>{
      const c=ev.color||EV_COLORS[0];
      cell.appendChild(div({style:{fontSize:"7px",color:c,background:c+"22",borderRadius:"2px",padding:"0 2px",marginBottom:"1px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},ev.title));
    });
    if(evs.length>3)cell.appendChild(div({style:{fontSize:"7px",color:"#475569"}},`+${evs.length-3}`));
    cell.addEventListener('click',(()=>{const k=dsK;return()=>{state.viewDate=k;state.scheduleSubTab="日";render();};})());
    grid.appendChild(cell);
  }
  card.appendChild(grid);
  wrap.appendChild(card);
  wrap.appendChild(div({style:{textAlign:"center",fontSize:"10px",color:"#475569",marginTop:"6px"}},"日をタップで日表示へ"));
  return wrap;
}

// ── やることリスト（重要度×緊急度マトリクス） ──
function renderTaskMatrix(){
  const wrap=div({});
  const list=state.tasks.todo||[];
  const card=div({className:"card"});
  card.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"2px"}},"✅ TODO"));
  card.appendChild(div({style:{fontSize:"10px",color:"#475569",marginBottom:"10px"}},"重要・緊急で優先順位付け／期日設定・「予定に追加」で作業をスケジュール化"));

  const inputRow=div({style:{display:"flex",gap:"6px",marginBottom:"8px"}});
  const inp=document.createElement('input');
  inp.type='text';inp.placeholder="やることを追加...";inp.value=state.newTodoText||"";
  inp.style.cssText="flex:1;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:13px;font-family:inherit";
  inp.addEventListener('input',e=>{state.newTodoText=e.target.value;});
  const addFn=()=>{
    const v=(state.newTodoText||"").trim();if(!v)return;
    state.tasks.todo=[...(state.tasks.todo||[]),{uid:Date.now(),text:v,done:false,imp:!!state.newTodoImp,urg:!!state.newTodoUrg}];
    state.newTodoText="";state.newTodoImp=false;state.newTodoUrg=false;
    saveTasks();render();
  };
  inp.addEventListener('keydown',e=>{if(e.key==="Enter")addFn();});
  const addBtn=btn({style:{padding:"8px 16px",background:"#0ea5e918",border:"1px solid #0ea5e9",borderRadius:"8px",color:"#38bdf8",fontSize:"13px",fontWeight:600,cursor:"pointer"}},"＋");
  addBtn.addEventListener('click',addFn);
  inputRow.appendChild(inp);inputRow.appendChild(addBtn);
  card.appendChild(inputRow);
  // 作成時に重要・緊急フラグを指定
  const flagRow=div({style:{display:"flex",gap:"6px",marginBottom:"10px"}});
  const mkFlag=(on,label,col,key)=>{const b=btn({style:{fontSize:"11px",padding:"5px 12px",borderRadius:"20px",cursor:"pointer",fontWeight:600,border:`1px solid ${on?col:"#334155"}`,background:on?col+"22":"transparent",color:on?col:"#64748b"}},label);b.addEventListener('click',()=>{state[key]=!state[key];render();});return b;};
  flagRow.appendChild(mkFlag(!!state.newTodoImp,"⭐ 重要","#f97316","newTodoImp"));
  flagRow.appendChild(mkFlag(!!state.newTodoUrg,"⚡ 緊急","#eab308","newTodoUrg"));
  card.appendChild(flagRow);

  // 優先度ソート：重×急 → 重 → 急 → なし → 完了、同順位は期日の早い順
  const prio=t=>t.done?4:(t.imp&&t.urg)?0:t.urg?1:t.imp?2:3;
  const prioColor=t=>(t.imp&&t.urg)?"#ef4444":t.imp?"#f97316":t.urg?"#eab308":"#334155";
  const prioLabel=t=>(t.imp&&t.urg)?"最優先":t.imp?"重要":t.urg?"緊急":"";
  const dueVal=t=>t.due?parseDS(t.due).getTime():Infinity;
  const sorted=[...list].sort((a,b)=>prio(a)-prio(b)||dueVal(a)-dueVal(b));
  const updateTask=(uid,upd)=>{state.tasks.todo=state.tasks.todo.map(x=>x.uid===uid?{...x,...upd}:x);saveTasks();render();};
  const dueBadge=item=>{
    const dd=parseDS(item.due), td=parseDS(todayStr());
    const days=Math.round((dd-td)/86400000);
    let color,label;
    if(days<0){color="#ef4444";label=`期日超過${-days}日`;}
    else if(days===0){color="#f97316";label="今日が期日";}
    else if(days<=2){color="#eab308";label=`あと${days}日`;}
    else {color="#38bdf8";label=`${dd.getMonth()+1}/${dd.getDate()}まで`;}
    return div({style:{fontSize:"9px",color,fontWeight:700,marginTop:"2px"}},`📅 ${label}`);
  };
  // タスクから追加された予定（単発は日時、繰り返しは次回日時＋🔁）を集める
  const md=mdLabel, hm=hhmm; // 時刻は他画面と揃えて時も0埋め
  const nextRepeatDate=rep=>{let ds=todayStr();for(let i=0;i<400;i++){if(repeatMatches(rep,ds))return ds;ds=addDays(ds,1);}return rep.startDate;};
  const scheduledBadges=item=>{
    const out=[];
    Object.keys(state.schedule||{}).forEach(ds=>{(state.schedule[ds]||[]).forEach(e=>{if(e.fromTask===item.uid)out.push({k:ds+String(e.startH).padStart(2,'0')+String(e.startM).padStart(2,'0'),text:`📅 ${md(ds)} ${hm(e.startH,e.startM)}`,repeat:false});});});
    (state.repeatEvents||[]).filter(e=>e.fromTask===item.uid).forEach(rep=>{
      const nd=nextRepeatDate(rep);
      out.push({k:'z'+nd,text:`🔁 繰り返し 次:${md(nd)} ${hm(rep.startH,rep.startM)}`,repeat:true});
    });
    out.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0);
    return out;
  };

  if(sorted.length===0){
    card.appendChild(div({style:{textAlign:"center",fontSize:"11px",color:"#475569",padding:"12px 0"}},"まだありません"));
  }
  sorted.forEach(item=>{
    const pc=prioColor(item);
    const isHi=state.highlightTodo===item.uid; // TODO由来の予定を実績化して移動してきたとき強調
    const box=div({style:{padding:"8px 10px",background:isHi?"#38bdf81f":"#0f172a",borderRadius:"8px",marginBottom:"4px",borderLeft:`3px solid ${item.done?"#334155":pc}`,opacity:item.done?"0.5":"1",...(isHi?{outline:"2px solid #38bdf8",outlineOffset:"1px"}:{})}});
    if(isHi) setTimeout(()=>{try{box.scrollIntoView({block:"center",behavior:"smooth"});}catch(_){}},60);
    // 1行目：チェック＋テキスト＋削除
    const row1=div({style:{display:"flex",alignItems:"center",gap:"8px"}});
    const cb=btn({style:{width:"22px",height:"22px",borderRadius:"6px",flexShrink:0,
      border:`2px solid ${item.done?"#22c55e":"#334155"}`,background:item.done?"#22c55e":"transparent",
      cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px"}},item.done?"✓":"");
    cb.addEventListener('click',(()=>{const uid=item.uid;return()=>updateTask(uid,{done:!item.done});})());
    row1.appendChild(cb);
    const label=div({style:{flex:1,minWidth:0}});
    if(state.editingTaskUid===item.uid){
      const ei=document.createElement('input');
      ei.type='text'; ei.value=item.text;
      ei.style.cssText="width:100%;padding:5px 8px;background:#1e293b;border:1px solid #38bdf8;border-radius:6px;color:#e2e8f0;font-size:13px;font-family:inherit;box-sizing:border-box";
      const commit=()=>{const v=ei.value.trim(); state.editingTaskUid=null; if(v&&v!==item.text)updateTask(item.uid,{text:v}); else render();};
      ei.addEventListener('keydown',e=>{if(e.key==="Enter"){e.preventDefault();ei.blur();}});
      ei.addEventListener('blur',commit);
      label.appendChild(ei);
      setTimeout(()=>{try{ei.focus();ei.select();}catch(_){}} ,0);
    } else {
      const tx=div({style:{fontSize:"13px",color:item.done?"#64748b":"#e2e8f0",textDecoration:item.done?"line-through":"none",cursor:"text",wordBreak:"break-word"}},item.text);
      tx.addEventListener('click',(()=>{const uid=item.uid;return()=>{state.editingTaskUid=uid;render();};})());
      label.appendChild(tx);
    }
    if(prioLabel(item)&&!item.done)label.appendChild(div({style:{fontSize:"9px",color:pc,fontWeight:700}},prioLabel(item)));
    if(item.due&&!item.done)label.appendChild(dueBadge(item));
    scheduledBadges(item).forEach(b=>label.appendChild(div({style:{fontSize:"9px",color:b.repeat?"#a78bfa":"#38bdf8",fontWeight:600,marginTop:"2px"}},b.text)));
    row1.appendChild(label);
    const del=btn({style:{background:"transparent",border:"none",color:"#334155",cursor:"pointer",fontSize:"15px",padding:"0 2px",flexShrink:0}},"×");
    del.addEventListener('click',(()=>{const uid=item.uid;return()=>{pushUndo("TODOを削除しました");state.tasks.todo=state.tasks.todo.filter(x=>x.uid!==uid);saveTasks();render();};})());
    row1.appendChild(del);
    box.appendChild(row1);
    // 2行目：重要・緊急・期日・予定に追加
    const row2=div({style:{display:"flex",alignItems:"center",gap:"6px",marginTop:"8px",flexWrap:"wrap"}});
    const impB=btn({style:{fontSize:"10px",padding:"3px 8px",borderRadius:"6px",cursor:"pointer",whiteSpace:"nowrap",
      border:`1px solid ${item.imp?"#f97316":"#334155"}`,background:item.imp?"#f9731622":"transparent",color:item.imp?"#f97316":"#475569"}},"重要");
    impB.addEventListener('click',(()=>{const uid=item.uid;return()=>updateTask(uid,{imp:!item.imp});})());
    row2.appendChild(impB);
    const urgB=btn({style:{fontSize:"10px",padding:"3px 8px",borderRadius:"6px",cursor:"pointer",whiteSpace:"nowrap",
      border:`1px solid ${item.urg?"#eab308":"#334155"}`,background:item.urg?"#eab30822":"transparent",color:item.urg?"#eab308":"#475569"}},"緊急");
    urgB.addEventListener('click',(()=>{const uid=item.uid;return()=>updateTask(uid,{urg:!item.urg});})());
    row2.appendChild(urgB);
    // 期日
    const dueInp=document.createElement('input');dueInp.type='date';dueInp.value=item.due||"";
    dueInp.style.cssText="padding:3px 6px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:11px;font-family:inherit;color-scheme:dark";
    dueInp.addEventListener('change',(()=>{const uid=item.uid;return e=>updateTask(uid,{due:e.target.value||null});})());
    row2.appendChild(div({style:{display:"flex",alignItems:"center",gap:"3px"}},[span({style:{fontSize:"10px",color:"#64748b"}},"期日"),dueInp]));
    // 予定に追加（作業予定をスケジュールへ）
    const planB=btn({style:{fontSize:"10px",padding:"3px 8px",borderRadius:"6px",cursor:"pointer",whiteSpace:"nowrap",marginLeft:"auto",
      border:"1px solid #0ea5e9",background:"#0ea5e918",color:"#38bdf8",fontWeight:600}},"📅 予定に追加");
    planB.addEventListener('click',(()=>{const it=item;return()=>{
      const now=new Date();
      const target=it.due||state.viewDate;
      state.viewDate=target;
      state.modal="addEvent";state.editEventUid=null;state.editEventIsRepeat=false;state.editEventDate=target;
      state.newEvDate=target;state.newEvEndDate=null;
      state.newEvTitle=it.text;
      state.newEvH=now.getHours();state.newEvM=0;
      state.newEvEndH=Math.min(23,now.getHours()+1);state.newEvEndM=0;
      state.newEvRepeat="none";state.newEvColor=EV_COLORS[0];
      state.newEvWeekdays=[parseDS(target).getDay()];
      state.newEvFromTask=it.uid;
      state.newEvPlace="";state.newEvNote=(it.note||"");
      state.scheduleSubTab="日";
      render();
    };})());
    row2.appendChild(planB);
    box.appendChild(row2);
    // メモ（開閉トグル。メモがあれば常時表示）
    const hasNote=!!(item.note&&item.note.trim());
    const memoOpen=!!(state.taskMemoOpen&&state.taskMemoOpen[item.uid]);
    const memoB=btn({style:{fontSize:"10px",padding:"3px 8px",borderRadius:"6px",cursor:"pointer",whiteSpace:"nowrap",marginTop:"6px",
      border:`1px solid ${hasNote?"#a78bfa":"#334155"}`,background:hasNote?"#a78bfa18":"transparent",color:hasNote?"#a78bfa":"#475569"}},hasNote?"📝 メモを編集":(memoOpen?"📝 メモを閉じる":"📝 メモを追加"));
    memoB.addEventListener('click',(()=>{const uid=item.uid;return()=>{ if(!state.taskMemoOpen)state.taskMemoOpen={}; state.taskMemoOpen[uid]=!state.taskMemoOpen[uid]; render(); };})());
    box.appendChild(memoB);
    if(hasNote||memoOpen){
      const ta=document.createElement('textarea');
      ta.value=item.note||""; ta.placeholder="メモ...";
      ta.style.cssText="width:100%;margin-top:6px;min-height:44px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#cbd5e1;font-size:12px;padding:7px;resize:vertical;box-sizing:border-box;font-family:inherit;line-height:1.5";
      ta.addEventListener('change',(()=>{const uid=item.uid;return e=>updateTask(uid,{note:e.target.value});})());
      ta.addEventListener('blur',(()=>{const uid=item.uid;return e=>updateTask(uid,{note:e.target.value});})());
      box.appendChild(ta);
    }
    card.appendChild(box);
  });

  if(list.some(x=>x.done)){
    const clearBtn=btn({style:{width:"100%",marginTop:"6px",padding:"6px",background:"transparent",border:"1px solid #334155",borderRadius:"8px",color:"#475569",fontSize:"11px",cursor:"pointer"}},"完了済みをまとめて削除");
    clearBtn.addEventListener('click',()=>{
      pushUndo("完了済みTODOを削除しました");
      state.tasks.todo=state.tasks.todo.filter(x=>!x.done);
      saveTasks();render();
    });
    card.appendChild(clearBtn);
  }
  wrap.appendChild(card);
  return wrap;
}

// ── 汎用リスト（買物） ──
function renderTaskList(key,title,subtitle){
  const wrap=div({});
  const list=state.tasks[key]||[];
  const card=div({className:"card"});
  card.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"2px"}},title));
  card.appendChild(div({style:{fontSize:"10px",color:"#475569",marginBottom:"10px"}},subtitle));
  const inputRow=div({style:{display:"flex",gap:"6px",marginBottom:"10px"}});
  const inp=document.createElement('input');
  inp.type='text';inp.placeholder="追加...";
  inp.style.cssText="flex:1;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:13px;font-family:inherit";
  const addFn=()=>{
    const v=inp.value.trim();if(!v)return;
    state.tasks[key]=[...(state.tasks[key]||[]),{uid:Date.now(),text:v,done:false}];
    saveTasks();inp.value="";render();
  };
  inp.addEventListener('keydown',e=>{if(e.key==="Enter")addFn();});
  const addBtn=btn({style:{padding:"8px 16px",background:"#0ea5e918",border:"1px solid #0ea5e9",borderRadius:"8px",color:"#38bdf8",fontSize:"13px",fontWeight:600,cursor:"pointer"}},"＋");
  addBtn.addEventListener('click',addFn);
  inputRow.appendChild(inp);inputRow.appendChild(addBtn);
  card.appendChild(inputRow);
  const sorted=[...list].sort((a,b)=>(a.done?1:0)-(b.done?1:0));
  if(sorted.length===0){
    card.appendChild(div({style:{textAlign:"center",fontSize:"11px",color:"#475569",padding:"12px 0"}},"まだありません"));
  }
  sorted.forEach(item=>{
    const row=div({style:{display:"flex",alignItems:"center",gap:"10px",padding:"8px 10px",background:"#0f172a",borderRadius:"8px",marginBottom:"4px",opacity:item.done?"0.5":"1"}});
    const cb=btn({style:{width:"22px",height:"22px",borderRadius:"6px",flexShrink:0,
      border:`2px solid ${item.done?"#22c55e":"#334155"}`,background:item.done?"#22c55e":"transparent",
      cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px"}},item.done?"✓":"");
    cb.addEventListener('click',(()=>{const uid=item.uid;return()=>{
      state.tasks[key]=state.tasks[key].map(x=>x.uid===uid?{...x,done:!x.done}:x);
      saveTasks();render();
    };})());
    row.appendChild(cb);
    row.appendChild(div({style:{flex:1,fontSize:"13px",color:item.done?"#64748b":"#e2e8f0",textDecoration:item.done?"line-through":"none"}},item.text));
    const del=btn({style:{background:"transparent",border:"none",color:"#334155",cursor:"pointer",fontSize:"15px",padding:"0 4px"}},"×");
    del.addEventListener('click',(()=>{const uid=item.uid;return()=>{
      pushUndo("項目を削除しました");
      state.tasks[key]=state.tasks[key].filter(x=>x.uid!==uid);
      saveTasks();render();
    };})());
    row.appendChild(del);
    card.appendChild(row);
  });
  if(list.some(x=>x.done)){
    const clearBtn=btn({style:{width:"100%",marginTop:"6px",padding:"6px",background:"transparent",border:"1px solid #334155",borderRadius:"8px",color:"#475569",fontSize:"11px",cursor:"pointer"}},"完了済みをまとめて削除");
    clearBtn.addEventListener('click',()=>{
      pushUndo("完了済みを削除しました");
      state.tasks[key]=state.tasks[key].filter(x=>!x.done);
      saveTasks();render();
    });
    card.appendChild(clearBtn);
  }
  wrap.appendChild(card);
  return wrap;
}

// ── 予定追加・編集モーダル ──
function renderAddEventModal(vd){
  const isEdit=state.editEventUid!=null;
  const isRepEdit=isEdit&&state.editEventIsRepeat;
  const bg=div({className:"modal-center"});

  let downOnBg=false;

  // ── 情報表示モード（既存予定を開いたら、まず情報だけ表示。右上の編集で編集へ）──
  if(isEdit && !state.eventEditMode){
    const c=state.newEvColor||"#38bdf8";
    const startD=state.newEvDate||vd;
    const dateStr=(state.newEvEndDate&&state.newEvEndDate>startD)?`${startD} 〜 ${state.newEvEndDate}`:startD;
    const timeStr=state.newEvAllDay?"終日":`${hhmm(state.newEvH,state.newEvM)}〜${hhmm(state.newEvEndH,state.newEvEndM)}${state.newEvEndNextDay?"（翌日）":""}`;
    // ヘッダー（タイトル＋右上に編集ボタン）
    m.appendChild(div({style:{display:"flex",alignItems:"flex-start",gap:"8px",marginBottom:"12px"}},[
      div({style:{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:"7px"}},[
        span({style:{width:"12px",height:"12px",borderRadius:"3px",background:c,flexShrink:0,display:"inline-block"}}),
        div({style:{fontSize:"17px",fontWeight:700,color:"#e2e8f0",wordBreak:"break-word"}},(isRepEdit?"🔁 ":"")+(state.newEvTitle||"(無題)"))

      btn({style:{flexShrink:0,padding:"6px 12px",borderRadius:"8px",border:"1px solid #38bdf8",background:"#0ea5e918",color:"#38bdf8",fontSize:"12px",fontWeight:700,cursor:"pointer"},
        onClick:()=>{state.eventEditMode=true;render();}},"✏️ 編集")

        state.actEH=state.newEvAllDay?((nowH+1)%24):state.newEvEndH; state.actEM=state.newEvAllDay?0:state.newEvEndM;
        state.actEndNextDay=!!state.newEvEndNextDay; state.actStartNextDay=!!state.newEvStartNextDay;
        state.actColor=state.newEvColor||"#f472b6"; state.actUnplanned=false;
        state.actFromEventUid=state.editEventUid; state.actFromTask=state.newEvFromTask||null; state.actDate=vd; state.modal="addActual"; render();
      }},"✓ 実際に行った（実績に反映）"));
    // 情報行
    const infoRow=(label,val)=> val?div({style:{marginBottom:"11px"}},[
      div({style:{fontSize:"10px",color:"#64748b",marginBottom:"2px"}},label),
      div({style:{fontSize:"14px",color:"#e2e8f0",whiteSpace:"pre-wrap",wordBreak:"break-word",lineHeight:1.5}},val)
    ]):null;
    const addInfo=(l,v)=>{ const n=infoRow(l,v); if(n)m.appendChild(n); };

      pr.appendChild(div({style:{fontSize:"10px",color:"#64748b",marginBottom:"2px"}},"📍 場所"));
      pr.appendChild(div({style:{fontSize:"14px",color:"#e2e8f0",wordBreak:"break-word",marginBottom:"5px"}},state.newEvPlace));
      const mb=btn({style:{padding:"6px 12px",borderRadius:"8px",cursor:"pointer",fontSize:"12px",fontWeight:600,border:"1px solid #22c55e55",background:"#22c55e14",color:"#4ade80"}},"🗺️ Googleマップで開く");
      mb.addEventListener('click',()=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(state.newEvPlace.trim())}`,'_blank','noopener'); });
      pr.appendChild(mb);
      m.appendChild(pr);
    }
    addInfo("📝 詳細", (state.newEvNote||"").trim()||null);
    if(state.newEvRepeat && state.newEvRepeat!=="none") addInfo("🔁 繰り返し", repeatLabel(state.newEvRepeat, startD)||null);

  m.appendChild(div({style:{fontSize:"15px",fontWeight:700,color:"#e2e8f0",marginBottom:"14px"}},isEdit?"📅 予定を編集":"📅 予定を追加"));

  inp.type='text';inp.placeholder="予定のタイトル";inp.value=state.newEvTitle;
  inp.style.cssText="width:100%;padding:9px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:12px";
  inp.addEventListener('input',e=>{state.newEvTitle=e.target.value;});
  m.appendChild(inp);

  // 日付選択（TODOからの追加や、別の日への登録に対応。繰り返し編集時は非表示）
  const startDateForModal=state.newEvDate||vd;
  const isRepeatSel=state.newEvRepeat!=="none";
  const multiDay=!isRepEdit && !isRepeatSel && !!state.newEvEndDate && state.newEvEndDate>startDateForModal;
  if(!isRepEdit){
    m.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"5px"}},multiDay?"開始日":"日付"));
    const dInp=document.createElement('input');
    dInp.type='date'; dInp.value=startDateForModal;
    dInp.style.cssText="width:100%;padding:9px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:12px;color-scheme:dark";
    dInp.addEventListener('change',e=>{ if(e.target.value){ state.newEvDate=e.target.value; if(state.newEvEndDate&&state.newEvEndDate<e.target.value)state.newEvEndDate=null; render(); } });
    m.appendChild(dInp);
    // 終了日（複数日にわたる予定。繰り返しとは併用不可）
    if(!isRepeatSel){
      m.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"5px"}},"終了日（複数日にわたる予定・任意）"));
      const edRow=div({style:{display:"flex",gap:"6px",alignItems:"center",marginBottom:multiDay?"6px":"12px"}});
      const edInp=document.createElement('input');
      edInp.type='date'; edInp.value=state.newEvEndDate||""; edInp.min=startDateForModal;
      edInp.style.cssText="flex:1;min-width:0;padding:9px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;box-sizing:border-box;color-scheme:dark";
      edInp.addEventListener('change',e=>{ state.newEvEndDate=e.target.value||null; render(); });
      edRow.appendChild(edInp);
      if(state.newEvEndDate){
        const clr=btn({style:{padding:"9px 12px",borderRadius:"8px",border:"1px solid #334155",background:"transparent",color:"#64748b",cursor:"pointer",fontSize:"12px",flexShrink:0}},"クリア");
        clr.addEventListener('click',()=>{state.newEvEndDate=null;render();});

      }
      m.appendChild(edRow);
      if(multiDay){
        m.appendChild(div({style:{fontSize:"11px",color:"#7dd3fc",background:"#0ea5e912",border:"1px solid #0ea5e955",borderRadius:"8px",padding:"8px 10px",marginBottom:"12px",lineHeight:1.5}},
          `🗓 ${mdLabel(startDateForModal)}〜${mdLabel(state.newEvEndDate)}（${daySpanInclusive(startDateForModal,state.newEvEndDate)}日間）の予定として、各日に終日表示されます。`));
      }
    }
  }

  // 📋 この日の予定・空き時間（空いている日・時間帯を見ながら入れられるように）
  {
    const planDate = isRepEdit ? vd : (state.newEvDate||vd);
    const occ = dayOccupancy(planDate, state.editEventUid);
    const hh=mm=>`${String(Math.floor(mm/60)).padStart(2,'0')}:${String(mm%60).padStart(2,'0')}`;
    const dl=mdLabel(planDate);
    const sec=div({style:{marginBottom:"12px",background:"#0b1220",border:"1px solid #1e3a5f",borderRadius:"10px",padding:"10px 12px"}});
    sec.appendChild(div({style:{fontSize:"11px",fontWeight:700,color:"#7dd3fc",marginBottom:"6px"}},`📋 ${dl} の予定`));
    if(occ.allDay.length){
      sec.appendChild(div({style:{display:"flex",flexWrap:"wrap",gap:"4px",marginBottom:"6px"}},
        occ.allDay.map(a=>span({style:{fontSize:"10px",padding:"2px 8px",borderRadius:"20px",background:"#1e3a5f",color:"#cbd5e1"}},`🗓 ${a.title}`))));
    }
    if(!occ.timed.length && !occ.allDay.length){
      sec.appendChild(div({style:{fontSize:"11px",color:"#4ade80",padding:"2px 0"}},"予定なし（1日空いています）"));
    } else {
      sec.appendChild(div({style:{fontSize:"10px",color:"#64748b",marginBottom:"4px"}},"🟢 空き時間はタップで開始時刻にセット"));
      // 予定（占有）と空き時間を時間順に1つのリストで並べる
      const items=[
        ...occ.timed.map(t=>({kind:"busy",s:t.s,e:t.e,title:t.title,color:t.color})),
        ...occ.free.map(g=>({kind:"free",s:g.s,e:g.e}))
      ].sort((a,b)=>a.s-b.s||a.e-b.e);
      items.forEach(it=>{
        if(it.kind==="busy"){
          sec.appendChild(div({style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"11px",color:"#cbd5e1",padding:"3px 0"}},[
            span({style:{width:"8px",height:"8px",borderRadius:"50%",background:it.color,flexShrink:0,display:"inline-block"}}),
            span({style:{color:"#94a3b8",flexShrink:0}},`${hh(it.s)}〜${hh(it.e)}`),
            span({style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},it.title)
          ]));
        } else {

            span({style:{flexShrink:0}},"🟢"),
            span({style:{fontWeight:600,flexShrink:0}},`${hh(it.s)}〜${hh(it.e)}`),
            span({style:{color:"#4ade80bb"}},"空き（タップ）")

            let end=Math.min(e, s+60); if(end>=1440)end=1439;
            state.newEvEndH=Math.floor(end/60); state.newEvEndM=end%60; state.newEvEndNextDay=false;

          sec.appendChild(row);
        }

  placeInp.style.cssText="width:100%;padding:9px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:12px";

  mapBtn.addEventListener('click',()=>{ const q=(state.newEvPlace||"").trim(); if(!q){showToast("場所を入力してください");return;} window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank','noopener'); });

  m.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"5px"}},"📝 詳細"));
  const noteInp=document.createElement('textarea');
  noteInp.placeholder="メモ・持ち物・URLなど"; noteInp.value=state.newEvNote||"";
  noteInp.style.cssText="width:100%;min-height:56px;padding:9px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:12px;resize:vertical;line-height:1.5";
  noteInp.addEventListener('input',e=>{state.newEvNote=e.target.value;});
  m.appendChild(noteInp);

  m.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"5px"}},"🔔 事前表示（何日前から予定上部に表示するか・0でなし）"));
  {
    const preRow=div({style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"12px"}});
    const pin=document.createElement('input');pin.type='number';pin.min="0";pin.value=String(Math.max(0,parseInt(state.newEvPreDays)||0));
    pin.style.cssText="width:80px;padding:9px 10px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit";
    pin.addEventListener('input',e=>{state.newEvPreDays=Math.max(0,parseInt(e.target.value)||0);});
    preRow.appendChild(pin);
    preRow.appendChild(span({style:{fontSize:"12px",color:"#94a3b8"}},"日前から表示"));
    m.appendChild(preRow);
  }

  const mkT=(label,getH,getM,setH,setM)=>{
    const w2=div({style:{marginBottom:"12px"}});
    w2.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"5px"}},label));
    w2.appendChild(clockField(getH(),getM(),(H,M)=>{setH(H);setM(M);}));
    return w2;
  };
  // 終日（時間指定なし）トグル（複数日予定は常に終日扱いなので非表示）
  if(!multiDay){
  const adBtn=btn({style:{width:"100%",padding:"8px",marginBottom:"12px",borderRadius:"8px",cursor:"pointer",fontSize:"12px",fontWeight:600,
    border:`1px solid ${state.newEvAllDay?"#38bdf8":"#334155"}`,background:state.newEvAllDay?"#0ea5e922":"transparent",color:state.newEvAllDay?"#38bdf8":"#64748b"}},state.newEvAllDay?"🗓 終日（時間指定なし）: ON":"🗓 終日（時間指定なし）: OFF");
  adBtn.addEventListener('click',()=>{state.newEvAllDay=!state.newEvAllDay;render();});
  m.appendChild(adBtn);
  if(!state.newEvAllDay){
    m.appendChild(mkT("開始",()=>state.newEvH,()=>state.newEvM,v=>{state.newEvH=v;},v=>{state.newEvM=v;}));
    m.appendChild(mkT("終了",()=>state.newEvEndH,()=>state.newEvEndM,v=>{state.newEvEndH=v;},v=>{state.newEvEndM=v;}));
    const ndB=btn({style:{width:"100%",padding:"8px",borderRadius:"8px",cursor:"pointer",fontWeight:600,fontSize:"12px",marginBottom:"6px",
      border:`1px solid ${state.newEvEndNextDay?"#38bdf8":"#334155"}`,background:state.newEvEndNextDay?"#0ea5e922":"transparent",color:state.newEvEndNextDay?"#38bdf8":"#64748b"}},state.newEvEndNextDay?"🌙 終了は翌日: ON":"🌙 終了は翌日: OFF");
    ndB.addEventListener('click',()=>{state.newEvEndNextDay=!state.newEvEndNextDay;render();});
    m.appendChild(ndB);
    m.appendChild(div({style:{fontSize:"10px",color:"#475569",marginBottom:"12px"}},"終了が開始より前、または「終了は翌日」ONで日をまたぐ予定になります"));
  }
  }

  // 色選択
  m.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"6px"}},"色"));
  const colorRow=div({style:{display:"flex",flexWrap:"wrap",gap:"8px",marginBottom:"12px"}});
  EV_COLORS.forEach(c=>{
    const on=state.newEvColor===c;
    const cb=btn({style:{width:"32px",height:"32px",borderRadius:"8px",cursor:"pointer",
      background:c+(on?"":"44"),border:`2px solid ${on?c:"transparent"}`,boxShadow:on?`0 0 0 2px #0f172a, 0 0 0 4px ${c}66`:"none"}},"");
    cb.addEventListener('click',()=>{state.newEvColor=c;render();});
    colorRow.appendChild(cb);
  });
  m.appendChild(colorRow);

  // 繰り返し選択（選択した日付の情報から動的にオプション生成）
  const baseDate=isRepEdit?vd:(state.newEvDate||vd);
  const s=parseDS(baseDate);
  const w=WEEKDAYS_JP[s.getDay()];
  const nth=Math.ceil(s.getDate()/7);
  m.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"6px"}},"繰り返し"));
  const repSel=document.createElement('select');
  repSel.className='sel';
  repSel.style.cssText="width:100%;margin-bottom:14px";
  const isW=t=>t==="w1"||t==="w2"||t==="w3"||t==="w4";
  [
    {v:"none",l:"なし"},
    {v:"daily",l:"毎日"},
    {v:"w1",l:`毎週（曜日を選択）`},
    {v:"w2",l:`2週に1回（曜日を選択）`},
    {v:"w3",l:`3週に1回（曜日を選択）`},
    {v:"w4",l:`4週に1回（曜日を選択）`},
    {v:"nth",l:`毎月 第${nth}${w}曜日`},
    {v:"monthly",l:`毎月${s.getDate()}日`},
    {v:"yearly",l:`毎年${s.getMonth()+1}月${s.getDate()}日`},
  ].forEach(({v,l})=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(v===state.newEvRepeat)o.selected=true;repSel.appendChild(o);});
  repSel.addEventListener('change',e=>{
    state.newEvRepeat=e.target.value;
    if(isW(state.newEvRepeat)&&(!state.newEvWeekdays||!state.newEvWeekdays.length)) state.newEvWeekdays=[s.getDay()];
    render();
  });

// AI応答からJSONを頑健に取り出す（```フェンス除去＋最初の{…}を抽出）
function parseAIJson(text){
  let t=(text||"").replace(/```json|```/g,"").trim();
  try{ return JSON.parse(t); }catch(_){}
  const i=t.indexOf('{'), j=t.lastIndexOf('}');
  if(i>=0 && j>i){ try{ return JSON.parse(t.slice(i,j+1)); }catch(_){} }
  throw new Error("AI応答を解析できませんでした");
}

function alcoholImpactStats(){

  const dNext=[],sNext=[],dSleep=[],sSleep=[];
  dates.forEach(ds=>{ const nd=addDays(ds,1); const drank=dayHasAlcohol(ds);

    const nsl=getNightSleepHours(nd); if(nsl!=null)(drank?dSleep:sSleep).push(nsl);
  });
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return { drinkNextScore:mean(dNext), soberNextScore:mean(sNext), drinkN:dNext.length, soberN:sNext.length,
           drinkNextSleep:mean(dSleep), soberNextSleep:mean(sSleep), drinkSleepN:dSleep.length, soberSleepN:sSleep.length };
}
// 直近days日の「アルコール由来カロリー」（純アルコール7.1kcal/g）
function alcoholKcalRange(vd, days){ let kcal=0; for(let i=0;i<days;i++){ const ds=addDays(vd,-i); (getDaily(ds).drinks||[]).forEach(dr=>{ const dt=resolveDT(dr); kcal+=pureAlcohol(dr.ml, dr.pct!=null?dr.pct:dt.pct)*7.1; }); } return Math.round(kcal); }
// 目標ノードが達成済みか（範囲一日目標は当日のdailyDoneで判定）
function goalNodeDone(g, key){
  if(typeof isRangeDaily==="function" && isRangeDaily(g)){ const p=pkParse(key)||{}; return dailyGoalDone(g, p.date||(key||"").replace("daily_","")); }
  return !!g.done || gtAchieved(g);
}
// 指定期間タイプで「その期の目標を全部達成した」期(periodKey)の数。
// 例：daily → 今日の目標を全部達成した日数、weekly → 週間目標を全部達成した週数。
function goalPeriodAchievedCount(periodType){
  const keys=new Set();
  (function walk(nodes){ (nodes||[]).forEach(n=>{ if(n.periodType===periodType && n.periodKey) keys.add(n.periodKey); walk(n.children); }); })(state.goalTree);
  let cnt=0;
  keys.forEach(k=>{ const goals=gtCollectByPeriod(periodType,k); if(goals.length && goals.every(g=>goalNodeDone(g,k))) cnt++; });
  return cnt;
}
const GOAL_PERIOD_LABELS2={daily:"今日の目標",weekly:"週間目標",monthly:"月次目標",quarterly:"四半期目標",yearly:"年間目標"};
// ご褒美のアンロック状況。trigger: {type:'streak',days} | {type:'routine',uid,count} | {type:'goal',id}
// 旧データ（trigger無し・daysのみ）は連続日数として扱う。
function rewardStatus(r){
  const tr = r.trigger || {type:'streak', days:r.days||7};
  if(tr.type==='routine'){
    const ct=(state.customTodos||[]).find(c=>String(c.uid)===String(tr.uid));
    const need=Math.max(1,tr.count||1), cnt=customTodoDoneCount(tr.uid);
    return {unlocked:cnt>=need, badge:`🔁${need}`, progress:cnt>=need?"🎉達成":`${cnt}/${need}回`, name:ct?ct.label:"(削除済み)"};
  }
  if(tr.type==='sober'){
    const need=Math.max(1,tr.count||1), cnt=alcoholFreeStreak();
    return {unlocked:cnt>=need, badge:`🚱${need}`, progress:cnt>=need?"🎉達成":`${cnt}/${need}日`, name:"休肝日連続"};
  }
  if(tr.type==='invest'||tr.type==='resist'){ // resist=旧名（互換）
    if(tr.metric==='amount'){
      const need=Math.max(1,tr.amount||1000), cnt=investAmountTotal();
      return {unlocked:cnt>=need, badge:`💰¥${need.toLocaleString()}`, progress:cnt>=need?"🎉達成":`¥${cnt.toLocaleString()}/¥${need.toLocaleString()}`, name:"未来投資（節約額）"};
    }
    const need=Math.max(1,tr.count||1), cnt=investTotal();
    return {unlocked:cnt>=need, badge:`💰${need}`, progress:cnt>=need?"🎉達成":`${cnt}/${need}回`, name:"未来投資"};
  }
  if(tr.type==='goalperiod'){
    const need=Math.max(1,tr.count||1), cnt=goalPeriodAchievedCount(tr.period);
    const unit=tr.period==='daily'?"日":"回";
    return {unlocked:cnt>=need, badge:`🎯${need}`, progress:cnt>=need?"🎉達成":`${cnt}/${need}${unit}`, name:`${GOAL_PERIOD_LABELS2[tr.period]||"目標"}達成`};
  }
  if(tr.type==='goal'){ // 旧：特定の目標ノード（互換）
    const f=gtFind(tr.id); const node=f&&f.node; const done=node?(node.done||gtAchieved(node)):false;
    return {unlocked:done, badge:"🎯", progress:done?"🎉達成":"未達成", name:node?(node.text||"(無題)"):"(削除済み)"};
  }
  const need=tr.days||7, streak=currentOverallStreak().streak;
  return {unlocked:streak>=need, badge:`${need}日`, progress:streak>=need?"🎉達成":`あと${need-streak}日`, name:null};
}

// スケジュール提案のシステムプロンプト（初回提案・対話の両方で共有）
const SCHED_SYS=`あなたは体調に配慮する生活プランナーです。ユーザーの1日のスケジュールを提案し、以下のJSON形式のみで返答してください:
{"comment":"提案や調整の説明1〜2文（体調への配慮点や、要望をどう反映したかにも触れる）","events":[{"title":"予定名","startH":9,"startM":0,"endH":10,"endM":30}]}
ルール:
- 既存の予定と重複しない時間に配置。勤務時間中には予定を入れない。食事時間を確保。無理のない量にする。
- 「ルーティン」のグループは、中の個々の項目を分割せず、必ずグループ名（例: 🌅モーニングルーティン）のまま【1つのまとまった予定】として1件だけ配置。所要は項目数に応じ15〜45分目安。その他の項目は個別配置可。
- 【体調を最重要で考慮する】体調が低い(目安6未満)・睡眠不足(6h未満)・症状がある場合は、予定を詰め込まず「休息」「仮眠」「軽いストレッチ」など回復を優先し、[最優先][重要]タスクも短時間・控えめにする。
- 体調が良い(目安7以上)ときや、時間帯別の平均体調が高い時間帯には、インプット・アウトプット・トレーニング・勉強など集中や負荷を要する活動を配置する。逆に体調が落ちやすい時間帯には負荷の軽い予定を置く。
- [最優先][重要][緊急]のタスクは、上記の体調配慮の範囲で優先的に配置する。
- 対話の場合はユーザーの最新の要望を必ず反映し、eventsには調整後の【1日分の完全なスケジュール】を毎回返す。`;

// スケジュール提案の入力コンテキスト（データ部分）を組み立てる
function buildScheduleContext(vd){
  const skAI=getPlanShiftKey(vd);
  const shift=(!skAI||skAI==="off"||skAI==="off2")?"休み":skAI==="s1"?"1直(7:30-16:00勤務)":"2直(14:30-23:00勤務)";
  const existing=getEventsForDate(vd).map(e=>`${String(e.startH).padStart(2,'0')}:${String(e.startM).padStart(2,'0')}〜${String(e.endH).padStart(2,'0')}:${String(e.endM).padStart(2,'0')} ${e.title}`).join("\n")||"なし";
  const prioT=t=>(t.imp&&t.urg)?"[最優先]":t.imp?"[重要]":t.urg?"[緊急]":"";
  const todoTasks=(state.tasks.todo||[]).filter(t=>!t.done).map(t=>`${prioT(t)}${t.text}`).join(", ")||"なし";
  const routineGroups=(state.routines||[]).filter(g=>g.ids&&g.ids.length);
  const routineIdSet=new Set(routineGroups.flatMap(g=>g.ids));
  const routineDesc=routineGroups.map(g=>{
    const labels=g.ids.map(id=>{const it=TODO_ITEMS.find(x=>x.id===id);return it?it.label:null;}).filter(Boolean);
    return `「${g.title}」= ${labels.join("・")}`;
  }).join("\n")||"なし";
  const soloItems=TODO_ITEMS.filter(it=>!routineIdSet.has(it.id)).map(it=>it.label).join(", ")||"なし";
  const scoredAll=state.logs.filter(l=>l.score!=null);
  const avgOf=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length):null;
  const todayAvg=avgOf(scoredAll.filter(l=>l.dateStr===vd).map(l=>l.score));
  const recent7=[]; for(let i=0;i<7;i++){const ls=scoredAll.filter(l=>l.dateStr===addDays(vd,-i)).map(l=>l.score); const a=avgOf(ls); if(a!=null)recent7.push(a);}
  const recentAvg=avgOf(recent7);
  const _sh=getNightSleepHours(vd); const sleepH=_sh!=null?Math.round(_sh*10)/10:null;
  const recentSymptoms=[...new Set(scoredAll.filter(l=>l.dateStr>=addDays(vd,-3)).flatMap(l=>l.symptoms||[]))].slice(0,6);
  const tod={m:[],a:[],e:[],n:[]};
  scoredAll.forEach(l=>{const h=l.hour; if(h>=5&&h<11)tod.m.push(l.score);else if(h>=11&&h<17)tod.a.push(l.score);else if(h>=17&&h<22)tod.e.push(l.score);else tod.n.push(l.score);});
  const av=a=>{const v=avgOf(a);return v!=null?v.toFixed(1):"—";};
  const todStr=`朝(5-11時)${av(tod.m)} / 昼(11-17時)${av(tod.a)} / 夕(17-22時)${av(tod.e)} / 夜(22-5時)${av(tod.n)}`;
  const conditionCtx=`今日の体調: ${todayAvg!=null?todayAvg.toFixed(1)+"/10":"未記録"} / 直近7日平均: ${recentAvg!=null?recentAvg.toFixed(1)+"/10":"—"} / 前夜の睡眠: ${sleepH!=null?sleepH+"h":"—"} / 最近の症状: ${recentSymptoms.join("・")||"なし"} / 時間帯別の平均体調(10点満点): ${todStr}`;
  const now=new Date();
  const timeCtx=(vd===todayStr())?`現在時刻は${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}です。今の時刻以降のスケジュールだけ提案してください。`:"1日全体のスケジュールを提案してください。";
  return `日付: ${vd}\n勤務: ${shift}\n${timeCtx}\n\n【体調】\n${conditionCtx}\n\n【既存の予定】\n${existing}\n\n【やることリスト(未完了・優先度付き)】\n${todoTasks}\n\n【ルーティン（各グループはまとめて1件の予定として配置。titleはグループ名のまま）】\n${routineDesc}\n\n【その他の毎日の項目（個別に配置してよい）】\n${soloItems}`;
}

async function runAISchedule(vd){
  if(state.aiScheduleLoading)return;
  state.aiScheduleLoading=true;state.aiScheduleProposal=null;state.aiScheduleChat=[];render();
  try{
    const text=await callAIText(SCHED_SYS, `${buildScheduleContext(vd)}\n\n体調を踏まえてスケジュールを提案してください。`);
    const proposal=parseAIJson(text);
    if(!proposal.events||!proposal.events.length)throw new Error("提案が生成できませんでした");
    state.aiScheduleProposal=proposal;
    state.aiScheduleChat=[{role:"ai",text:proposal.comment||"スケジュールを提案しました。調整したいことがあれば教えてください。"}];
  }catch(e){
    showToast(`提案失敗: ${e.message}`,"#ef4444");
  }
  state.aiScheduleLoading=false;render();
}
// スケジュール提案の対話（要望を反映して提案を更新）
async function aiScheduleChatSend(vd){
  const msg=(state.aiScheduleInput||"").trim();
  if(!msg||state.aiScheduleChatLoading)return;
  state.aiScheduleChat=[...(state.aiScheduleChat||[]),{role:"user",text:msg}];
  state.aiScheduleInput=""; state.aiScheduleChatLoading=true; render();
  try{
    const prompt=`${buildScheduleContext(vd)}\n\n【これまでの提案・会話】\n${chatHistoryText(state.aiScheduleChat)}\n\nユーザーの最新の要望を反映し、調整後の1日分の完全なスケジュールをJSONで返してください。`;
    const text=await callAIText(SCHED_SYS, prompt);
    const proposal=parseAIJson(text);
    if(proposal.events&&proposal.events.length)state.aiScheduleProposal=proposal;
    state.aiScheduleChat=[...state.aiScheduleChat,{role:"ai",text:proposal.comment||"提案を更新しました。"}];
  }catch(e){
    state.aiScheduleChat=[...state.aiScheduleChat,{role:"ai",text:`（エラー: ${e.message}）`}];
  }
  state.aiScheduleChatLoading=false; render();
}

// ── TODO並び順管理 ────────────────────────────────
function getOrderedTodoItems(){
  let order=null;
  try{const s=localStorage.getItem(STORAGE_KEY+"_todo_order");if(s)order=JSON.parse(s);}catch{}
  if(!Array.isArray(order)||order.length===0) return [...TODO_ITEMS];
  const byId=Object.fromEntries(TODO_ITEMS.map(it=>[it.id,it]));
  const ordered=order.map(id=>byId[id]).filter(Boolean);
  // 保存順にない新項目は末尾に追加
  TODO_ITEMS.forEach(it=>{if(!order.includes(it.id))ordered.push(it);});
  return ordered;
}
function moveTodoItem(id, dir){
  const items=getOrderedTodoItems();
  const idx=items.findIndex(it=>it.id===id);
  const to=idx+dir;
  if(idx<0||to<0||to>=items.length)return;
  [items[idx],items[to]]=[items[to],items[idx]];
  safeSet(STORAGE_KEY+"_todo_order",JSON.stringify(items.map(it=>it.id)));
  render();
}

// ── たまにやること（N日/N週/Nヶ月ごとのカスタムTODO）──
function saveCustomTodos(){ safeSet(STORAGE_KEY+"_customtodos",JSON.stringify(state.customTodos)); }
// 途中変更（reschedules）：指定日(from)以降は、そのセグメントの周期に切り替える。
// fromを新しい起点として数え直すため、それ以前の記録・周期はそのまま保たれる。
function customTodoCfgFor(ct, ds){
  const rs=ct&&ct.reschedules;
  if(!Array.isArray(rs)||!rs.length)return ct;
  let best=null;
  for(const r of rs){ if(r&&r.from&&ds>=r.from){ if(!best||r.from>best.from)best=r; } }
  if(!best)return ct;
  return {...ct, startDate:best.from,
    itype:best.itype||ct.itype,
    n:Math.max(1,best.n||ct.n||1),
    weekdays:Array.isArray(best.weekdays)?best.weekdays:ct.weekdays,
    shifts:Array.isArray(best.shifts)?best.shifts:ct.shifts};
}
function customTodoDue(ct, ds){
  if(!ct||!ct.startDate)return false;
  // 特定日を別の日へ移動してきた臨時オカレンス（moved）は、その日を該当日として扱う
  if((state.todos[ds]||{})[ct.uid]?.moved) return true;
  ct=customTodoCfgFor(ct,ds);
  const d=parseDS(ds), s=parseDS(ct.startDate);
  if(d<s)return false;
  const n=Math.max(1,ct.n||1);
  // 直ごとに曜日・時刻を設定するモード：当日のシフトに対応する設定で判定
  if(ct.shiftSchedule){
    const k=getPlanShiftKey(ds)||"off";
    const ss=ct.shiftSchedule[k];
    if(!ss||!ss.on)return false;
    if(ss.weekdays&&ss.weekdays.length && !ss.weekdays.includes(d.getDay()))return false;
    const mon=x=>{const m=new Date(x.getFullYear(),x.getMonth(),x.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m;};
    if(Math.round((mon(d)-mon(s))/(7*86400000))%n!==0)return false; // n週間隔
    return true;
  }
  let ok=false;
  if(ct.itype==="day")  ok=Math.round((d-s)/86400000)%n===0;
  else if(ct.itype==="week"){
    const wds=(ct.weekdays&&ct.weekdays.length)?ct.weekdays:null;
    if(wds){
      if(!wds.includes(d.getDay())) ok=false;
      else { const mon=x=>{const m=new Date(x.getFullYear(),x.getMonth(),x.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m;}; ok=Math.round((mon(d)-mon(s))/(7*86400000))%n===0; }
    } else ok=Math.round((d-s)/86400000)%(n*7)===0;
  }
  else if(ct.itype==="month"){ const mo=(d.getFullYear()-s.getFullYear())*12+(d.getMonth()-s.getMonth()); ok=(mo>=0 && mo%n===0 && d.getDate()===s.getDate()); }
  if(!ok)return false;
  // シフト連動：対象の直の日だけ
  if(ct.shifts&&ct.shifts.length){ const k=getPlanShiftKey(ds)||"off"; if(!ct.shifts.includes(k))return false; }
  return true;
}
function dueCustomTodos(ds){ return (state.customTodos||[]).filter(ct=>customTodoDue(ct,ds)); }
// 特定日の定期ルーティンを別の日(toDs)へ移動する。元の日は除外し、移動先に臨時オカレンス(moved)を作る。
// 内容の上書き（時刻・名前・メモ）は引き継ぐ。完了状態は引き継がない（未実施で移動）。
function moveCustomTodoDay(uid, fromDs, toDs){
  if(!toDs || toDs===fromDs) return;
  const fromRec={...((state.todos[fromDs]||{})[uid]||{})};
  const carry={}; // 引き継ぐこの日限定の上書き
  if(fromRec.timeOverride) carry.timeOverride=fromRec.timeOverride;
  if(fromRec.labelOverride) carry.labelOverride=fromRec.labelOverride;
  if(fromRec.noteOverride) carry.noteOverride=fromRec.noteOverride;
  // 元の日から消す
  if(fromRec.moved){ // すでに移動で来ていた臨時オカレンス → それ自体を解除
    delete fromRec.moved; delete fromRec.movedFrom; delete fromRec.timeOverride; delete fromRec.labelOverride; delete fromRec.noteOverride;
    setTodo(fromDs, uid, fromRec);
  } else { // 本来の該当日 → 除外
    setTodo(fromDs, uid, {...fromRec, excluded:true, checked:false, time:null, timeOverride:undefined, movedTo:toDs});
  }
  // 移動先に臨時オカレンスを作る（除外は解除）
  const toRec={...((state.todos[toDs]||{})[uid]||{})};
  setTodo(toDs, uid, {...toRec, ...carry, moved:true, excluded:false, checked:false, time:null, movedFrom:fromDs});
}
// 表示日 vd で対応すべき「回」を返す。当日該当なら当日、そうでなければ直近の未実施回を繰り越す。
// 完了/除外済みの過去回は繰り越さない（最新回のみ対象）。
function customTodoOccurrence(ct, vd){
  const recVd=(state.todos[vd]||{})[ct.uid]||{};
  // この日は別の日へ移動済み（movedTo）→ この日にはオカレンスなし
  if(recVd.movedTo) return null;
  // 当日にチェック済み（当日該当 or 繰り越しをその日に実施）→ 当日の完了として表示
  if(recVd.checked) return {dueDate:vd, overdue:false, excluded:false, checked:true};
  if(customTodoDue(ct,vd)){
    return {dueDate:vd, overdue:false, excluded:!!recVd.excluded, checked:false};
  }
  let ds=vd;
  for(let i=0;i<60;i++){
    ds=addDays(ds,-1);
    if(ct.startDate && ds<ct.startDate) break;
    if(customTodoDue(ct,ds)){
      const rec=(state.todos[ds]||{})[ct.uid]||{};
      if(rec.checked||rec.excluded) return null; // 直近回は完了/除外 → 繰り越さない
      const tt=customTodoTimeFor(ct,ds);
      const days=Math.round((parseDS(vd)-parseDS(ds))/86400000);
      // 「開始」が翌日の回（startNextDay＝実際の時刻が翌日にずれる夜間ルーティン等）：
      //  実際の時刻は該当日の翌日（=days===1で当日vd）にあるので、その日は「当日やるもの」として
      //  表示する（snToday）。「◯日前・繰越」の表示にはしない。時刻が過ぎた翌々日以降は繰り越さない。
      //  曜日別/シフト別の設定にも対応するため実効時刻(customTodoTimeFor)のsnで判定する。
      if(tt&&tt.sn){
        if(days===1) return {dueDate:ds, overdue:true, snToday:true, excluded:false, checked:false, daysAgo:days};
        return null;
      }
      return {dueDate:ds, overdue:true, excluded:false, checked:false, daysAgo:days};
    }
  }
  return null;
}
// 繰り越し実施時：直近の完了回までさかのぼって、未実施・未除外の該当日をすべて除外（予定から削除）
function dismissPastUnchecked(ct, vd){
  let ds=vd, changed=false;
  for(let i=0;i<400;i++){
    ds=addDays(ds,-1);
    if(ct.startDate && ds<ct.startDate) break;
    if(customTodoDue(ct,ds)){
      const rec=(state.todos[ds]||{})[ct.uid]||{};
      if(rec.checked) break; // 直近の完了回に到達 → それ以前は対象外
      if(!rec.excluded){ if(!state.todos[ds])state.todos[ds]={}; state.todos[ds][ct.uid]={...rec,excluded:true}; changed=true; }
    }
  }
  if(changed){ try{localStorage.setItem(STORAGE_KEY+"_todo",JSON.stringify(state.todos));}catch{} }
}
// たまにやることの指定日dsでの時刻 {h,m}。時刻なしは null。
// 曜日別の時間（さらに直で分けられる）があれば優先、なければ基本の timeH/timeM。
function customTodoTimeFor(ct, ds){
  // その日だけの時刻上書き（最優先）
  const _r=(state.todos[ds]||{})[ct.uid];
  if(_r&&_r.timeOverride&&_r.timeOverride.timeH!=null){ const o=_r.timeOverride; return {h:o.timeH,m:o.timeM||0,eh:o.endH,em:o.endM,en:!!o.endNextDay,sn:!!o.startNextDay}; }
  // 直ごとモード：当日のシフトの時刻（その直の中で曜日別の上書きがあれば優先）
  if(ct.shiftSchedule){
    const k=getPlanShiftKey(ds)||"off";
    const ss=ct.shiftSchedule[k];
    if(ss&&ss.on){
      const dow=parseDS(ds).getDay();
      const wt=(ss.weekdayTimes||{})[dow];
      if(wt&&wt.timeH!=null) return {h:wt.timeH,m:wt.timeM||0,eh:wt.endH,em:wt.endM,en:!!wt.endNextDay,sn:!!wt.startNextDay};
      if(ss.timeH!=null) return {h:ss.timeH,m:ss.timeM||0,eh:ss.endH,em:ss.endM,en:!!ss.endNextDay,sn:!!ss.startNextDay};
    }
    return null;
  }
  const dow=parseDS(ds).getDay();
  const wt=(ct.weekdayTimes||{})[dow];
  if(wt){
    if(wt.byShift){
      const k=getPlanShiftKey(ds)||"off";
      const st=(wt.shiftTimes||{})[k];
      if(st&&st.on!==false&&st.timeH!=null) return {h:st.timeH,m:st.timeM||0,eh:st.endH,em:st.endM,en:!!st.endNextDay,sn:!!st.startNextDay};
      return null;
    }
    if(wt.timeH!=null) return {h:wt.timeH,m:wt.timeM||0,eh:wt.endH,em:wt.endM,en:!!wt.endNextDay,sn:!!wt.startNextDay};
  }
  if(ct.timeH!=null) return {h:ct.timeH,m:ct.timeM||0,eh:ct.endH,em:ct.endM,en:!!ct.endNextDay,sn:!!ct.startNextDay};
  return null;
}
// tt(customTodoTimeForの戻り値)から [startMin, endMin] を得る。終了未設定は既定12分。
function customTodoSpan(tt){
  const soff=tt.sn?1440:0;             // 開始が翌日
  const s=tt.h*60+(tt.m||0)+soff;
  if(tt.eh==null) return {s, e:s+12};
  let e=tt.eh*60+(tt.em||0)+soff;
  if(tt.en) e+=1440;        // 終了はさらに翌日
  else if(e<=s) e=s+12;     // 翌日指定なしで終了≦開始は点扱い（従来通り）
  return {s, e};            // s/e は1440を超えることがある（呼び出し側でクリップ）
}
function customTodoIntervalLabel(ct){
  const n=ct.n||1;
  const WD=["日","月","火","水","木","金","土"];
  let base="";
  if(ct.shiftSchedule){
    const SL={s1:"1直",s2:"2直",off:"休1",off2:"休2"};
    const parts=[];
    ["s1","s2","off","off2"].forEach(k=>{const ss=ct.shiftSchedule[k];if(ss&&ss.on){const wds=(ss.weekdays&&ss.weekdays.length)?ss.weekdays.slice().sort((a,b)=>a-b).map(i=>WD[i]).join("・"):"全曜日";parts.push(`${SL[k]}:${wds}`);}});
    return (n===1?"":`${n}週ごと `)+`直別[${parts.join(" / ")||"未設定"}]`;
  }
  if(ct.itype==="day")   base=n===1?"毎日":`${n}日ごと`;
  else if(ct.itype==="week"){
    const wds=(ct.weekdays&&ct.weekdays.length)?ct.weekdays.slice().sort((a,b)=>a-b).map(i=>WD[i]).join("・"):null;
    base=(n===1?"毎週":`${n}週ごと`)+(wds?` ${wds}`:"");
  }
  else if(ct.itype==="month") base=n===1?"毎月":`${n}ヶ月ごと`;
  if(ct.shifts&&ct.shifts.length){ const SL={s1:"1直",s2:"2直",off:"休"}; base+=` [${ct.shifts.map(k=>SL[k]||k).join("/")}]`; }
  return base;
}
// 次回該当日を探す（最大約2年）。ソート比較や各行描画で繰り返し呼ばれるため、
// 当日単位でメモ化して同一レンダー内の再計算を避ける。
let _nctCache={day:null,map:new Map()};
function nextCustomTodoDate(ct){
  const today=todayStr();
  if(_nctCache.day!==today){ _nctCache={day:today,map:new Map()}; }
  const key=ct.uid!=null?ct.uid+"|"+ct.startDate+"|"+ct.itype+"|"+ct.n+"|"+(ct.weekdays||[]).join(",")+"|"+(ct.shifts||[]).join(",")+"|"+JSON.stringify(ct.reschedules||[]):JSON.stringify(ct);
  if(_nctCache.map.has(key)) return _nctCache.map.get(key);
  let ds=today, res=ct.startDate;
  for(let i=0;i<800;i++){ if(customTodoDue(ct,ds)){ res=ds; break; } ds=addDays(ds,1); }
  _nctCache.map.set(key,res);
  return res;
}

// 日付を1日前に戻す
function prevDay(dateStr){
  const a=dateStr.split('-');
  const n=new Date(parseInt(a[0]),parseInt(a[1])-1,parseInt(a[2]));
  n.setDate(n.getDate()-1);
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

// 指定アイテムが指定日に完了しているか
function isTodoDone(dateStr, item){
  const t=(state.todos[dateStr]||{})[item.id]||{};
  if(t.excluded) return true; // 除外日は達成扱い（連続を途切れさせない）
  if(item.type==="check") return !!t.checked;
  if(item.type==="timer"){
    if(item.multi){
      // マルチ：少なくとも1セッション完了していればOK
      const sessions=t.sessions||[];
      return sessions.some(s=>s.startTime&&s.endTime);
    }
    return !!(t.startTime && t.endTime);
  }
  return false;
}

// 指定アイテムの連続達成日数（vdの日まで何日連続か）
function calcStreak(vd, item){
  let count = 0;
  let chk = vd;
  for(let i=0;i<365;i++){
    if(isTodoDone(chk, item)) count++;
    else break;
    chk = prevDay(chk);
  }
  return count;
}

        border:`1px solid ${isExcluded?"#f97316":"#334155"}`,

        color:isExcluded?"#f97316":"#475569"
      }},isExcluded?"除外中":"除外");
      exBtn.addEventListener('click',(()=>{const id=item.id;return e=>{e.stopPropagation();toggleExclude(vd,id);};})()); 
      innerRow.appendChild(exBtn);

      // チェック完了時刻表示（タップで修整）
      if(item.type==="check" && isDone && t.time){
        const d2=new Date(t.time);
        const tb=btn({style:{fontSize:"10px",color:"#64748b",whiteSpace:"nowrap",background:"transparent",border:"1px solid #1e3a5f",borderRadius:"6px",padding:"2px 6px",cursor:"pointer"}},
