let toastTimer=null;
// pointerupでモーダルを開いた直後に発生する互換クリック（ゴーストクリック）を1回だけ握りつぶす。
// これがないと、開いたモーダル上のボタン（例：Googleマップ）が同じタップで押されてしまう。
let swallowClickUntil=0;
document.addEventListener('click', e=>{
  if(swallowClickUntil && Date.now()<swallowClickUntil){ swallowClickUntil=0; e.stopPropagation(); e.preventDefault(); }
}, true);
function showToast(msg, color="#22c55e"){
  const el=document.getElementById('toast');
  if(!el)return;
  el.textContent=msg;
  el.style.borderColor=color;
  el.style.color=color;
  el.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

function showConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  if(!canvas)return;
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');
  const pieces=Array.from({length:120},()=>({
    x:Math.random()*canvas.width,
    y:-10-Math.random()*100,
    w:8+Math.random()*8,
    h:4+Math.random()*4,
    r:Math.random()*Math.PI*2,
    vx:(Math.random()-0.5)*4,
    vy:3+Math.random()*4,
    vr:(Math.random()-0.5)*0.2,
    color:`hsl(${Math.floor(Math.random()*360)},90%,60%)`
  }));
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
      p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=0.05;
    });
    frame++;
    if(frame<120)requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

// ═══════════════════════════════════════════════════
// LocalStorage容量チェック・アーカイブ
// ═══════════════════════════════════════════════════
function getStorageUsage(){
  let total=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    const v=localStorage.getItem(k)||"";
    total+=k.length+v.length;
  }
  // 推定上限5MB（5,242,880文字）
  const limit=5*1024*1024/2; // UTF-16で2バイト/文字
  return {used:total,limit,pct:Math.round((total/limit)*100)};
}

function checkStorageAndAlert(){
  const {pct}=getStorageUsage();
  if(pct>=90){state.storageAlert=true;render();}
}

// アーカイブ対象の年リストを取得
function getArchiveYears(){
  const thisYear=new Date().getFullYear();
  const years=new Set();
  state.logs.forEach(l=>{const y=parseInt(l.dateStr.slice(0,4));if(y<thisYear)years.add(y);});
  state.dailies.forEach(d=>{const y=parseInt(d.dateStr.slice(0,4));if(y<thisYear)years.add(y);});
  return [...years].sort().reverse();
}

function exportAndDeleteYear(year){
  const yStr=String(year);
  // 対象データを抽出
  const logs=state.logs.filter(l=>l.dateStr.startsWith(yStr));
  const dailies=state.dailies.filter(d=>d.dateStr.startsWith(yStr));
  const todos={};
  Object.keys(state.todos).forEach(k=>{if(k.startsWith(yStr))todos[k]=state.todos[k];});
  let weather={};
  try{const s=localStorage.getItem(STORAGE_KEY+"_weather");if(s){const w=JSON.parse(s);Object.keys(w).forEach(k=>{if(k.startsWith(yStr))weather[k]=w[k];});}}catch{}

  // エクスポート
  const archive={year,logs,dailies,todos,weather,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(archive,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=`health_archive_${year}.json`;a.click();URL.revokeObjectURL(url);

  // 削除
  state.logs=state.logs.filter(l=>!l.dateStr.startsWith(yStr));
  state.dailies=state.dailies.filter(d=>!d.dateStr.startsWith(yStr));
  Object.keys(state.todos).forEach(k=>{if(k.startsWith(yStr))delete state.todos[k];});
  try{
    const s=localStorage.getItem(STORAGE_KEY+"_weather");
    if(s){const w=JSON.parse(s);Object.keys(w).forEach(k=>{if(k.startsWith(yStr))delete w[k];});localStorage.setItem(STORAGE_KEY+"_weather",JSON.stringify(w));}
  }catch{}
  saveStorage();
  state.storageAlert=false;render();
}

function renderStorageAlertModal(){
  const {used,limit,pct}=getStorageUsage();
  const usedMB=(used*2/1024/1024).toFixed(1);
  const limitMB=(limit*2/1024/1024).toFixed(0);
  const years=getArchiveYears();
  if(!state.storageExportYear&&years.length>0)state.storageExportYear=years[0];

  const bg=div({className:"modal-center"});
  const m=div({className:"modal-box"});
  bg.addEventListener('click',e=>e.stopPropagation());
  m.addEventListener('click',e=>e.stopPropagation());

  // 警告ヘッダー
  m.appendChild(div({style:{fontSize:"28px",textAlign:"center",marginBottom:"8px"}},"⚠️"));
  m.appendChild(div({style:{fontSize:"16px",fontWeight:700,color:"#f97316",textAlign:"center",marginBottom:"8px"}},"ストレージ残量が少なくなっています"));

  // 使用量バー
  m.appendChild(div({style:{marginBottom:"16px"}},[
    div({style:{display:"flex",justifyContent:"space-between",fontSize:"11px",color:"#64748b",marginBottom:"4px"}},[
      span({},`使用中: ${usedMB}MB`),
      span({},`上限: ${limitMB}MB (${pct}%)`)
    ]),
    div({style:{height:"8px",background:"#0f172a",borderRadius:"4px",overflow:"hidden"}},[
      div({style:{height:"100%",width:`${Math.min(pct,100)}%`,background:pct>=95?"#ef4444":"#f97316",borderRadius:"4px"}})
    ])
  ]));

  m.appendChild(div({style:{fontSize:"12px",color:"#94a3b8",marginBottom:"12px",lineHeight:1.6}},"過去のデータをアーカイブしてストレージを解放してください。エクスポートしたファイルはバックアップとして保存できます。"));

  if(years.length===0){
    m.appendChild(div({style:{fontSize:"12px",color:"#475569",textAlign:"center",padding:"12px 0"}},"アーカイブできるデータがありません（今年のデータのみ）"));
  } else {
    // 年選択
    m.appendChild(div({style:{fontSize:"11px",color:"#64748b",marginBottom:"6px"}},"エクスポートする年"));
    const sel=document.createElement('select');
    sel.style.cssText="width:100%;padding:9px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;margin-bottom:8px";
    years.forEach(y=>{
      const o=document.createElement('option');o.value=y;
      const logCount=state.logs.filter(l=>l.dateStr.startsWith(String(y))).length;
      o.textContent=`${y}年（体調記録${logCount}件）`;
      if(y===state.storageExportYear)o.selected=true;
      sel.appendChild(o);
    });
    sel.addEventListener('change',e=>{state.storageExportYear=parseInt(e.target.value);});
    m.appendChild(sel);

    // エクスポート＋削除ボタン
    m.appendChild(btn({style:{width:"100%",padding:"10px",background:"linear-gradient(135deg,#f97316,#ef4444)",border:"none",borderRadius:"8px",color:"#fff",fontSize:"13px",fontWeight:600,cursor:"pointer",marginBottom:"8px"},
      onClick:()=>{
        if(!state.storageExportYear)return;
        if(!confirm(`${state.storageExportYear}年のデータをエクスポートして削除しますか？\nエクスポートしたファイルは必ず保存してください。`))return;
        exportAndDeleteYear(state.storageExportYear);
      }},`📦 ${state.storageExportYear}年をエクスポートして削除`));
  }

  // 閉じる
  m.appendChild(btn({className:"btn-ghost",style:{width:"100%"},onClick:()=>{state.storageAlert=false;render();}},"後で対応する"));
  bg.appendChild(m);return bg;
}

const APP_VERSION = "12.81"; // ★バージョンはここ1箇所を変更すれば全体に反映される
const STORAGE_KEY = "health_v2";

// ── 取り消し（Undo）機構 ──────────────────────────
// 削除など取り返しのつかない操作の前に pushUndo() でデータ全体のスナップショットを
// 取り、数秒間「元に戻す」バーを表示する。健康記録など再入力が難しいデータの
// 誤削除を救済する。スナップショットは永続化される全フィールドの深いコピー。
let undoSnapshot=null, undoTimer=null;
const UNDO_FIELDS=["logs","dailies","todos","goals","goalTree","schedule","repeatEvents","tasks","routines","shiftPattern","planPatterns","customTodos"];
function snapshotData(){
  const snap={};
  UNDO_FIELDS.forEach(k=>{ try{ snap[k]=JSON.parse(JSON.stringify(state[k])); }catch{ snap[k]=state[k]; } });
  return snap;
}
function persistAll(){
  // スナップショット復元後に全フィールドを保存し直す
  saveStorage();
  if(typeof saveSchedule==='function')saveSchedule();
  if(typeof saveRepeatEvents==='function')saveRepeatEvents();
  if(typeof saveTasks==='function')saveTasks();
  if(typeof saveRoutines==='function')saveRoutines();
  if(typeof saveShiftPattern==='function')saveShiftPattern();
  if(typeof savePlanPatterns==='function')savePlanPatterns();
  if(typeof saveCustomTodos==='function')saveCustomTodos();
  if(typeof saveGoalTree==='function')saveGoalTree();
  safeSet(STORAGE_KEY+"_goals",JSON.stringify(state.goals));
  safeSet(STORAGE_KEY+"_todo",JSON.stringify(state.todos));
}
function pushUndo(label){
  undoSnapshot=snapshotData();
  showUndoBar(label||"削除しました");
}
function doUndo(){
  if(!undoSnapshot)return;
  UNDO_FIELDS.forEach(k=>{ if(undoSnapshot[k]!==undefined) state[k]=undoSnapshot[k]; });
  undoSnapshot=null;
  persistAll();
  hideUndoBar();
  showToast("元に戻しました","#22c55e");
  render();
}
function showUndoBar(label){
  const el=document.getElementById('undo-bar');
  if(!el)return;
  el.innerHTML='';
  const t=document.createElement('span');t.className='undo-label';t.textContent=label;
  const b=document.createElement('button');b.textContent='元に戻す';
  b.addEventListener('click',doUndo);
  el.appendChild(t);el.appendChild(b);
  el.classList.add('show');
  if(undoTimer)clearTimeout(undoTimer);
  undoTimer=setTimeout(hideUndoBar,6000);
}
function hideUndoBar(){
  const el=document.getElementById('undo-bar');
  if(el)el.classList.remove('show');
  if(undoTimer){clearTimeout(undoTimer);undoTimer=null;}
  // バーが消えたらスナップショットも破棄（メモリ節約）
  setTimeout(()=>{ if(!document.getElementById('undo-bar')?.classList.contains('show'))undoSnapshot=null; },300);
}

// 予定タブ「実際」列で1つにまとめて表示するルーティン群（アプリ内で編集可能・初期値）
const DEFAULT_ROUTINES = [
  {key:"morning",   title:"🌅モーニングルーティン", color:"#fb923c", ids:["meditation_am","bedmaking","grooming","water_am","stretch_am","dressing"]},
  {key:"breakfast", title:"🍳朝食",                 color:"#fbbf24", ids:["breakfast_prep","breakfast"]},

  {key:"dinner",    title:"🍽夕食",                 color:"#f97316", ids:["dinner_prep","dinner"]},
  {key:"night",     title:"🌙ナイトルーティン",     color:"#a78bfa", ids:["stretch_pm","meditation_pm"]},
];
const cloneRoutines = () => DEFAULT_ROUTINES.map(g=>({...g, ids:[...g.ids]}));
// 既存ユーザーに不足しているルーティン群（朝食/昼食/夕食など）を追加する一度きりの移行。
// 既存の割り当ては変更せず、他グループに未割り当ての項目だけを新グループへ入れる。
function migrateRoutines(){
  const cur=state.routines||[];
  const have=new Set(cur.map(r=>r.key));
  const assigned=new Set(); cur.forEach(r=>(r.ids||[]).forEach(id=>assigned.add(id)));
  const additions=DEFAULT_ROUTINES.filter(g=>!have.has(g.key)).map(g=>({...g, ids:g.ids.filter(id=>!assigned.has(id))}));
  if(!additions.length) return;
  const nightIdx=cur.findIndex(r=>r.key==="night");
  state.routines = nightIdx>=0 ? [...cur.slice(0,nightIdx),...additions,...cur.slice(nightIdx)] : [...cur,...additions];
  saveRoutines();
}
function saveRoutines(){ safeSet(STORAGE_KEY+"_routines",JSON.stringify(state.routines)); }

// ── シフトパターン（勤務の週間繰り返し）──
const SHIFT_TYPES = {
  s1:  {label:"1直", start:7.5,  end:16, color:"#38bdf8"},
  s2:  {label:"2直", start:14.5, end:23, color:"#a78bfa"},

};
// シフト選択肢（1直/2直/休み1/休み2）。休みは直の代わりに睡眠時間をずらす用途で2種類。
const SHIFT_OPTS = [["s1","1直"],["s2","2直"],["off","休み1"],["off2","休み2"]];
// 休み系キー（勤務なし）
const OFF_KEYS = ["off","off2"];
// 直近の月曜日(YYYY-MM-DD)
function mondayStr(ds){
  const d=parseDS(ds); d.setDate(d.getDate()-((d.getDay()+6)%7));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// 既定パターン：2週交代（1週目=平日1直、2週目=平日2直、土日休み）
function defaultShiftPattern(){
  return {
    enabled:false,
    weeks:2,
    anchorMonday:mondayStr(todayStr()),
    grid:[
      ["s1","s1","s1","s1","s1","off","off"],
      ["s2","s2","s2","s2","s2","off","off"],
    ],
  };
}
function saveShiftPattern(){ safeSet(STORAGE_KEY+"_shift",JSON.stringify(state.shiftPattern)); }
// 指定日のパターン上のシフトキー（s1/s2/off）を返す。無効・範囲外はnull
function getPatternShift(ds){
  const sp=state.shiftPattern;
  if(!sp||!sp.enabled||!Array.isArray(sp.grid)||!sp.grid.length)return null;
  const weeks=sp.weeks||sp.grid.length;
  const anchor=parseDS(sp.anchorMonday||mondayStr(todayStr()));
  const thisMon=parseDS(mondayStr(ds));
  const wDiff=Math.round((thisMon-anchor)/(7*86400000));
  const cycleWeek=((wDiff%weeks)+weeks)%weeks;
  const dow=(parseDS(ds).getDay()+6)%7; // 月=0
  const row=sp.grid[cycleWeek]||sp.grid[cycleWeek%sp.grid.length];
  return row?(row[dow]||null):null;
}
// 予定(左)のシフトキー：その日の予定上書き(planShift)→なければパターン。
// planShift は "s1"/"s2"/"off" または カスタム時刻オブジェクト {startH,startM,endH,endM}
function getPlanShiftKey(ds){
  const d=getDaily(ds);
  if(d.planShift&&typeof d.planShift==='object') return d.planShift.startH<12?"s1":"s2"; // カスタムは時間帯で近似
  if(d.planShift!=null) return d.planShift;
  return getPatternShift(ds);
}
// 予定(左)に描くシフトブロック（キー or カスタム時刻に対応）。休み/なしは null
function getPlanShiftBlock(ds){
  const d=getDaily(ds);
  const ps=d.planShift;
  let b=null;
  if(ps&&typeof ps==='object'&&ps.startH!=null){

// ─── Open-Meteo 天気取得 ──────────────────────────
async function fetchWeatherAPI(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast`
    + `?latitude=${lat}&longitude=${lon}`
    + `&hourly=temperature_2m,relative_humidity_2m,surface_pressure,weather_code`
    + `&timezone=Asia%2FTokyo&forecast_days=1`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  const h = data.hourly;
  const today = todayStr();
  const humidity = h.relative_humidity_2m || h.relativehumidity_2m || [];
  const wcode    = h.weather_code || h.weathercode || [];
  return h.time.map((t,i) => ({
    hour:        new Date(t).getHours(),
    date:        t.slice(0,10),
    temp:        h.temperature_2m[i]   != null ? Math.round(h.temperature_2m[i]*10)/10   : null,
    humidity:    humidity[i]            != null ? humidity[i]                              : null,
    pressure:    h.surface_pressure[i] != null ? Math.round(h.surface_pressure[i]*10)/10 : null,
    weatherCode: wcode[i]              != null ? wcode[i]                                 : null,
  })).filter(r => r.date === today);
}

// アルコール計算
// ═══════════════════════════════════════════════════
const pureAlcohol = (ml,pct) => ml*(pct/100)*0.8;
const resolveDT = d => (d.drinkType?.pct ? d.drinkType : DRINK_TYPES.find(t=>t.id===d.id)||DRINK_TYPES[0]);

function calcBAC(drinks, wKg, sex, nowMin){
  const r = sex==="f"?0.55:0.68;
  const active=(drinks||[]).filter(d=>d && d.startMin!=null && d.alcoholG>0);
  if(!active.length) return 0;
  const start=Math.min(...active.map(d=>d.startMin));
  if(nowMin<=start) return 0;
  // 吸収済みアルコールによるBAC（消去前・単調増加）。各杯は開始→終了+15分で線形に吸収。
  const absorbed=t=>active.reduce((s,d)=>{
    if(t<d.startMin) return s;
    const peak=d.alcoholG/(wKg*r);
    const done=d.endMin+15;
    const frac=t<=done?Math.min(1,(t-d.startMin)/Math.max(1,done-d.startMin)):1;
    return s+peak*frac;
  },0);
  // 消去は0次（体内総量に対して一定速度 β≈0.15‰/時）。複数杯でも合算に対して一定速度で減る。
  // 体内にアルコールがある間だけ進むよう、0を下回らないように時間刻みで積分する。
  const beta=0.15/60; // ‰/分
  const STEP=5;
  let bac=0, prevAbs=0, t=start;
  while(t<nowMin){
    const nt=Math.min(nowMin,t+STEP);
    const abs=absorbed(nt);
    bac=Math.max(0, bac + Math.max(0,abs-prevAbs) - beta*(nt-t));
    prevAbs=abs; t=nt;
  }
  return bac;
}

    else { // 初回のみ例を1件だけ用意（削除しても再追加されない）
      state.ifThenPlans=[{id:Date.now(),cue:"帰宅後に飲みたくなったら",action:"まず炭酸水を1杯飲む",weekdays:[5],afterH:18,active:true}];
      try{localStorage.setItem(STORAGE_KEY+"_ifthen",JSON.stringify(state.ifThenPlans));}catch{}
    }
    // 旧形式（v8.3 events/taskList/wishList/shopList）からの一度きり移行
    if(!sc && !tk){ migrateOldSchedule(); }
  }catch{}
  if(!state.tasks||typeof state.tasks!=="object")state.tasks={todo:[],shopping:[]};
  if(!Array.isArray(state.tasks.todo))state.tasks.todo=[];
  if(!Array.isArray(state.tasks.shopping))state.tasks.shopping=[];
  if(!state.schedule||typeof state.schedule!=="object")state.schedule={};
  if(!Array.isArray(state.repeatEvents))state.repeatEvents=[];
}

// 旧「予定」タブ（v8.3）のデータを新モデルへ移行
function migrateOldSchedule(){
  let migrated=false;
  // 単発予定: events{ds:[{uid,title,sH,sM,eH,eM}]} → schedule{ds:[{...startH,startM,endH,endM,color}]}
  if(state.events && Object.keys(state.events).length){
    Object.keys(state.events).forEach(ds=>{
      state.schedule[ds]=(state.events[ds]||[]).map(e=>({
        uid:e.uid, title:e.title,
        startH:e.sH, startM:e.sM||0, endH:e.eH, endM:e.eM||0,
        color:"#38bdf8"
      }));
    });
    migrated=true;
  }
  // やること＋やりたいこと を統合して tasks.todo（優先度フラグ付き）へ
  const todo=[];
  (state.taskList||[]).forEach(t=>todo.push({uid:t.uid,text:t.text,done:!!t.done,imp:false,urg:false}));
  (state.wishList||[]).forEach(t=>todo.push({uid:t.uid,text:t.text,done:!!t.done,imp:false,urg:false}));
  if(todo.length){state.tasks.todo=todo;migrated=true;}
  // 買物
  if((state.shopList||[]).length){
    state.tasks.shopping=(state.shopList||[]).map(t=>({uid:t.uid,text:t.text,done:!!t.done}));
    migrated=true;
  }
  if(migrated){
    try{
      localStorage.setItem(STORAGE_KEY+"_schedule",JSON.stringify(state.schedule));
      localStorage.setItem(STORAGE_KEY+"_repeat",JSON.stringify(state.repeatEvents));
      localStorage.setItem(STORAGE_KEY+"_tasks",JSON.stringify(state.tasks));
    }catch{}
  }
}
// ── 保存の共通ヘルパー（失敗を検知してユーザーに通知）──
// localStorage への書き込みが失敗（容量超過・プライベートモード等）した場合、
// 従来は catch{} で握りつぶしていたため、データが保存されていないことに
// ユーザーが気づけなかった。safeSet は失敗を検知して警告し、成否を返す。
let saveFailNotified=false;
function safeSet(key,value){
  // バックアップ閲覧中は一切保存しない（現在のデータを守る）
  if(typeof state!=='undefined' && state && state.viewingBackup) return true;
  try{
    localStorage.setItem(key,value);
    return true;
  }catch(e){
    // 容量超過の可能性が高い → アーカイブ用モーダルを開く
    const quota = e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014);
    if(!saveFailNotified){
      saveFailNotified=true;
      showToast(quota?"⚠️ 保存できません（容量不足）":"⚠️ データを保存できませんでした","#ef4444");
      // 少し待ってから再通知できるように（連続表示を防ぐ）
      setTimeout(()=>{saveFailNotified=false;},4000);
    }
    if(quota){ state.storageAlert=true; }
    return false;
  }
}
// logs+dailies はデータ量が大きいため、書き込み（JSON化＋localStorage）を
// 500msデバウンス。状態はメモリ上で即時反映され、実書き込みだけまとめる。
// タブ非表示/離脱時（pagehide・visibilitychange:hidden）に必ずflushして取りこぼしを防ぐ。
let _saveTimer=null, _savePending=false;
function flushStorage(){
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer=null; }
  if(!_savePending) return true;
  _savePending=false;
  return safeSet(STORAGE_KEY,JSON.stringify({logs:state.logs,dailies:state.dailies}));
}
function saveStorage(){
  if(state && state.viewingBackup){ render(); return; } // 閲覧中は保存しない
  _savePending=true;
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{ if(!flushStorage()) render(); }, 500);
  state.saved=true; render(); setTimeout(()=>{state.saved=false;render();},1500);
}

function getDaily(dateStr){

  nl.push({dateStr,hour,...data});

}

// ═══════════════════════════════════════════════════
// HTML生成ヘルパー
// ═══════════════════════════════════════════════════
function h(tag,attrs,children){
  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null)continue;
    if(k==='style'&&typeof v==='object'){Object.assign(el.style,v);}
    else if(k.startsWith('on')&&typeof v==='function'){el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==='className'){el.className=v;}
    else{el.setAttribute(k,String(v));}
  }
  const flat=[].concat(children||[]).flat(Infinity);
  for(const c of flat){
    if(c==null||c===false||c===undefined)continue;
    if(typeof c==='string'||typeof c==='number'){
      el.appendChild(document.createTextNode(String(c)));
    } else if(c instanceof Node){
      el.appendChild(c);
    }
    // それ以外（boolean等）は無視
  }
  return el;
}
function div(attrs,children){return h('div',attrs,children);}
function btn(attrs,children){return h('button',attrs,children);}
function span(attrs,children){return h('span',attrs,children);}
function txt(s){return document.createTextNode(String(s??''));}
// 時刻入力（時計タイプ <input type=time>）。h:m を表示し、変更時 onSet(H,M) を呼ぶ。
function clockField(h, m, onSet, extraCss){
  const i=document.createElement('input'); i.type='time';
  i.value=`${String(h==null?0:h).padStart(2,'0')}:${String(m||0).padStart(2,'0')}`;
  i.style.cssText="flex:1;min-width:0;padding:8px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:15px;color-scheme:dark;font-family:inherit;box-sizing:border-box;"+(extraCss||"");
  i.addEventListener('change',e=>{const q=(e.target.value||'').split(':');const H=Number(q[0]),M=Number(q[1]);if(!isNaN(H)&&!isNaN(M))onSet(H,M);});
  return i;
}
// 勤務時刻用（10進の時＝7.5等／空欄＝null）。時計タイプ。
function workTimeField(val, setter){
  const i=document.createElement('input'); i.type='time';
  i.value=(val==null)?"":`${String(Math.floor(val)).padStart(2,'0')}:${String(Math.round((val-Math.floor(val))*60)).padStart(2,'0')}`;
  i.style.cssText="width:100%;padding:7px 6px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;color-scheme:dark;font-family:inherit;box-sizing:border-box";
  i.addEventListener('change',e=>{ const v=e.target.value; if(!v){setter(null);return;} const q=v.split(':'); const H=Number(q[0]),M=Number(q[1]); if(!isNaN(H)&&!isNaN(M)) setter(H+M/60); });
  return i;
}

// ═══════════════════════════════════════════════════
// BACグラフ（Canvas）
// ═══════════════════════════════════════════════════
function renderBACChart(drinks, showCurrent, nowMinPassed){
  const H=140;
  const PX_PER_MIN=4;
  const YW=36; // 縦軸幅

  if(!drinks.length){
    const canvas=document.createElement('canvas');
    const W=Math.min(window.innerWidth-32,560);
    canvas.width=W;canvas.height=H;
    canvas.style.cssText=`width:100%;height:${H}px;display:block;background:#0a1120;border-radius:8px;`;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#475569';ctx.font='13px system-ui';ctx.textAlign='center';
    ctx.fillText('飲み物を追加するとグラフが表示されます',W/2,H/2);
    return canvas;
  }

  const nowMin=nowMinPassed;
  const dd=drinks.map(d=>{
    let startMin=d.hour*60+(d.min||0);
    if(d.startNextDay) startMin+=1440;
    let endMin=d.endHour!=null?d.endHour*60+(d.endMin||0):startMin+20;
    if(d.startNextDay && d.endHour!=null) endMin+=1440;
    // 終了が開始より前は+24h補正
    if(endMin<startMin) endMin+=1440;
    return {uid:d.uid, startMin, endMin, alcoholG:pureAlcohol(d.ml,d.drinkType.pct)};
  });
  const firstMin=Math.min(...dd.map(d=>d.startMin));
  const lastDrinkEnd=Math.max(...dd.map(d=>d.endMin||d.startMin+60));
  const refMin=showCurrent?Math.max(nowMin,lastDrinkEnd):lastDrinkEnd;
  const chartStart=Math.max(0,Math.min(firstMin,showCurrent?nowMin:firstMin)-60);
  let chartEnd=chartStart+8*60;
  for(let t=firstMin;t<=firstMin+14*60;t+=10){
    if(userBAC(dd,t)<=0.02){chartEnd=t+60;break;}
  }
  chartEnd=Math.max(chartEnd,refMin+120);
  const totalMin=chartEnd-chartStart;

  const curBac=showCurrent?userBAC(dd,nowMin):0;
  const maxBac=Math.max(0.3,...Array.from({length:50},(_,i)=>userBAC(dd,chartStart+totalMin*(i/49))));

  const PT=14,PB=24,cH=H-PT-PB;
  const yS=b=>PT+cH-(b/maxBac)*cH;
  const yLevels=[0.2,0.5,0.8,1.0].filter(v=>v<=maxBac+0.05);

  // ── 縦軸Canvas（固定）──
  const yCanvas=document.createElement('canvas');
  yCanvas.width=YW;yCanvas.height=H;
  yCanvas.style.cssText=`display:block;flex-shrink:0;height:${H}px;background:#0a1120;`;
  const yCtx=yCanvas.getContext('2d');
  yCtx.fillStyle='#0a1120';yCtx.fillRect(0,0,YW,H);
  yLevels.forEach(v=>{
    yCtx.fillStyle=v>=0.8?'#ef4444':'#64748b';
    yCtx.font='9px system-ui';yCtx.textAlign='right';
    yCtx.fillText(v.toFixed(1),YW-4,yS(v)+3);
    yCtx.strokeStyle='#334155';yCtx.lineWidth=1;
    yCtx.beginPath();yCtx.moveTo(YW-2,yS(v));yCtx.lineTo(YW,yS(v));yCtx.stroke();
  });
  // 縦軸ライン
  yCtx.strokeStyle='#334155';yCtx.lineWidth=1;
  yCtx.beginPath();yCtx.moveTo(YW-1,PT);yCtx.lineTo(YW-1,PT+cH);yCtx.stroke();
  // hPaラベル
  yCtx.fillStyle='#334155';yCtx.font='8px system-ui';yCtx.textAlign='right';
  yCtx.fillText('‰',YW-4,PT-3);

  // ── グラフCanvas（スクロール）──
  const GW=Math.max(Math.min(window.innerWidth-32-YW,560-YW), totalMin*PX_PER_MIN+8);
  const PR=8;
  const cW=GW-PR;
  const xG=t=>((t-chartStart)/totalMin)*cW;

  const canvas=document.createElement('canvas');
  canvas.width=GW;canvas.height=H;
  canvas.style.cssText=`display:block;height:${H}px;`;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0a1120';ctx.fillRect(0,0,GW,H);

  // グリッド横線
  yLevels.forEach(v=>{
    ctx.strokeStyle=v>=0.8?'#ef444455':'#1e3a5f88';
    ctx.lineWidth=v>=0.8?1.2:0.6;
    ctx.setLineDash(v>=0.8?[5,3]:[3,6]);
    ctx.beginPath();ctx.moveTo(0,yS(v));ctx.lineTo(cW,yS(v));ctx.stroke();
    ctx.setLineDash([]);
  });

  // エリア
  const STEPS=100;
  ctx.beginPath();
  ctx.moveTo(xG(chartStart),yS(0));
  for(let i=0;i<=STEPS;i++){
    const t=chartStart+totalMin*(i/STEPS);
    ctx.lineTo(xG(t),yS(userBAC(dd,t)));
  }
  ctx.lineTo(xG(chartEnd),yS(0));ctx.closePath();
  const grad=ctx.createLinearGradient(0,PT,0,PT+cH);
  grad.addColorStop(0,'rgba(249,115,22,0.5)');grad.addColorStop(1,'rgba(249,115,22,0.02)');
  ctx.fillStyle=grad;ctx.fill();

  // ライン
  ctx.strokeStyle='#f97316';ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.beginPath();
  for(let i=0;i<=STEPS;i++){
    const t=chartStart+totalMin*(i/STEPS);
    i===0?ctx.moveTo(xG(t),yS(userBAC(dd,t))):ctx.lineTo(xG(t),yS(userBAC(dd,t)));
  }
  ctx.stroke();

  // 飲み始め/終わりマーカー
  dd.forEach((d,i)=>{
    ctx.fillStyle='#eab308';
    ctx.beginPath();ctx.arc(xG(d.startMin),PT+cH-5,4,0,Math.PI*2);ctx.fill();
    if(drinks[i]?.endHour!=null){
      ctx.strokeStyle='#a78bfa';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.moveTo(xG(d.endMin),PT);ctx.lineTo(xG(d.endMin),PT+cH);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#a78bfa';
      ctx.beginPath();ctx.arc(xG(d.endMin),PT+cH-5,4,0,Math.PI*2);ctx.fill();
    }
  });

  // NOW（現在BAC表示時のみ）
  if(showCurrent&&nowMin>=chartStart&&nowMin<=chartEnd){
    const nx=xG(nowMin),ny=yS(curBac);
    ctx.strokeStyle='#38bdf8';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(nx,PT);ctx.lineTo(nx,PT+cH);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(56,189,248,0.2)';ctx.beginPath();ctx.arc(nx,ny,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(nx,ny,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#38bdf8';ctx.font='bold 9px system-ui';ctx.textAlign='left';ctx.fillText('NOW',nx+7,PT+12);
  }

  // X軸ラベル
  const step=totalMin<=300?30:60;
  ctx.fillStyle='#64748b';ctx.font='9px system-ui';ctx.textAlign='center';
  for(let t=Math.ceil(chartStart/step)*step;t<=chartEnd;t+=step){
    ctx.fillText(`${Math.floor(t/60)%24}:${String(t%60).padStart(2,'0')}`,xG(t),H-5);
  }

  // X軸ライン
  ctx.strokeStyle='#334155';ctx.lineWidth=1;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(0,PT+cH);ctx.lineTo(cW,PT+cH);ctx.stroke();

  // スクロールコンテナ
  const scrollWrap=document.createElement('div');
  scrollWrap.style.cssText=`overflow-x:scroll;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;flex:1;background:#0a1120;`;
  scrollWrap.appendChild(canvas);

  // 縦軸＋スクロールを横並びに
  const container=document.createElement('div');
  container.style.cssText=`display:flex;background:#0a1120;border-radius:8px;overflow:hidden;`;
  container.appendChild(yCanvas);
  container.appendChild(scrollWrap);

  if(showCurrent){
    requestAnimationFrame(()=>{
      const nx=xG(nowMin);
      scrollWrap.scrollLeft=Math.max(0,nx-scrollWrap.clientWidth/2);
    });
  }

  return container;
}

  const _sameView=_vkey===render._lastVKey; render._lastVKey=_vkey;
  if(_sameView && _prevScroll>0) requestAnimationFrame(()=>{ try{ if(Math.abs(window.scrollY-_prevScroll)>1) window.scrollTo(0,_prevScroll); }catch(_){} });

  // ヘッダーは初回のみ生成（再描画しない）
  if(!headerMounted){
    root.appendChild(renderHeader());

function updateHeaderDynamic(){
  const ds=todayStr(), vd=state.viewDate;

  const showNav=true;

  // 保存ステータス

  if(savedEl) savedEl.style.visibility=state.saved?'visible':'hidden';

  // 日付ナビ
  const nav=document.getElementById('hdr-nav');
  if(nav){
    nav.style.display=showNav?'flex':'none';

    const dateText=document.getElementById('hdr-date-text');

      const p=vd.split('-');
      dateText.textContent=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])).toLocaleDateString("ja-JP",{month:"short",day:"numeric",weekday:"short"});
    }
    if(dateBtn){dateBtn.style.color=isToday?"#38bdf8":"#e2e8f0";}
    const nextBtn=document.getElementById('hdr-next-btn');
    if(nextBtn){nextBtn.style.color="#94a3b8";}
  }

  // タブ
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===state.tab);
  });
  // 設定ボタンのアクティブ表示
  const setBtn=document.getElementById('hdr-settings-btn');
  if(setBtn){const a=state.tab==='設定';setBtn.style.border='1px solid '+(a?'#38bdf8':'#334155');setBtn.style.background=a?'#0ea5e922':'transparent';setBtn.style.color=a?'#38bdf8':'#94a3b8';}
}

// ── ヘッダー ──────────────────────────────────────
function renderHeader(){
  const ds=todayStr(), vd=state.viewDate, isToday=vd===ds;
  const showNav=true;

  // 保存表示（フローに影響しないよう日付ナビ行の右端に絶対配置。
  //  以前はタイトル右に置いていたため、出現時に設定/今日ボタンが2行に折り返していた。
  //  visibility切替なのでレイアウトは一切動かない）
  const savedSpan=document.createElement('span');
  savedSpan.id='hdr-saved';
  savedSpan.style.cssText="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:#22c55e;white-space:nowrap;pointer-events:none;visibility:"+(state.saved?'visible':'hidden');
  savedSpan.textContent="✓ 保存";

  // 日付ラベル（タップで日付選択ジャンプ）
  const p=vd.split('-');
  const dObj=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  const dateBtn=document.createElement('button');
  dateBtn.id='hdr-date-label';
  dateBtn.style.cssText=`display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:${isToday?"#38bdf8":"#e2e8f0"};background:transparent;border:none;cursor:pointer;font-family:inherit;padding:5px 8px;border-radius:8px`;
  const dateText=document.createElement('span');
  dateText.id='hdr-date-text';
  dateText.textContent=dObj.toLocaleDateString("ja-JP",{month:"short",day:"numeric",weekday:"short"});
  dateBtn.innerHTML='<span style="font-size:13px">📅</span>';
  dateBtn.appendChild(dateText);

  // 隠し date input（タップで日付ジャンプ）
  const dateInput=document.createElement('input');
  dateInput.type='date'; dateInput.value=vd;
  dateInput.style.cssText="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
  dateInput.addEventListener('change',e=>{ if(e.target.value){state.viewDate=e.target.value;render();} });
  dateBtn.addEventListener('click',()=>{ if(dateInput.showPicker){try{dateInput.showPicker();return;}catch(_){}} dateInput.focus();dateInput.click(); });

  // 前後移動（大きめのタップ領域）
  const mkArrow=(label,id,fn)=>{const b=document.createElement('button');if(id)b.id=id;b.textContent=label;b.style.cssText="background:#0f172a;border:1px solid #334155;border-radius:9px;color:#94a3b8;cursor:pointer;font-size:18px;padding:6px 15px;line-height:1;font-family:inherit;flex-shrink:0";b.addEventListener('click',fn);return b;};
  const prevBtn=mkArrow("‹",null,prevDate);
  const nextBtn=mkArrow("›","hdr-next-btn",nextDate);

  // ナビ行：中央=‹ 日付 › を中央固定（今日は日付の色で判別できるため「今日へ」ボタンは廃止）
  const nav=document.createElement('div');
  nav.id='hdr-nav';
  nav.style.cssText="display:"+(showNav?"flex":"none")+";position:relative;align-items:center;justify-content:center;padding:8px 0 12px";
  nav.appendChild(dateInput); // 不可視
  const centerGroup=document.createElement('div');
  centerGroup.style.cssText="display:flex;align-items:center;justify-content:center;gap:8px";
  centerGroup.appendChild(prevBtn); centerGroup.appendChild(dateBtn); centerGroup.appendChild(nextBtn);
  nav.appendChild(centerGroup);
  nav.appendChild(savedSpan); // 右端に絶対配置（navはposition:relative）

  // タブバー（日付ナビとの境界を明確にする）
  const tabBar=document.createElement('div');
  tabBar.className='tab-bar';
  tabBar.style.cssText="border-top:1px solid #1e3a5f";
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(state.tab===t?' active':'');
    b.dataset.tab=t;
    b.textContent=t;
    b.addEventListener('click',()=>{
      state.tab=t; state.widget=false;
      // 日記タブに切り替えたとき、今日かつ天気未取得なら自動取得
      if(t==="日記" && !state.viewingBackup && state.viewDate===todayStr() && state.weatherCity && state.weather.length===0 && !state.weatherLoading){
        doFetchWeather(state.weatherCity);
      } else {
        render();
      }
    });
    tabBar.appendChild(b);
  });

  const inner=document.createElement('div');
  inner.style.cssText="max-width:600px;margin:0 auto";

  // タイトル行
  const titleRow=document.createElement('div');
  titleRow.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px";
  const titleLeft=document.createElement('div');
  titleLeft.style.cssText="display:flex;align-items:center;gap:8px";
  titleLeft.innerHTML='<span>🩺</span><h1 style="margin:0;font-size:17px;font-weight:700;color:#e2e8f0">体調管理</h1><span style="font-size:11px;color:#38bdf8;margin-left:6px;font-weight:600;background:#0ea5e922;padding:2px 7px;border-radius:10px;border:1px solid #0ea5e944">v'+APP_VERSION+'</span>';
  // 設定ボタン（バージョンの隣）
  const setBtn=document.createElement('button');
  setBtn.id='hdr-settings-btn';
  setBtn.textContent='⚙ 設定';
  const _sa=state.tab==='設定';
  setBtn.style.cssText=`margin-left:2px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;cursor:pointer;font-family:inherit;border:1px solid ${_sa?'#38bdf8':'#334155'};background:${_sa?'#0ea5e922':'transparent'};color:${_sa?'#38bdf8':'#94a3b8'}`;
  setBtn.addEventListener('click',()=>{state.tab='設定';state.widget=false;render();});
  titleLeft.appendChild(setBtn);
  // ウィジェット（今日の予定＋ルーティン）ボタン
  const wgBtn=document.createElement('button');
  wgBtn.textContent='📌 今日';
  const _wa=!!state.widget;
  wgBtn.style.cssText=`margin-left:2px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;cursor:pointer;font-family:inherit;border:1px solid ${_wa?'#a78bfa':'#334155'};background:${_wa?'#a78bfa22':'transparent'};color:${_wa?'#a78bfa':'#94a3b8'}`;
  wgBtn.addEventListener('click',()=>{ state.viewDate=todayStr(); state.widget=true; render(); });
  titleLeft.appendChild(wgBtn);
  const titleRight=document.createElement('div');
  titleRight.style.cssText="display:flex;align-items:center;gap:5px";
  const timeSpan=document.createElement('span');
  timeSpan.style.cssText="font-size:11px;color:#64748b";
  timeSpan.textContent=`${new Date().getHours()}時`;
  titleRight.appendChild(timeSpan);
  titleRow.appendChild(titleLeft); titleRow.appendChild(titleRight);

  inner.appendChild(titleRow);
  inner.appendChild(nav);
  inner.appendChild(tabBar);

  const hdr=document.createElement('div');
  hdr.id='app-header';
  hdr.style.cssText="background:#1e293b;border-bottom:1px solid #1e3a5f;padding:12px 16px 0;position:sticky;top:0;z-index:100";
  hdr.appendChild(inner);
  return hdr;
}

function prevDate(){
  const parts=state.viewDate.split('-');
  const n=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  n.setDate(n.getDate()-1);
  state.viewDate=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  render();
}
function nextDate(){
  const parts=state.viewDate.split('-');
  const n=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  n.setDate(n.getDate()+1);
  state.viewDate=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  render();
}

// ── ウィジェット（今日の予定＋ルーティンをまとめて素早く確認・チェック）──
// URLハッシュ #widget で直接起動でき、ホーム画面ショートカットから開ける。
function renderWidgetView(vd,ds){
  const wrap=div({style:{maxWidth:"600px",margin:"0 auto",padding:"10px 14px 60px"}});
  const dObj=parseDS(vd);
  const shiftK=getPlanShiftKey(vd), sh=shiftK?SHIFT_TYPES[shiftK]:null;

  // ヘッダー
  const head=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
  head.appendChild(div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px"}},[
    div({},[
      div({style:{fontSize:"16px",fontWeight:800,color:"#e2e8f0"}},`📌 今日`),
      div({style:{fontSize:"12px",color:"#64748b",marginTop:"2px"}},dObj.toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"}))
    ]),
    div({style:{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap",justifyContent:"flex-end"}},[
      sh?div({style:{fontSize:"12px",fontWeight:700,color:sh.color,background:sh.color+"22",border:`1px solid ${sh.color}55`,borderRadius:"10px",padding:"4px 12px"}},`💼 ${sh.label}`):null,
      soberBadge()
    ])
  ]));
  wrap.appendChild(head);

  // ── 今日の予定 ──
  const schedCard=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
  schedCard.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#38bdf8",marginBottom:"8px"}},"📅 今日の予定"));
  const items=[];
  getEventsForDate(vd).forEach(e=>{
    if(e.allDay){ items.push({allDay:true,title:e.title,color:e.color||EV_COLORS[0]}); }
    else { items.push({s:e.startH*60+(e.startM||0),sh:e.startH,sm:e.startM||0,eh:e.endH,em:e.endM||0,title:e.title,color:e.color||EV_COLORS[0]}); }
  });
  getPlannedExtras(vd).forEach(x=>{
    if(x.customTodo && (state.todos[vd]||{})[x.ctUid]?.checked) return; // チェック済みルーティンは非表示
    items.push({s:x.startH*60+(x.startM||0),sh:x.startH,sm:x.startM||0,eh:x.endH,em:x.endM||0,title:x.title,color:x.color||"#38bdf8"});
  });
  // 今の時間の予定（進行中）＋次の予定2件だけに絞る（終日は常に表示）
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const allDayItems=items.filter(it=>it.allDay);
  const timed=items.filter(it=>!it.allDay).sort((a,b)=>a.s-b.s);
  const ongoing=timed.filter(it=>{const e=it.eh*60+(it.em||0); return it.s<=nowMin && e>nowMin;}).map(it=>({...it,now:true}));
  const upcoming=timed.filter(it=>it.s>nowMin).slice(0,2);
  const shown=[...allDayItems, ...ongoing, ...upcoming];
  if(shown.length===0){
    schedCard.appendChild(div({style:{fontSize:"12px",color:"#475569",textAlign:"center",padding:"8px 0"}},"これからの予定はありません"));
  } else {
    shown.forEach(it=>{
      const row=div({style:{display:"flex",alignItems:"center",gap:"9px",padding:"6px 0",borderBottom:"1px solid #1e3a5f55"}});
      row.appendChild(div({style:{width:"4px",alignSelf:"stretch",background:it.color,borderRadius:"2px",flexShrink:0}}));
      row.appendChild(div({style:{fontSize:"11px",color:it.now?"#38bdf8":"#94a3b8",width:"92px",flexShrink:0,fontVariantNumeric:"tabular-nums",fontWeight:it.now?700:400}},
        it.allDay?"終日":`${it.now?"● ":""}${hhmm(it.sh,it.sm)}〜${hhmm(it.eh,it.em)}`));
      row.appendChild(div({style:{flex:1,fontSize:"13px",color:"#e2e8f0",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},it.title));
      schedCard.appendChild(row);
    });
  }
  const openSched=btn({style:{width:"100%",marginTop:"8px",padding:"7px",background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#64748b",cursor:"pointer",fontSize:"11px"}},"予定タブを開く →");
  openSched.addEventListener('click',()=>{ exitWidget(); state.tab="予定"; state.scheduleSubTab="日"; render(); });
  schedCard.appendChild(openSched);
  wrap.appendChild(schedCard);

  // ── クイック記録（体調・アルコール・食べたもの・射精）──
  {
    const d=getDaily(vd);
    const curH=new Date().getHours();
    const nowScore=(getLog(vd,curH)||{}).score;
    const foodN=(d.foods||[]).length, ejN=(d.ejaculations||[]).length, drN=(d.drinks||[]).length;
    const c=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
    const grid=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}});
    const qbtn=(label,border,bg,color,onClick)=>{const b=btn({style:{padding:"11px",borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:600,border:`1px solid ${border}`,background:bg,color}},label);b.addEventListener('click',onClick);return b;};
    grid.appendChild(qbtn(`💗 体調（今）${nowScore!=null?`：${nowScore}`:""}`,"#f43f5e","#f43f5e18","#fb7185",()=>{ openScoreModal(vd,curH); }));
    grid.appendChild(qbtn(`🍺 アルコール${drN?`（${drN}）`:""}`,"#f59e0b","#f59e0b18","#fbbf24",()=>{ const now=new Date(); state.modal="addDrink"; state.newDrink={typeId:"beer",ml:350,hour:now.getHours(),min:now.getMinutes(),pct:5,startNextDay:false}; render(); }));
    grid.appendChild(qbtn(`🍽️ 食べたもの${foodN?`（${foodN}）`:""}`,"#0ea5e9","#0ea5e918","#38bdf8",()=>{ state.modal="food"; state.foodSelected=[...(d.foods||[])]; state.foodOpenCat=null; render(); }));
    grid.appendChild(qbtn(`💧 射精${ejN?`（${ejN}）`:""}`,"#6366f1","#6366f118","#a5b4fc",()=>{ state.modal="addEjac"; state.newEjacH=new Date().getHours(); state.newEjacM=new Date().getMinutes(); state.newEjacTag=null; state.newEjacNextDay=false; render(); }));
    c.appendChild(grid);
    wrap.appendChild(c);
  }

  // ── 🔀 if-thenプラン（今の状況に該当するものだけ強調表示）──
  if(vd===todayStr()){
    const active=getIfThenPlans().filter(ifThenActiveNow);
    if(active.length){
      const c=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px",border:"1px solid #f59e0b66",background:"#f59e0b12"}});
      c.appendChild(div({style:{fontSize:"12px",fontWeight:700,color:"#fbbf24",marginBottom:"6px"}},"🔀 今のあなたのプラン"));
      active.forEach(p=>{
        c.appendChild(div({style:{fontSize:"13px",color:"#e2e8f0",lineHeight:1.5,padding:"4px 0"}},[
          txt(p.cue||""),
          span({style:{color:"#f59e0b",fontWeight:700}}," → "),
          span({style:{fontWeight:700}},p.action||"")
        ]));
      });
      wrap.appendChild(c);
    }
  }

  // ── 💰 未来投資（回数＋節約額・チップでその場記録）──
  {
    const c=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
    c.appendChild(div({style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"8px"}},[
      div({style:{fontSize:"13px",fontWeight:700,color:"#22c55e"}},`💰 未来投資 今日${investCountOn(vd)}回`),
      div({style:{fontSize:"11px",color:"#64748b"}},`本日 ¥${investAmountOn(vd).toLocaleString()}／🏦貯金 ¥${investBalance().toLocaleString()}`)
    ]));
    const chipRow=div({style:{display:"flex",flexWrap:"wrap",gap:"6px"}});
    getInvestActions().slice(0,6).forEach(a=>{
      const b=btn({style:{padding:"6px 9px",borderRadius:"13px",border:"1px solid #334155",background:"#0f172a",color:"#cbd5e1",fontSize:"11px",cursor:"pointer",fontFamily:"inherit"}},
        a.amount>0?`${a.label} +¥${a.amount}`:a.label);
      b.addEventListener('click',()=>{ logInvest(vd,a); showToast(`💰 ${a.label}${a.amount>0?` +¥${a.amount}`:""}`); render(); });
      chipRow.appendChild(b);
    });
    c.appendChild(chipRow);
    const openInv=btn({style:{width:"100%",marginTop:"8px",padding:"7px",background:"transparent",border:"1px solid #334155",borderRadius:"7px",color:"#64748b",cursor:"pointer",fontSize:"11px"}},"未来投資をすべて見る →");
    openInv.addEventListener('click',()=>{ exitWidget(); state.tab="達成"; state.achieveSubTab="未来投資"; render(); });
    c.appendChild(openInv);
    wrap.appendChild(c);
  }

  // チェック行の共通生成
  const checkRow=(done,label,sub,onToggle)=>{
    const row=div({style:{display:"flex",alignItems:"center",gap:"10px",padding:"7px 0",borderBottom:"1px solid #1e3a5f55"}});
    const cb=btn({style:{width:"24px",height:"24px",borderRadius:"6px",flexShrink:0,border:`2px solid ${done?"#22c55e":"#334155"}`,background:done?"#22c55e":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",color:"#fff"}},done?"✓":"");
    cb.addEventListener('click',onToggle);
    row.appendChild(cb);
    row.appendChild(div({style:{flex:1,minWidth:0}},[
      div({style:{fontSize:"13px",color:done?"#475569":"#e2e8f0",textDecoration:done?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},label),
      sub?div({style:{fontSize:"10px",color:"#64748b"}},sub):null
    ]));
    return row;
  };

  // ── 🎁 ご褒美（連続日数・定期ルーティン・目標でアンロック・ヴィジェットでは閲覧のみ）──
  if((state.rewards||[]).length){
    const streak=currentOverallStreak().streak;
    const c=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
    c.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#f472b6",marginBottom:"6px"}},`🎁 ご褒美（連続${streak}日）`));
    (state.rewards||[]).forEach(r=>{
      const st=rewardStatus(r);
      const row=div({style:{display:"flex",alignItems:"center",gap:"9px",padding:"6px 0",borderBottom:"1px solid #1e3a5f55"}});
      row.appendChild(div({style:{fontSize:"11px",fontWeight:700,color:st.unlocked?"#22c55e":"#64748b",width:"46px",flexShrink:0,textAlign:"center"}},st.badge));
      row.appendChild(div({style:{flex:1,minWidth:0}},[
        div({style:{fontSize:"13px",color:st.unlocked?"#e2e8f0":"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},r.text),
        div({style:{fontSize:"9px",color:"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},st.name?`条件: ${st.name}`:`連続${(r.trigger&&r.trigger.days)||r.days||7}日`)
      ]));
      row.appendChild(div({style:{fontSize:"10px",fontWeight:700,flexShrink:0,color:st.unlocked?"#22c55e":"#64748b"}},st.unlocked?"🎉達成":st.progress));
      c.appendChild(row);
    });
    wrap.appendChild(c);
  }

  // ── 今日の目標（目標ツリーで「日次」を設定した目標）──
  {
    const cur=gtCollectDaily(vd);
    const curIds=new Set(cur.map(n=>n.id));
    // 前日以前で未完了の単日目標も繰り越して表示（範囲目標は毎日出るため除外）
    const carry=gtCollectByPeriodCarry("daily", vd).carry.filter(n=>!isRangeDaily(n) && !curIds.has(n.id));
    // 直近の週間/月次などの目標の下にある「期日なし」の未達成目標（今やるべき具体目標）
    const pending=gtCollectPeriodlessActive(vd).filter(x=>!curIds.has(x.node.id));
    if(cur.length || carry.length || pending.length){
      const c=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
      const doneN=cur.filter(n=>dailyGoalDone(n,vd)).length;
      c.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#fbbf24",marginBottom:"6px"}},`☀️ 今日の目標 ${doneN}/${cur.length}${carry.length?`　+繰越${carry.length}`:""}${pending.length?`　+関連${pending.length}`:""}`));
      const goalPlanBtn=(n)=>{ const planB=btn({style:{flexShrink:0,fontSize:"12px",padding:"3px 9px",borderRadius:"6px",cursor:"pointer",fontWeight:600,border:"1px solid #0ea5e9",background:"#0ea5e918",color:"#38bdf8"}},"📅"); planB.addEventListener('click',(()=>{const node=n;return()=>{ openGoalAsEvent(node, vd); };})()); return planB; };
      const addRow=(n,carried)=>{
        const prog=gtProgress(n); const hasKids=n.children&&n.children.length;
        const done=dailyGoalDone(n,vd);
        const sub=[carried?`🔴 繰り越し（${pkShort(n.periodKey)}・未達成）`:null, hasKids?`下位 ${prog.done}/${prog.total}`:null, dailyRangeLabel(n)||null].filter(Boolean).join("　")||null;
        const rrow=checkRow(done,n.text||"(無題)",sub,()=>{ setDailyGoalDone(n,vd,!done); if(!done)showToast(`🎯 ${n.text||"目標"}`); render(); });
        rrow.appendChild(goalPlanBtn(n));
        c.appendChild(rrow);
      };
      carry.forEach(n=>addRow(n,true)); // 繰り越しを上に
      cur.forEach(n=>addRow(n,false));
      // 期日なしの関連目標（連動元の期間目標名を添える）
      pending.forEach(({node:n,anc})=>{
        const done=!!n.done;
        const sub=`📎 ${GT_PERIOD_LABELS[anc.periodType]||"期間"}「${anc.text||"目標"}」`;
        const rrow=checkRow(done,n.text||"(無題)",sub,()=>{ setGoalDone(n.id,!done); if(!done)showToast(`🎯 ${n.text||"目標"}`); render(); });
        rrow.appendChild(goalPlanBtn(n));
        c.appendChild(rrow);
      });
      wrap.appendChild(c);
    }
  }

  // ── 定期ルーティン（今日該当・チェック済みは非表示。前日以前で未実施の繰り越し分も表示）──
  const dueCustom=dueCustomTodos(vd).filter(ct=>!(state.todos[vd]||{})[ct.uid]?.excluded);
  const dueRemain=dueCustom.filter(ct=>!(state.todos[vd]||{})[ct.uid]?.checked);
  const _futW=vd>todayStr();
  const dueIdsW=new Set(dueCustom.map(ct=>ct.uid));
  // 繰り越し：過去に該当したが未実施のもの（予定タブと同じ判定）
  const carryCustom=_futW?[]:(state.customTodos||[]).filter(ct=>!dueIdsW.has(ct.uid)).map(ct=>({ct,occ:customTodoOccurrence(ct,vd)})).filter(x=>x.occ&&x.occ.overdue);
  const carryReal=carryCustom.filter(x=>!x.occ.snToday); // 繰越件数は開始翌日(当日扱い)を除く
  if(dueRemain.length || carryCustom.length){
    const c=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
    c.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#a78bfa",marginBottom:"6px"}},`🔁 定期ルーティン 残り${dueRemain.length}件${carryReal.length?`　+繰越${carryReal.length}`:""}`));
    // 繰り越し／開始翌日（当日やる分）を上に
    carryCustom.forEach(({ct,occ})=>{
      const lbl=((state.todos[occ.dueDate]||{})[ct.uid]||{}).labelOverride||ct.label||"定期ルーティン";
      const _snt=occ.snToday?customTodoTimeFor(ct,occ.dueDate):null;
      const sub=occ.snToday
        ? `🌙 開始翌日${_snt?`（${String(_snt.h).padStart(2,'0')}:${String(_snt.m||0).padStart(2,'0')}）`:""}`
        : `🔴 繰越${occ.daysAgo?`${occ.daysAgo}日前`:""}・未実施`;
      const rrow=checkRow(false,`🔁 ${lbl}`,sub,()=>{ dismissPastUnchecked(ct,vd); const cur=(state.todos[vd]||{})[ct.uid]||{}; setTodo(vd,ct.uid,{...cur,checked:true,time:new Date().toISOString()}); showToast(`✅ ${lbl}`); });
      const edit=btn({style:{flexShrink:0,fontSize:"12px",padding:"3px 9px",borderRadius:"6px",cursor:"pointer",fontWeight:600,border:"1px solid #334155",background:"transparent",color:"#94a3b8"}},"✏️");
      edit.addEventListener('click',(()=>{const uid=ct.uid,l=lbl,dd=occ.dueDate;return()=>{ state.planCustomTodo={uid,label:l,vd:dd,editMode:true}; state.modal="planCustomTodo"; render(); };})());
      rrow.appendChild(edit);
      c.appendChild(rrow);
    });
    dueRemain.forEach(ct=>{
      const rec=(state.todos[vd]||{})[ct.uid]||{};
      const lbl=rec.labelOverride||ct.label;
      const tt=customTodoTimeFor(ct,vd);
      const sub=`${tt?`${hhmm(tt.h,tt.m)}${tt.eh!=null?`〜${hhmm(tt.eh,tt.em)}`:""}`:""}${rec.noteOverride?`　📝${rec.noteOverride}`:""}`;
      const rrow=checkRow(false,lbl,sub,()=>{ setTodo(vd,ct.uid,{...rec,checked:true,time:new Date().toISOString()}); showToast(`✅ ${lbl}`); });
      // ✏️ この日だけの変更（この日のみ削除／時刻変更／内容変更）をヴィジェットからも開ける
      const edit=btn({style:{flexShrink:0,fontSize:"12px",padding:"3px 9px",borderRadius:"6px",cursor:"pointer",fontWeight:600,border:"1px solid #334155",background:"transparent",color:"#94a3b8"}},"✏️");
      edit.addEventListener('click',(()=>{const uid=ct.uid,l=lbl;return()=>{ state.planCustomTodo={uid,label:l,vd,editMode:true}; state.modal="planCustomTodo"; render(); };})());
      rrow.appendChild(edit);
      c.appendChild(rrow);
    });
    wrap.appendChild(c);
  }

  // ── ルーティン（デイリー・完了済みは非表示）──
  {
    const todo=getTodo(vd);
    const rItems=getOrderedTodoItems().filter(it=>!(todo[it.id]||{}).excluded);
    // 未完了、または実行中セッションがあるマルチ項目（内容を記入・停止できるよう表示を継続）
    const remain=rItems.filter(it=>!isTodoDone(vd,it) || (it.multi&&((todo[it.id]||{}).sessions||[]).some(s=>s.startTime&&!s.endTime)));
    if(remain.length){
    const c=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
    c.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#22c55e",marginBottom:"6px"}},`📋 ルーティン 残り${remain.length}件`));
    remain.forEach(item=>{
      const t=todo[item.id]||{}; const done=isTodoDone(vd,item);
      const activeSess=item.multi?(t.sessions||[]).find(s=>s.startTime&&!s.endTime):null;
      const displayDone=done&&!activeSess;
      if(item.type==="check"){
        c.appendChild(checkRow(done,item.label,null,()=>{ setTodo(vd,item.id,{checked:!t.checked,time:new Date().toISOString()}); if(!t.checked){showToast(`✅ ${item.label}`);setTimeout(maybeCelebrateStreak,100);} }));
      } else {
        // タイマー項目：▶ 開始 / ⏹ 終了（マルチは開始で1セッション）
        const row=div({style:{display:"flex",alignItems:"center",gap:"10px",padding:"7px 0",borderBottom:"1px solid #1e3a5f55"}});
        const running = item.multi ? (t.sessions||[]).some(s=>s.startTime&&!s.endTime) : (t.startTime&&!t.endTime);
        let b;
        if(item.multi){
          if(running){ b=btn({style:{padding:"3px 10px",background:"#f9731633",border:"1px solid #f97316",borderRadius:"6px",color:"#f97316",fontSize:"12px",cursor:"pointer",fontWeight:600,flexShrink:0}},"⏹");
            b.addEventListener('click',()=>{ const ss=[...(t.sessions||[])]; const i=ss.findIndex(s=>s.startTime&&!s.endTime); if(i>=0){ss[i]={...ss[i],endTime:new Date().toISOString()};} setTodo(vd,item.id,{...t,sessions:ss}); showToast(`✅ ${item.label}`); });
          } else { b=btn({style:{padding:"3px 10px",background:"#0ea5e933",border:"1px solid #0ea5e9",borderRadius:"6px",color:"#38bdf8",fontSize:"12px",cursor:"pointer",fontWeight:600,flexShrink:0}},"▶");
            b.addEventListener('click',()=>{ const ss=[...(t.sessions||[])]; ss.push({uid:Date.now(),startTime:new Date().toISOString()}); setTodo(vd,item.id,{...t,sessions:ss}); }); }
        } else {
          if(!t.startTime){ b=btn({style:{padding:"3px 10px",background:"#0ea5e933",border:"1px solid #0ea5e9",borderRadius:"6px",color:"#38bdf8",fontSize:"12px",cursor:"pointer",fontWeight:600,flexShrink:0}},"▶");
            b.addEventListener('click',()=>{ setTodo(vd,item.id,{startTime:new Date().toISOString()}); }); }
          else if(!t.endTime){ b=btn({style:{padding:"3px 10px",background:"#f9731633",border:"1px solid #f97316",borderRadius:"6px",color:"#f97316",fontSize:"12px",cursor:"pointer",fontWeight:600,flexShrink:0}},"⏹");
            b.addEventListener('click',()=>{ setTodo(vd,item.id,{...t,endTime:new Date().toISOString()}); showToast(`✅ ${item.label}`); }); }
          else { b=div({style:{width:"24px",height:"24px",borderRadius:"6px",flexShrink:0,border:"2px solid #22c55e",background:"#22c55e",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",color:"#fff"}},"✓"); }
        }
        row.appendChild(b);
        row.appendChild(div({style:{flex:1,fontSize:"13px",color:displayDone?"#475569":"#e2e8f0",textDecoration:displayDone?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}},item.label));
        c.appendChild(row);
        // 実行中セッションの「何をしますか？」記入欄（ヴィジェットでも表示・編集）
        if(activeSess){
          const noteInp=document.createElement('input');noteInp.type='text';
          noteInp.placeholder="何をしますか？（内容）";noteInp.value=activeSess.note||"";
          noteInp.style.cssText="width:100%;margin:0 0 6px 34px;padding:6px 9px;background:#1e293b;border:1px solid #334155;border-radius:7px;color:#e2e8f0;font-size:12px;font-family:inherit;box-sizing:border-box;max-width:calc(100% - 34px)";
          noteInp.addEventListener('change',(()=>{const sid=activeSess.uid,it=item,rec=t;return e=>{ const v=e.target.value.trim(); const ss=(rec.sessions||[]).map(x=>x.uid===sid?{...x,note:v}:x); setTodo(vd,it.id,{...rec,sessions:ss}); };})());
          c.appendChild(noteInp);
        }
      }
    });
    wrap.appendChild(c);
    }
  }

  // ── TODO（未完了のみ）──
  {
    const open=(state.tasks&&state.tasks.todo||[]).filter(t=>!t.done);
    if(open.length){
      const prio=t=>(t.imp&&t.urg)?0:t.urg?1:t.imp?2:3;
      const dueVal=t=>t.due?parseDS(t.due).getTime():Infinity;
      open.sort((a,b)=>prio(a)-prio(b)||dueVal(a)-dueVal(b));
      const c=div({className:"card",style:{padding:"12px 14px",marginBottom:"10px"}});
      c.appendChild(div({style:{fontSize:"13px",fontWeight:700,color:"#38bdf8",marginBottom:"6px"}},`✅ TODO ${open.length}件`));
      open.slice(0,12).forEach(t=>{
        const sub=t.due?(()=>{const days=Math.round((parseDS(t.due)-parseDS(todayStr()))/86400000);return days<0?`期日超過${-days}日`:days===0?"今日が期日":`あと${days}日`;})():null;
        c.appendChild(checkRow(false,t.text,sub,()=>{ state.tasks.todo=state.tasks.todo.map(x=>x.uid===t.uid?{...x,done:true}:x); saveTasks(); showToast(`✅ ${t.text}`); render(); }));
      });
      wrap.appendChild(c);
    }
  }

  wrap.appendChild(btn({style:{width:"100%",padding:"11px",marginTop:"4px",background:"linear-gradient(135deg,#0ea5e9,#6366f1)",border:"none",borderRadius:"8px",color:"#fff",fontSize:"13px",fontWeight:700,cursor:"pointer"},
    onClick:()=>{ exitWidget(); render(); }},"アプリを開く"));
  return wrap;
}
function exitWidget(){ state.widget=false; try{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); }catch(_){}}

// ── 今日タブ ──────────────────────────────────────
function renderToday(vd,ds,curH,isToday){
  const wrap=div({style:{maxWidth:"600px",margin:"0 auto",padding:"10px 16px 60px"}},[]);
  if(!isToday){
    const isFuture=vd>ds;
    wrap.appendChild(div({style:{background:"#1e3a5f22",border:"1px solid #1e3a5f",borderRadius:"10px",padding:"8px 12px",marginBottom:"8px",fontSize:"12px",color:"#64748b"}},
      isFuture?"📅 未来の日付を表示中 — 事前に記録できます":"📅 過去の記録を表示中 — 編集可能です"));
  }
  wrap.appendChild(renderDailyPanel(vd));
  wrap.appendChild(renderSummaryCard(vd,isToday));
  return wrap;
}

function renderDailyPanel(vd){
  const d=getDaily(vd);
  const drinks=(d.drinks||[]).map(dr=>({...dr,drinkType:resolveDT(dr)}));
  const totalG=drinks.reduce((a,b)=>a+pureAlcohol(b.ml,b.drinkType.pct),0);
  const foods=d.foods||[];
  const sh=getNightSleepHours(vd);
  const wh=d.workStart!=null&&d.workEnd!=null?Math.max(0,Math.round(((d.workEnd-d.workStart+24)%24-1)*10)/10):null;
  const ot=d.overtime||0;
  const scol=sh==null?"#475569":sh>=7?"#22c55e":sh<=5?"#ef4444":"#eab308";
  const wcol=d.water==null?"#475569":d.water>=2?"#22c55e":d.water<=1?"#f97316":"#eab308";

  const hOpts=[{value:"",label:"—"},...Array.from({length:48},(_,i)=>{const hv=Math.floor(i/2);const mv=(i%2)*30;return{value:hv+mv/60,label:`${String(hv).padStart(2,"0")}:${String(mv).padStart(2,"0")}`};})];

  function mkSel(field,value,opts){
    const s=document.createElement('select');
    s.className='sel';
    opts.forEach(({value:v,label:l})=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(String(v)===String(value))o.selected=true;s.appendChild(o);});
    s.addEventListener('change',e=>{setDaily(vd,{[field]:e.target.value===""?null:Number(e.target.value)});render();});
    return s;
  }

  const card=div({className:"card"},[
    div({style:{fontSize:"13px",fontWeight:700,color:"#e2e8f0",marginBottom:"12px"}},"📋 今日の生活記録"),

    // 睡眠（起床＝今朝の目覚め／就寝＝今夜寝る時刻。別々に記録）
    (()=>{
      const sleepRow=(label,key,val,hint)=>{
        const row=div({style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"6px"}});
        row.appendChild(div({style:{fontSize:"11px",color:"#94a3b8",width:"104px",flexShrink:0}},label));
        const inp=document.createElement('input');inp.type='time';
        if(val!=null){const h=Math.floor(val),m=Math.round((val%1)*60);inp.value=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
        inp.style.cssText="flex:1;min-width:0;padding:8px 10px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:15px;font-family:inherit;color-scheme:dark";
        inp.addEventListener('change',e=>{
          if(e.target.value===""){setDaily(vd,{[key]:null});render();return;}
          const parts=e.target.value.split(':');const h=Number(parts[0]),mm=Number(parts[1]);
          if(!isNaN(h)&&!isNaN(mm)){setDaily(vd,{[key]:h+mm/60});render();}
        });
        row.appendChild(inp);
        if(val==null){
          const nowBtn=btn({style:{fontSize:"12px",padding:"8px 12px",background:"#0ea5e918",border:"1px solid #0ea5e9",borderRadius:"8px",color:"#38bdf8",cursor:"pointer",fontWeight:700,flexShrink:0}},"今");
          nowBtn.addEventListener('click',()=>{const now=new Date();setDaily(vd,{[key]:now.getHours()+now.getMinutes()/60});render();});
          row.appendChild(nowBtn);
        }
        if(val!=null){const cl=btn({style:{fontSize:"16px",padding:"0 4px",background:"transparent",border:"none",color:"#475569",cursor:"pointer",flexShrink:0}},"×");cl.addEventListener('click',()=>{setDaily(vd,{[key]:null});render();});row.appendChild(cl);}
        return row;
      };
      return div({style:{marginBottom:"12px"}},[
        div({style:{display:"flex",justifyContent:"space-between",marginBottom:"6px"}},[
          span({style:{fontSize:"12px",color:"#94a3b8"}},"😴 睡眠"),
          span({style:{fontSize:"12px",fontWeight:700,color:scol}},sh!=null?`前夜 ${Math.floor(sh)}時間${String(Math.round((sh%1)*60)).padStart(2,'0')}分`:"—")
        ]),
        sleepRow("🌅 起床（今朝）","wakeTime",d.wakeTime),
        sleepRow("🌙 就寝（今夜）","bedTime",d.bedTime),
        div({style:{fontSize:"10px",color:"#475569"}},"起床＝今朝の目覚め／就寝＝今夜寝る時刻。「今」で現在時刻を記録。予定「実際」列に反映されます")
      ]);
    })(),

    // 中途覚醒（前夜の睡眠中に目が覚めた分。実睡眠から差し引かれる）
    (()=>{
      const awakes=d.awakenings||[];
      const total=awakes.reduce((a,x)=>a+(x.mins||0),0);
      const sec=div({style:{marginBottom:"12px"}});
      sec.appendChild(div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},[
        span({style:{fontSize:"12px",color:"#94a3b8"}},[
          txt("🌙 中途覚醒"),
          awakes.length>0?span({style:{fontSize:"11px",color:"#64748b",marginLeft:"6px"}},`${awakes.length}回・計${total>=60?`${Math.floor(total/60)}h`:""}${total%60}m`):null
        ]),
        btn({style:{fontSize:"11px",padding:"3px 10px",background:"#6366f118",border:"1px solid #6366f1",borderRadius:"8px",color:"#a5b4fc",cursor:"pointer",fontWeight:600},
          onClick:()=>{ state.modal="addAwake"; state.newAwakeH=3; state.newAwakeM=0; state.newAwakeEndH=3; state.newAwakeEndM=20; render(); }},"+ 記録")
      ]));
      if(awakes.length===0){
        sec.appendChild(div({style:{fontSize:"11px",color:"#475569",textAlign:"center",padding:"6px 0"}},"まだ記録がありません"));
      } else {
        const list=div({style:{display:"flex",flexWrap:"wrap",gap:"5px"}});
        [...awakes].sort((a,b)=>(a.hour*60+(a.min||0))-(b.hour*60+(b.min||0))).forEach(n=>{
          const tL=`${String(n.hour).padStart(2,'0')}:${String(n.min||0).padStart(2,'0')}`;
          const eL=n.endHour!=null?`${String(n.endHour).padStart(2,'0')}:${String(n.endMin||0).padStart(2,'0')}`:null;
          const durL=n.mins>=60?`${Math.floor(n.mins/60)}h${n.mins%60}m`:`${n.mins||0}m`;
          const item=div({style:{display:"flex",alignItems:"center",gap:"5px",padding:"3px 10px",background:"#0f172a",borderRadius:"20px",border:"1px solid #1e3a5f",cursor:"pointer"}});
          item.appendChild(span({style:{fontSize:"11px",color:"#a5b4fc"}},eL?`${tL}〜${eL} (${durL})`:`${tL} ${durL}`));
          item.addEventListener('click',(()=>{const aw=n;return()=>{ state.modal="editAwake"; state.editAwakeUid=aw.uid; state.newAwakeH=aw.hour; state.newAwakeM=aw.min||0; state.newAwakeEndH=aw.endHour!=null?aw.endHour:aw.hour; state.newAwakeEndM=aw.endHour!=null?(aw.endMin||0):aw.min||0; render(); };})());
          const del=btn({style:{background:"transparent",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px",padding:"0"}},"×");
          del.addEventListener('click',(()=>{const uid=n.uid;return(e)=>{e.stopPropagation(); pushUndo("中途覚醒を削除しました");const nd={...getDaily(vd)};nd.awakenings=(nd.awakenings||[]).filter(x=>x.uid!==uid);setDaily(vd,nd);render();};})());
          item.appendChild(del);
          list.appendChild(item);
        });
        sec.appendChild(list);
        sec.appendChild(div({style:{fontSize:"10px",color:"#475569",marginTop:"4px"}},"前夜の睡眠中に目が覚めた分。実睡眠から差し引かれます"));
      }
      return sec;
    })(),

    // 昼寝
    (()=>{
      const naps=d.naps||[];
      const napTotal=naps.reduce((a,n)=>a+(n.mins||0),0);
      const sec=div({style:{marginBottom:"12px"}});
      sec.appendChild(div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},[
        span({style:{fontSize:"12px",color:"#94a3b8"}},[
          txt("💤 昼寝"),
          naps.length>0?span({style:{fontSize:"11px",color:"#64748b",marginLeft:"6px"}},`計${Math.floor(napTotal/60)>0?`${Math.floor(napTotal/60)}h`:""}${napTotal%60}m`):null
        ]),
        btn({style:{fontSize:"11px",padding:"3px 10px",background:"#0ea5e918",border:"1px solid #0ea5e9",borderRadius:"8px",color:"#38bdf8",cursor:"pointer",fontWeight:600},
          onClick:()=>{
            const now=new Date();
            state.modal="addNap";
            state.newNapH=now.getHours();state.newNapM=now.getMinutes();
            // 終了時刻の初期値は30分後
            const end=new Date(now.getTime()+30*60000);
            state.newNapEndH=end.getHours();state.newNapEndM=end.getMinutes();
            render();
          }},"+ 記録")
      ]));
      if(naps.length===0){
        sec.appendChild(div({style:{fontSize:"11px",color:"#475569",textAlign:"center",padding:"6px 0"}},"まだ記録がありません"));
      } else {
        const list=div({style:{display:"flex",flexWrap:"wrap",gap:"5px"}});
        [...naps].sort((a,b)=>(a.hour*60+(a.min||0))-(b.hour*60+(b.min||0))).forEach((n,i)=>{
          const tL=`${String(n.hour).padStart(2,'0')}:${String(n.min||0).padStart(2,'0')}`;
          const eL=n.endHour!=null?`${String(n.endHour).padStart(2,'0')}:${String(n.endMin||0).padStart(2,'0')}`:null;
          const durL=n.mins>=60?`${Math.floor(n.mins/60)}h${n.mins%60}m`:`${n.mins}m`;
          const item=div({style:{display:"flex",alignItems:"center",gap:"5px",padding:"3px 10px",background:"#0f172a",borderRadius:"20px",border:"1px solid #1e3a5f",cursor:"pointer"}});
          item.appendChild(span({style:{fontSize:"11px",color:"#94a3b8"}},eL?`${tL}〜${eL} (${durL})`:`${tL}〜 ${durL}`));
          item.addEventListener('click',(()=>{const nap=n;return()=>{
            state.modal="editNap";
            state.editNapUid=nap.uid;
            state.newNapH=nap.hour;state.newNapM=nap.min||0;
            state.newNapEndH=nap.endHour!=null?nap.endHour:nap.hour;
            state.newNapEndM=nap.endHour!=null?(nap.endMin||0):nap.min||0;
            render();
          };})()); 
          const del=btn({style:{background:"transparent",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px",padding:"0"}},"×");
          del.addEventListener('click',(()=>{const uid=n.uid;return(e)=>{e.stopPropagation();
            pushUndo("昼寝を削除しました");const nd={...getDaily(vd)};nd.naps=(nd.naps||[]).filter(x=>x.uid!==uid);setDaily(vd,nd);render();
          };})()); 
          item.appendChild(del);
          list.appendChild(item);
        });
        sec.appendChild(list);
      }
      return sec;
    })(),

    // 飲水（100ml単位）
    // ※タップのたびに全体を再描画するとレイアウトがずれて、＋のつもりが−を押して
    //   しまう不具合があったため、この操作は値表示だけをその場で更新する（render()を呼ばない）。
    (()=>{
      let cur=d.water!=null?d.water:0;
      const wc=v=>v>=2?"#22c55e":(v>0&&v<=1)?"#f97316":v>0?"#eab308":"#475569";
      const valTop=span({style:{fontSize:"13px",fontWeight:700,color:wc(cur)}},cur>0?`${cur}L（${Math.round(cur*1000)}ml）`:"—");

function getGoalKey(type, dateStr){
  const p=dateStr.split('-');
  const y=parseInt(p[0]),m=parseInt(p[1]),d2=parseInt(p[2]);
  switch(type){
    case 'daily': return `daily_${dateStr}`;
    case 'weekly':{
      const n=new Date(y,m-1,d2);const day=n.getDay();
      const diff=day===0?-6:1-day;n.setDate(n.getDate()+diff);
      return `weekly_${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    }
    case 'monthly': return `monthly_${y}-${String(m).padStart(2,'0')}`;
    case 'quarterly':{
      const q=Math.ceil(m/3);return `quarterly_${y}-Q${q}`;
    }
    case 'yearly': return `yearly_${y}`;
  }
}

function getGoal(type, dateStr){
  return state.goals[getGoalKey(type,dateStr)]||{text:"",done:false,progress:""};
}

function setGoal(type, dateStr, data){
  const key=getGoalKey(type,dateStr);
  state.goals[key]={...getGoal(type,dateStr),...data};
  safeSet(STORAGE_KEY+"_goals",JSON.stringify(state.goals));
  render();
}

function goalPeriodLabel(type, dateStr){
  const p=dateStr.split('-');
  const y=parseInt(p[0]),m=parseInt(p[1]);
  switch(type){
    case 'daily': return new Date(...p.map((v,i)=>i===1?parseInt(v)-1:parseInt(v))).toLocaleDateString("ja-JP",{month:"short",day:"numeric",weekday:"short"});
    case 'weekly':{
      const key=getGoalKey('weekly',dateStr);
      const mon=key.replace('weekly_','');
      const mp=mon.split('-');const monD=new Date(parseInt(mp[0]),parseInt(mp[1])-1,parseInt(mp[2]));
      const sunD=new Date(monD);sunD.setDate(sunD.getDate()+6);
      return `${monD.getMonth()+1}/${monD.getDate()}〜${sunD.getMonth()+1}/${sunD.getDate()}`;
    }
    case 'monthly': return `${y}年${m}月`;
    case 'quarterly':{const q=Math.ceil(m/3);return `${y}年 Q${q}`;}
    case 'yearly': return `${y}年`;
  }
}

// ══ 目標ツリー（年間目標→下位目標へ掘り下げる階層構造）══
function saveGoalTree(){ safeSet(STORAGE_KEY+"_goaltree",JSON.stringify(state.goalTree)); }
function gtNewId(){ return "g"+Date.now().toString(36)+Math.floor(Math.random()*1000); }
// 再帰探索：id のノードと親配列を返す
function gtFind(id, list=state.goalTree, parent=null){
  for(const n of list){
    if(n.id===id) return {node:n, siblings:list, parent};
    if(n.children&&n.children.length){ const r=gtFind(id,n.children,n); if(r)return r; }
  }
  return null;
}
// サブツリーの葉（子を持たないノード）の達成数/総数
function gtProgress(node){
  if(!node.children||!node.children.length) return {done:node.done?1:0, total:1};
  let d=0,t=0; node.children.forEach(c=>{const r=gtProgress(c);d+=r.done;t+=r.total;});
  return {done:d,total:t};
}
// 期間連動：ノードに periodType（yearly等）を割り当て、periodKey で特定の期間に紐付ける
const GT_PERIOD_LABELS={yearly:"年間",quarterly:"四半期",monthly:"月次",weekly:"週間",daily:"日次"};
function gtCollectByPeriod(type, key, list=state.goalTree, out=[]){
  (list||[]).forEach(n=>{
    if(n.periodType===type && n.periodKey===key) out.push(n);
    if(n.children&&n.children.length) gtCollectByPeriod(type,key,n.children,out);
  });
  return out;
}
// 一日目標の複数日対応：dailyEnd があれば periodKey の日付〜dailyEnd の各日に表示。完了は日ごと(dailyDone)。
function dailyGoalStart(n){ if(!n||n.periodType!=="daily"||!n.periodKey)return null; const p=pkParse(n.periodKey); return (p&&p.date)||n.periodKey.replace("daily_",""); }
function isRangeDaily(n){ const s=dailyGoalStart(n); return !!(s && n.dailyEnd && n.dailyEnd>s); }
function gtDailyActive(n, vd){ const s=dailyGoalStart(n); if(!s)return false; const e=(n.dailyEnd&&n.dailyEnd>s)?n.dailyEnd:s; return vd>=s && vd<=e; }
function gtCollectDaily(vd, list=state.goalTree, out=[]){ (list||[]).forEach(n=>{ if(gtDailyActive(n,vd))out.push(n); if(n.children&&n.children.length)gtCollectDaily(vd,n.children,out); }); return out; }
// 直近（vdを含む期間）の週間/月次などの目標の下位にある「期日なし」の未達成の葉目標を集める。
// 予定タブ・今日ヴィジェットに「今やるべき具体目標」として表示するため。{node, anc}（ancは連動元の期間目標）。
function gtCollectPeriodlessActive(vd, list=state.goalTree, ancestor=null, out=[]){
  (list||[]).forEach(n=>{
    const hasPeriod=!!(n.periodType&&n.periodKey);
    let anc=ancestor;
    if(hasPeriod){ const r=goalPeriodRange(n.periodType,n.periodKey); anc=(r && vd>=r.start && vd<=r.end)?n:null; } // 最も近い期間祖先が「有効(vdを含む)」なら連動、無効なら切る
    const isLeaf=!(n.children&&n.children.length);
    if(!hasPeriod && ancestor && isLeaf && !n.done) out.push({node:n, anc:ancestor});
    if(!isLeaf) gtCollectPeriodlessActive(vd, n.children, anc, out);
  });
  return out;
}
function dailyGoalDone(n, vd){ return isRangeDaily(n) ? !!(n.dailyDone&&n.dailyDone[vd]) : !!n.done; }
function setDailyGoalDone(n, vd, val){ if(isRangeDaily(n)){ const f=gtFind(n.id); if(f){ const dd={...(f.node.dailyDone||{})}; if(val)dd[vd]=new Date().toISOString(); else delete dd[vd]; f.node.dailyDone=dd; saveGoalTree(); } } else { setGoalDone(n.id,val); } }
// 目標の達成状態を切替。達成時は達成時刻(doneAt)を記録し、予定の「実績」に達成マーカーとして表示できるようにする。
function setGoalDone(id, val){ gtUpdate(id, val?{done:true,doneAt:new Date().toISOString()}:{done:false,doneAt:null}); }
// 目標を「予定」として追加する（予定タブの日スケジュールに新規予定を作成）。
// ★連動なし★：作成される予定は、目標の達成状態やスケジュールの実績とは完全に独立。
//   fromGoal等の紐付けは一切しないため、予定を実績化しても目標は達成にならず、目標を達成しても予定は消化されない。
function openGoalAsEvent(node, targetDate){
  const text=((node&&node.text)||"目標").trim()||"目標";
  const target=targetDate||state.viewDate||todayStr();
  const now=new Date();
  state.goalTreeModal=null; state.goalPeriodModal=null;
  state.tab="予定"; state.scheduleSubTab="日"; state.widget=false; state.viewDate=target;
  state.modal="addEvent"; state.editEventUid=null; state.editEventIsRepeat=false; state.editEventDate=target;
  state.newEvDate=target; state.newEvEndDate=null; state.newEvTitle="🎯 "+text;
  state.newEvH=now.getHours(); state.newEvM=0;
  state.newEvEndH=Math.min(23,now.getHours()+1); state.newEvEndM=0; state.newEvEndNextDay=false;
  state.newEvRepeat="none"; state.newEvColor=EV_COLORS[0];
  state.newEvWeekdays=[parseDS(target).getDay()];
  state.newEvFromTask=null; state.newEvAllDay=false; state.newEvPlace=""; state.newEvNote=""; state.newEvPreDays=0;
  render();
}
function dailyRangeLabel(n){ const s=dailyGoalStart(n); if(!s||!isRangeDaily(n))return ""; return `📅 ${mdLabel(s)}〜${mdLabel(n.dailyEnd)}`; }
// 達成済みか（葉なら done、親なら全下位が達成）
function gtAchieved(n){ const p=gtProgress(n); return p.total>0 && p.done===p.total; }
// periodKey → 日付範囲 {start,end}
function goalPeriodRange(periodType, periodKey){
  if(!periodType||!periodKey) return null;
  const p=pkParse(periodKey); if(!p) return null;
  if(periodType==="daily") return {start:p.date, end:p.date};
  if(periodType==="weekly"){ const d=parseDS(p.monday); d.setDate(d.getDate()+6); return {start:p.monday, end:fmtDS(d)}; }
  if(periodType==="monthly"){ const s=`${p.y}-${String(p.m).padStart(2,'0')}-01`; return {start:s, end:fmtDS(new Date(p.y,p.m,0))}; }
  if(periodType==="quarterly"){ const qm=(p.q-1)*3+1; return {start:`${p.y}-${String(qm).padStart(2,'0')}-01`, end:fmtDS(new Date(p.y,qm+2,0))}; }
  if(periodType==="yearly") return {start:`${p.y}-01-01`, end:`${p.y}-12-31`};
  return null;
}
// 連結した習慣（ルーティン/定期ルーティン）の期間内の実施回数
function countLinkedRoutineDone(linked, startDs, endDs){
  if(!linked||!linked.length) return 0;
  const end = endDs>todayStr()?todayStr():endDs;
  if(startDs>end) return 0;
  let cnt=0, d=startDs;
  for(let i=0;i<400 && d<=end;i++){
    const td=state.todos[d]||{};
    linked.forEach(l=>{
      if(l.t==="d"){ const item=TODO_ITEMS.find(x=>x.id===l.id); if(item){ const t=td[item.id]||{}; let done=false; if(item.type==="check")done=!!t.checked; else if(item.multi)done=(t.sessions||[]).some(s=>s.startTime&&s.endTime); else done=!!(t.startTime&&t.endTime); if(done)cnt++; } }
      else { const rec=td[l.id]; if(rec&&rec.checked)cnt++; }
    });
    d=addDays(d,1);
  }
  return cnt;
}
// 連結習慣の名前一覧
function linkedRoutineNames(linked){
  return (linked||[]).map(l=> l.t==="d" ? (TODO_ITEMS.find(x=>x.id===l.id)||{}).label : ((state.customTodos||[]).find(c=>c.uid===l.id)||{}).label ).filter(Boolean);
}
// AIコーチ用：目標ツリーを階層・期間・進捗・連結習慣つきで文字列化
function buildGoalCoachContext(){
  const today=todayStr(); const lines=[];
  const walk=(nodes,depth)=>{ (nodes||[]).forEach(n=>{
    const prog=gtProgress(n);
    const period=n.periodType?`[${GT_PERIOD_LABELS[n.periodType]||n.periodType}${n.periodKey?" "+pkShort(n.periodKey):""}]`:"[期間なし]";
    const status=n.done?"達成":(prog.total>1?`下位達成${prog.done}/${prog.total}`:"未達成");
    let linkInfo="";
    if(n.linkedRoutines&&n.linkedRoutines.length){ const range=goalPeriodRange(n.periodType,n.periodKey)||{start:today.slice(0,7)+"-01",end:today}; const cnt=countLinkedRoutineDone(n.linkedRoutines,range.start,range.end); linkInfo=` 連結習慣[${linkedRoutineNames(n.linkedRoutines).join("・")}]を期間内${cnt}回実施`; }
    lines.push(`${"  ".repeat(depth)}・${n.text||"(無題)"} ${period} ${status}${linkInfo}${n.note?` メモ:${n.note}`:""}`);
    if(n.children&&n.children.length) walk(n.children,depth+1);
  }); };
  walk(state.goalTree,0);
  return lines.join("\n")||"（目標がまだ登録されていません）";
}
// 期間別表示用：当該期間の目標に加え、過去の期間で未達成のものも繰り越して返す。
// same-type の periodKey は同一プレフィックスなので文字列比較で前後判定できる。
function gtCollectByPeriodCarry(type, vd){
  const curKey=getGoalKey(type,vd);
  const cur=[], carry=[];
  const walk=list=>{ (list||[]).forEach(n=>{
    if(n.periodType===type && n.periodKey){
      if(n.periodKey===curKey) cur.push(n);
      else if(n.periodKey<curKey && !gtAchieved(n)) carry.push(n); // 過去かつ未達成
    }
    if(n.children&&n.children.length) walk(n.children);
  }); };
  walk(state.goalTree);
  return {cur, carry};
}
// periodKey（例 quarterly_2026-Q1）の解析・表示・生成
function pkParse(key){
  if(!key) return null;
  if(key.startsWith('yearly_')) return {y:+key.slice(7)};
  if(key.startsWith('quarterly_')){ const s=key.slice(10).split('-Q'); return {y:+s[0], q:+s[1]}; }
  if(key.startsWith('monthly_')){ const s=key.slice(8).split('-'); return {y:+s[0], m:+s[1]}; }
  if(key.startsWith('weekly_')) return {monday:key.slice(7)};
  if(key.startsWith('daily_')) return {date:key.slice(6)};
  return null;
}
function pkLabel(key){
  const p=pkParse(key); if(!p) return "—";
  if(key.startsWith('yearly_')) return `${p.y}年`;
  if(key.startsWith('quarterly_')) return `${p.y}年 Q${p.q}`;
  if(key.startsWith('monthly_')) return `${p.y}年${p.m}月`;
  if(key.startsWith('weekly_')) return goalPeriodLabel('weekly',p.monday);
  if(key.startsWith('daily_')) return goalPeriodLabel('daily',p.date);
  return "—";
}
function pkShort(key){
  const p=pkParse(key); if(!p) return "";
  if(key.startsWith('yearly_')) return `${p.y}`;
  if(key.startsWith('quarterly_')) return `${p.y} Q${p.q}`;
  if(key.startsWith('monthly_')) return `${p.y}/${p.m}`;
  if(key.startsWith('weekly_')){ const d=p.monday.split('-'); return `${+d[1]}/${+d[2]}週`; }
  if(key.startsWith('daily_')){ const d=p.date.split('-'); return `${+d[1]}/${+d[2]}`; }
  return "";
}
// 期間タイプ選択時の既定 periodKey（親の年に合わせ、閲覧中の日付を基準に）
function pkDefault(type, parentKey, viewDate){
  const vp=(viewDate||todayStr()).split('-'); const cy=+vp[0], cm=+vp[1];
  const pp=parentKey?pkParse(parentKey):null;
  const by=(pp&&pp.y)?pp.y:cy;
  switch(type){
    case 'yearly': return `yearly_${by}`;
    case 'quarterly': return `quarterly_${by}-Q${Math.ceil(cm/3)}`;
    case 'monthly': return `monthly_${by}-${String(cm).padStart(2,'0')}`;
    case 'weekly': return getGoalKey('weekly', viewDate||todayStr());
    case 'daily': return `daily_${viewDate||todayStr()}`;
  }
  return null;
}
// 旧・期間別の自由記入目標(state.goals)を目標ツリーへ一度だけ移行する
function migrateGoalsToTree(){
  let done=false; try{ done=localStorage.getItem(STORAGE_KEY+"_goalsmigrated")==="1"; }catch{}
  if(done) return;
  const goals=state.goals||{};
  const existing=new Set();
  (function walk(list){ (list||[]).forEach(n=>{ existing.add((n.periodKey||"")+"|"+(n.text||"")); if(n.children)walk(n.children); }); })(state.goalTree||[]);
  let n=0;
  Object.keys(goals).forEach(k=>{
    const g=goals[k]; if(!g) return;
    const text=(g.text||"").trim(); if(!text) return;
    const type=k.split('_')[0];
    if(!GT_PERIOD_LABELS[type]||!pkParse(k)) return; // 期間形式のキーのみ
    const sig=k+"|"+text; if(existing.has(sig)) return;
    state.goalTree.push({id:gtNewId(), text, done:!!g.done, note:(g.progress||"").trim(), collapsed:false, children:[], periodType:type, periodKey:k});
    existing.add(sig); n++;
  });
  if(n>0){ saveGoalTree(); state._goalsMigratedCount=n; }
  try{ localStorage.setItem(STORAGE_KEY+"_goalsmigrated","1"); }catch{}
}
function gtAddChild(parentId, text){
  const node={id:gtNewId(), text:text.trim(), done:false, collapsed:false, children:[]};
  if(parentId==null){ state.goalTree=[...state.goalTree, node]; }
  else { const f=gtFind(parentId); if(f){ f.node.children=[...(f.node.children||[]), node]; f.node.collapsed=false; } }
  saveGoalTree();
}
function gtUpdate(id, patch){ const f=gtFind(id); if(f){ Object.assign(f.node, patch); saveGoalTree(); } }
function gtDelete(id){ const f=gtFind(id); if(f){ pushUndo("目標を削除しました"); const i=f.siblings.indexOf(f.node); if(i>=0)f.siblings.splice(i,1); saveGoalTree(); } }
